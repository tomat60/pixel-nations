<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><rect width="1400" height="900" fill="#101714"/><text x="40" y="55" font-family="Arial" font-size="34" font-weight="700" fill="#fff4d5">Aurelian V2 rejection map — failures that must not recur</text><rect x="45" y="90" width="630" height="330" rx="20" fill="#7a3030" stroke="#ffb0a0" stroke-width="2"/><text x="70" y="130" font-family="Arial" font-size="26" font-weight="700" fill="#fff4d5">Portrait failure</text><rect x="80" y="155" width="210" height="230" fill="#202d26"/><rect x="80" y="155" width="210" height="90" fill="#33483e"/><text x="100" y="205" font-family="Arial" font-size="18" fill="#d9ceb3">empty upper field</text><path d="M120 370 L250 280" fill="none" stroke="#d4b77c" stroke-width="18"/><g font-family="Arial" font-size="18" fill="#d9ceb3"><text x="315" y="205">• giant dead space</text><text x="315" y="245">• bridge cropped low</text><text x="315" y="285">• village clipped high</text><text x="315" y="325">• no single visual route</text></g><rect x="725" y="90" width="630" height="330" rx="20" fill="#7a3030" stroke="#ffb0a0" stroke-width="2"/><text x="750" y="130" font-family="Arial" font-size="26" font-weight="700" fill="#fff4d5">Desktop failure</text><rect x="760" y="155" width="260" height="230" fill="#202d26"/><circle cx="950" cy="220" r="45" fill="#7c9162"/><rect x="780" y="300" width="160" height="35" fill="#9a8a70" stroke="#ede0bb" stroke-width="2"/><g font-family="Arial" font-size="18" fill="#d9ceb3"><text x="1045" y="205">• settlement too small</text><text x="1045" y="245">• bridge reads as slabs</text><text x="1045" y="285">• landmark detached</text><text x="1045" y="325">• no streets / yards</text></g><rect x="45" y="465" width="1310" height="360" rx="20" fill="#7a3030" stroke="#ffb0a0" stroke-width="2"/><text x="70" y="510" font-family="Arial" font-size="26" font-weight="700" fill="#fff4d5">Asset-pile failure</text><g fill="#8a9b72" stroke="#eee0bb" stroke-width="2"><rect x="110" y="555" width="120" height="90"/><rect x="245" y="550" width="120" height="90"/><rect x="175" y="660" width="120" height="90"/><rect x="325" y="665" width="120" height="90"/></g><line x1="100" y1="540" x2="470" y2="770" stroke="#ff9a8f" stroke-width="10"/><line x1="470" y1="540" x2="100" y2="770" stroke="#ff9a8f" stroke-width="10"/><text x="520" y="575" font-family="Arial" font-size="18" fill="#d9ceb3">Reject any cluster that cannot answer:</text><g font-family="Arial" font-size="20" font-weight="700" fill="#ffe49a"><text x="520" y="620">Where is the plaza?</text><text x="520" y="660">How does a person walk from bridge to landmark?</text><text x="520" y="700">Which edge is civic, domestic and productive?</text><text x="520" y="740">Why is each gap or fence there?</text></g></svg>