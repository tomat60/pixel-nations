<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1688" viewBox="0 0 780 1688"><defs><style>.bg{fill:#101714}.panel{fill:#18231d;stroke:#d6b96a;stroke-width:2}.land{fill:#78915d;stroke:#d8d2a6;stroke-width:2}.water{fill:#315f73}.road{fill:none;stroke:#d4b77c;stroke-width:18;stroke-linecap:round}.bridge{fill:#9a8a70;stroke:#ede0bb;stroke-width:2}.zone{fill-opacity:.75;stroke:#f3e7ba;stroke-width:2}.label{font-family:Arial,sans-serif;fill:#fff4d5;font-weight:700}.small{font-family:Arial,sans-serif;fill:#d9ceb3;font-size:18px}.metric{font-family:Arial,sans-serif;fill:#ffe49a;font-size:20px;font-weight:700}.ok{fill:#294e38;stroke:#9ee2ad;stroke-width:2}.arrow{stroke:#fff1ad;stroke-width:4;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#fff1ad"/></marker></defs><rect class="bg" width="100%" height="100%"/><text class="label" x="35" y="55" font-size="30">Aurelian V3 — Portrait framing (390×844 equivalent)</text><rect class="panel" x="35" y="85" width="710" height="1530" rx="24"/><path class="water" d="M35 800 C210 730 350 780 475 735 C590 695 665 720 745 680 V1615 H35Z"/><path class="land" d="M35 85 H745 V680 C650 720 570 690 470 735 C340 790 210 730 35 800Z"/><path class="road" d="M125 1480 C220 1260 250 1110 345 990 C420 895 485 790 530 655 C570 530 560 400 500 270"/><rect class="bridge" x="315" y="805" width="260" height="82" rx="10" transform="rotate(-54 445 846)"/><circle class="zone" fill="#a7b77a" cx="500" cy="300" r="165"/><text class="label" x="405" y="300" font-size="27">Village core</text><text class="small" x="410" y="335">plaza + landmark</text><ellipse class="zone" fill="#7b9f7a" cx="300" cy="220" rx="160" ry="90"/><text class="label" x="245" y="225" font-size="22">Homes</text><ellipse class="zone" fill="#9b805f" cx="615" cy="455" rx="105" ry="145"/><text class="label" x="565" y="455" font-size="21">Work</text><ellipse class="zone" fill="#788aa3" cx="330" cy="500" rx="120" ry="100"/><text class="label" x="280" y="505" font-size="21">Civic</text><path class="arrow" d="M140 1450 C230 1210 310 1050 420 875 C500 750 535 560 510 370"/><rect class="ok" x="65" y="1010" width="280" height="245" rx="16"/><text class="label" x="85" y="1045" font-size="23">Portrait targets</text><text class="metric" x="85" y="1085">Top dead field ≤ 9%</text><text class="metric" x="85" y="1120">Bridge fully visible</text><text class="metric" x="85" y="1155">Core in upper-middle</text><text class="metric" x="85" y="1190">Route uses vertical axis</text><text class="small" x="85" y="1225">No clipping at either end</text><text class="small" x="65" y="1580">Same authored world as desktop; camera rotates and compresses depth instead of cropping the composition.</text></svg>