<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><style>.bg{fill:#101714}.panel{fill:#18231d;stroke:#d6b96a;stroke-width:2}.land{fill:#78915d;stroke:#d8d2a6;stroke-width:2}.water{fill:#315f73}.road{fill:none;stroke:#d4b77c;stroke-width:18;stroke-linecap:round}.bridge{fill:#9a8a70;stroke:#ede0bb;stroke-width:2}.zone{fill-opacity:.75;stroke:#f3e7ba;stroke-width:2}.label{font-family:Arial,sans-serif;fill:#fff4d5;font-weight:700}.small{font-family:Arial,sans-serif;fill:#d9ceb3;font-size:18px}.metric{font-family:Arial,sans-serif;fill:#ffe49a;font-size:20px;font-weight:700}.ok{fill:#294e38;stroke:#9ee2ad;stroke-width:2}.arrow{stroke:#fff1ad;stroke-width:4;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#fff1ad"/></marker></defs><rect class="bg" width="100%" height="100%"/><text class="label" x="50" y="55" font-size="34">Aurelian V3 — Desktop composition board (16:10)</text><rect class="panel" x="40" y="85" width="1520" height="850" rx="24"/><path class="water" d="M40 565 C390 500 620 590 820 540 C1080 470 1260 520 1560 450 L1560 935 L40 935Z"/><path class="land" d="M40 85 H1560 V455 C1320 520 1120 450 890 520 C660 590 420 500 40 565Z"/><path class="road" d="M130 790 C300 700 430 650 610 610 C780 570 930 500 1120 365"/><rect class="bridge" x="635" y="548" width="260" height="75" rx="10" transform="rotate(-12 765 585)"/><circle class="zone" fill="#a7b77a" cx="1130" cy="355" r="145"/><text class="label" x="1040" y="350" font-size="27">Village core</text><text class="small" x="1030" y="380">plaza + landmark</text><ellipse class="zone" fill="#7b9f7a" cx="1270" cy="250" rx="170" ry="90"/><text class="label" x="1190" y="255" font-size="23">Homes</text><ellipse class="zone" fill="#9b805f" cx="930" cy="305" rx="145" ry="85"/><text class="label" x="865" y="310" font-size="23">Work edge</text><ellipse class="zone" fill="#788aa3" cx="1265" cy="455" rx="155" ry="80"/><text class="label" x="1195" y="460" font-size="23">Civic edge</text><path class="arrow" d="M170 760 C440 650 660 620 765 580 C900 530 1010 445 1110 385"/><rect class="ok" x="70" y="115" width="360" height="165" rx="16"/><text class="label" x="90" y="150" font-size="24">Occupancy targets</text><text class="metric" x="90" y="185">Village silhouette: 31–36%</text><text class="metric" x="90" y="215">Bridge + landings: 19–23%</text><text class="metric" x="90" y="245">Protected negative space: 22–28%</text><rect class="ok" x="70" y="310" width="360" height="160" rx="16"/><text class="label" x="90" y="345" font-size="24">Focal hierarchy</text><text class="small" x="90" y="380">1. bridge entry</text><text class="small" x="90" y="410">2. plaza / landmark</text><text class="small" x="90" y="440">3. home cluster silhouette</text><text class="small" x="980" y="890">Foreground: road/shore framing · Midground: complete bridge · Background: compact readable village</text></svg>