name: Godot Playable Aurelian Entry V1

on:
  pull_request:
    branches: [main]
    paths:
      - "game/project.godot"
      - "game/scenes/aurelian/playable_aurelian_entry_v1.gd"
      - "game/scenes/aurelian/playable_aurelian_entry_v1.tscn"
      - "game/scenes/aurelian/playable_aurelian_entry_v1_manifest.json"
      - "game/scenes/aurelian/aurelian_session_persistence_v2.gd"
      - "game/scenes/aurelian/production_map_v1.gd"
      - "game/scenes/aurelian/production_map_v1_manifest.json"
      - "game/scenes/aurelian/production_village_v1.gd"
      - "game/scenes/aurelian/production_village_v1_state_manifest.json"
      - "game/scenes/aurelian/aurelian_visible_expansion_v1_manifest.json"
      - "game/scenes/aurelian/aurelian_first_settlement_development_v1_manifest.json"
      - "game/scenes/aurelian/aurelian_first_trade_route_connection_v1_manifest.json"
      - "game/scenes/aurelian/aurelian_first_trade_caravan_dispatch_v1_manifest.json"
      - "game/scenes/aurelian/aurelian_first_city_charter_v1_manifest.json"
      - "game/scenes/aurelian/aurelian_first_nation_founding_v1_manifest.json"
      - "game/scenes/aurelian/aurelian_living_capital_vertical_slice_v1_manifest.json"
      - "game/scenes/aurelian/first_national_direction_commitment_v1_manifest.json"
      - "game/scenes/aurelian/first_national_mandate_v1_manifest.json"
      - "game/scenes/aurelian/first_empire_proclamation_v1_manifest.json"
      - "game/scenes/aurelian/directional_empire_identity_v1_manifest.json"
      - "game/scenes/aurelian/river_surge_crisis_v1_manifest.json"
      - "game/scenes/aurelian/first_rival_countermove_v1_manifest.json"
      - "game/scenes/aurelian/first_frontier_payoff_v1_manifest.json"
      - "game/scenes/aurelian/first_imperial_expansion_v1_manifest.json"
      - "game/scenes/aurelian/north_ridge_outpost_v1_manifest.json"
      - "game/scenes/aurelian/north_ridge_specialization_v1_manifest.json"
      - "game/tests/production_village_v1_test.gd"
      - "game/tests/aurelian_visible_expansion_v1_test.gd"
      - "game/tests/playable_aurelian_entry_v1_test.gd"
      - "game/tests/aurelian_first_land_claim_v1_test.gd"
      - "game/tests/aurelian_first_settlement_development_v1_test.gd"
      - "game/tests/aurelian_first_trade_route_connection_v1_test.gd"
      - "game/tests/aurelian_first_trade_caravan_dispatch_v1_test.gd"
      - "game/tests/aurelian_first_city_charter_v1_test.gd"
      - "game/tests/aurelian_first_nation_founding_v1_test.gd"
      - "game/tests/aurelian_living_capital_vertical_slice_v1_test.gd"
      - "game/tests/aurelian_first_national_direction_commitment_v1_test.gd"
      - "game/tests/aurelian_first_national_mandate_v1_test.gd"
      - "game/tests/aurelian_first_empire_proclamation_v1_test.gd"
      - "game/tests/aurelian_directional_empire_identity_v1_test.gd"
      - "game/tests/aurelian_river_surge_crisis_v1_test.gd"
      - "game/tests/aurelian_first_rival_countermove_v1_test.gd"
      - "game/tests/aurelian_first_frontier_payoff_v1_test.gd"
      - "game/tests/aurelian_first_imperial_expansion_v1_test.gd"
      - "game/tests/aurelian_north_ridge_outpost_v1_test.gd"
      - "game/tests/aurelian_north_ridge_specialization_v1_test.gd"
      - ".github/workflows/godot-playable-aurelian-entry-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-playable-aurelian-entry-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  KAYKIT_SHA: "84fa4e91af6a88989be7c99e0891cede11f2ca38"
  KAYKIT_ARCHIVE_SHA: "cfa7faff403c93fb90e8eeb448c78e6192782802a532bebed0bdb853b39f7028"
  BLENDER_VERSION: "4.3.2"
  BLENDER_BIN: "/tmp/blender/blender-4.3.2-linux-x64/blender"
  GODOT_RELEASE: "4.7.1-stable"
  GODOT_BIN: "/tmp/godot/Godot_v4.7.1-stable_linux.x86_64"
  EXPORT_DIR: "game/assets/aurelian-basin/export"
  EVIDENCE_DIR: "evidence/godot-playable-aurelian-entry-v1"

jobs:
  playable-entry:
    name: Build and capture playable Aurelian entry
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Record exact head
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_DIR}"
          git rev-parse HEAD | tee "${EVIDENCE_DIR}/exact-head.txt"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          fi

      - name: Fetch pinned Blender and KayKit
        timeout-minutes: 10
        run: |
          set -euo pipefail
          rm -rf /tmp/blender /tmp/kaykit
          mkdir -p /tmp/blender /tmp/kaykit/src
          curl -fsSL --retry 4 --retry-all-errors --connect-timeout 20 \
            "https://download.blender.org/release/Blender4.3/blender-${BLENDER_VERSION}-linux-x64.tar.xz" \
            -o /tmp/blender/blender.tar.xz
          tar -xJf /tmp/blender/blender.tar.xz -C /tmp/blender
          test -x "${BLENDER_BIN}"
          curl -fsSL --retry 4 --retry-all-errors --connect-timeout 20 \
            "https://github.com/KayKit-Game-Assets/KayKit-Medieval-Hexagon-Pack-1.0/archive/${KAYKIT_SHA}.zip" \
            -o /tmp/kaykit/source.zip
          test "$(sha256sum /tmp/kaykit/source.zip | cut -d' ' -f1)" = "${KAYKIT_ARCHIVE_SHA}"
          unzip -q /tmp/kaykit/source.zip -d /tmp/kaykit/src
          ROOT="$(find /tmp/kaykit/src -mindepth 1 -maxdepth 1 -type d | head -1)"
          test -n "$ROOT"
          echo "KAYKIT_ROOT=$ROOT" >> "$GITHUB_ENV"
          python3 -m pip install --disable-pip-version-check --no-cache-dir --user pillow

      - name: Recreate accepted shared Basin export
        timeout-minutes: 14
        run: |
          set -euo pipefail
          rm -rf "${EXPORT_DIR}"
          mkdir -p "${EXPORT_DIR}"
          export XDG_RUNTIME_DIR="${RUNNER_TEMP}/xdg-runtime"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          timeout 12m env LIBGL_ALWAYS_SOFTWARE=1 \
            "${BLENDER_BIN}" -b --python game/assets/aurelian-basin/source/aurelian_authored_terrain_v1.py -- \
            "$KAYKIT_ROOT" "$PWD/${EXPORT_DIR}" 2>&1 | tee "${EVIDENCE_DIR}/blender-author.log"
          grep -F "AURELIAN_AUTHORED_TERRAIN=PASS" "${EVIDENCE_DIR}/blender-author.log"
          test -s "${EXPORT_DIR}/aurelian_authored_terrain_v1.glb"
          cp "${EXPORT_DIR}/transform-manifest.json" "${EVIDENCE_DIR}/transform-manifest.json"
          mv "${EXPORT_DIR}/aurelian_authored_terrain_v1.blend" "${EVIDENCE_DIR}/aurelian_authored_terrain_v1.blend"
          cp game/scenes/aurelian/playable_aurelian_entry_v1_manifest.json "${EVIDENCE_DIR}/interaction-manifest.json"
          cp game/scenes/aurelian/aurelian_visible_expansion_v1_manifest.json "${EVIDENCE_DIR}/visible-expansion-manifest.json"
          cp game/scenes/aurelian/aurelian_first_settlement_development_v1_manifest.json "${EVIDENCE_DIR}/development-manifest.json"
          cp game/scenes/aurelian/aurelian_living_capital_vertical_slice_v1_manifest.json "${EVIDENCE_DIR}/living-capital-manifest.json"
          cp game/scenes/aurelian/first_national_direction_commitment_v1_manifest.json "${EVIDENCE_DIR}/national-direction-manifest.json"
          cp game/scenes/aurelian/first_national_mandate_v1_manifest.json "${EVIDENCE_DIR}/national-mandate-manifest.json"
          cp game/scenes/aurelian/first_empire_proclamation_v1_manifest.json "${EVIDENCE_DIR}/empire-proclamation-manifest.json"
          cp game/scenes/aurelian/directional_empire_identity_v1_manifest.json "${EVIDENCE_DIR}/directional-empire-identity-manifest.json"
          cp game/scenes/aurelian/river_surge_crisis_v1_manifest.json "${EVIDENCE_DIR}/river-surge-crisis-manifest.json"
          cp game/scenes/aurelian/first_rival_countermove_v1_manifest.json "${EVIDENCE_DIR}/first-rival-countermove-manifest.json"
          cp game/scenes/aurelian/first_frontier_payoff_v1_manifest.json "${EVIDENCE_DIR}/first-frontier-payoff-manifest.json"
          cp game/scenes/aurelian/first_imperial_expansion_v1_manifest.json "${EVIDENCE_DIR}/first-imperial-expansion-manifest.json"
          cp game/scenes/aurelian/north_ridge_outpost_v1_manifest.json "${EVIDENCE_DIR}/north-ridge-outpost-manifest.json"
          cp game/scenes/aurelian/north_ridge_specialization_v1_manifest.json "${EVIDENCE_DIR}/north-ridge-specialization-manifest.json"

      - name: Download pinned Godot
        timeout-minutes: 5
        run: |
          set -euo pipefail
          rm -rf /tmp/godot
          mkdir -p /tmp/godot
          curl -fsSL --retry 4 --retry-all-errors --connect-timeout 20 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" \
            -o /tmp/godot/godot.zip
          unzip -q /tmp/godot/godot.zip -d /tmp/godot
          chmod +x "${GODOT_BIN}"
          "${GODOT_BIN}" --version | tee "${EVIDENCE_DIR}/godot-version.txt"

      - name: Import and run contracts
        timeout-minutes: 7
        run: |
          set -euo pipefail
          "${GODOT_BIN}" --headless --path game --editor --quit > "${EVIDENCE_DIR}/godot-import.log" 2>&1 || {
            cat "${EVIDENCE_DIR}/godot-import.log"; exit 1;
          }
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Blender path is invalid" "${EVIDENCE_DIR}/godot-import.log"; then
            cat "${EVIDENCE_DIR}/godot-import.log"
            exit 1
          fi
          for test in aurelian_authored_terrain_v1_test production_village_v1_test aurelian_visible_expansion_v1_test production_map_v1_test production_world_v1_test aurelian_decision_loop_v1_test playable_aurelian_entry_v1_test aurelian_session_persistence_v2_test aurelian_first_land_claim_v1_test aurelian_first_settlement_development_v1_test aurelian_first_trade_route_connection_v1_test aurelian_first_trade_caravan_dispatch_v1_test aurelian_first_city_charter_v1_test aurelian_first_nation_founding_v1_test aurelian_living_capital_vertical_slice_v1_test aurelian_first_national_direction_commitment_v1_test aurelian_first_national_mandate_v1_test aurelian_first_empire_proclamation_v1_test aurelian_directional_empire_identity_v1_test aurelian_river_surge_crisis_v1_test aurelian_first_rival_countermove_v1_test aurelian_first_frontier_payoff_v1_test aurelian_first_imperial_expansion_v1_test aurelian_north_ridge_outpost_v1_test aurelian_north_ridge_specialization_v1_test; do
            "${GODOT_BIN}" --headless --path game --script "res://tests/${test}.gd" > "${EVIDENCE_DIR}/${test}.log" 2>&1 || { cat "${EVIDENCE_DIR}/${test}.log"; exit 1; }
          done
          grep -F "AURELIAN_AUTHORED_TERRAIN_V1_TEST: PASS" "${EVIDENCE_DIR}/aurelian_authored_terrain_v1_test.log"
          grep -F "PRODUCTION_VILLAGE_V1_TEST: PASS" "${EVIDENCE_DIR}/production_village_v1_test.log"
          grep -F "AURELIAN_VISIBLE_EXPANSION_V1_TEST: PASS" "${EVIDENCE_DIR}/aurelian_visible_expansion_v1_test.log"
          grep -F "PRODUCTION_MAP_V1_TEST: PASS" "${EVIDENCE_DIR}/production_map_v1_test.log"
          grep -F "PRODUCTION_WORLD_V1_TEST: PASS" "${EVIDENCE_DIR}/production_world_v1_test.log"
          grep -F "AURELIAN_DECISION_LOOP_V1_TEST: PASS" "${EVIDENCE_DIR}/aurelian_decision_loop_v1_test.log"
          grep -F "GODOT_PLAYABLE_AURELIAN_ENTRY_V1_TEST: PASS" "${EVIDENCE_DIR}/playable_aurelian_entry_v1_test.log"
          grep -F "GODOT_AURELIAN_SESSION_PERSISTENCE_V2_TEST: PASS" "${EVIDENCE_DIR}/aurelian_session_persistence_v2_test.log"
          grep -F "GODOT_AURELIAN_FIRST_LAND_CLAIM_V1_TEST: PASS" "${EVIDENCE_DIR}/aurelian_first_land_claim_v1_test.log"
          grep -F "GODOT_AURELIAN_FIRST_SETTLEMENT_DEVELOPMENT_V1_TEST: PASS" "${EVIDENCE_DIR}/aurelian_first_settlement_development_v1_test.log"
          grep -F "GODOT_AURELIAN_FIRST_TRADE_ROUTE_CONNECTION_V1_TEST: PASS" "${EVIDENCE_DIR}/aurelian_first_trade_route_connection_v1_test.log"
          grep -F "GODOT_AURELIAN_FIRST_TRADE_CARAVAN_DISPATCH_V1_TEST: PASS" "${EVIDENCE_DIR}/aurelian_first_trade_caravan_dispatch_v1_test.log"
          grep -F "GODOT_AURELIAN_FIRST_CITY_CHARTER_V1_TEST: PASS" "${EVIDENCE_DIR}/aurelian_first_city_charter_v1_test.log"
          grep -F "GODOT_AURELIAN_FIRST_NATION_FOUNDING_V1_TEST: PASS" "${EVIDENCE_DIR}/aurelian_first_nation_founding_v1_test.log"
          grep -F "AURELIAN_LIVING_CAPITAL_VERTICAL_SLICE_V1_TEST: PASS" "${EVIDENCE_DIR}/aurelian_living_capital_vertical_slice_v1_test.log"
          grep -F "GODOT_AURELIAN_FIRST_NATIONAL_DIRECTION_COMMITMENT_V1_TEST: PASS" "${EVIDENCE_DIR}/aurelian_first_national_direction_commitment_v1_test.log"
          grep -F "GODOT_AURELIAN_FIRST_NATIONAL_MANDATE_V1_TEST: PASS" "${EVIDENCE_DIR}/aurelian_first_national_mandate_v1_test.log"
          grep -F "GODOT_AURELIAN_FIRST_EMPIRE_PROCLAMATION_V1_TEST: PASS" "${EVIDENCE_DIR}/aurelian_first_empire_proclamation_v1_test.log"
          grep -F "GODOT_AURELIAN_DIRECTIONAL_EMPIRE_IDENTITY_V1_TEST: PASS" "${EVIDENCE_DIR}/aurelian_directional_empire_identity_v1_test.log"
          grep -F "GODOT_AURELIAN_RIVER_SURGE_CRISIS_V1_TEST: PASS" "${EVIDENCE_DIR}/aurelian_river_surge_crisis_v1_test.log"
          grep -F "GODOT_AURELIAN_FIRST_RIVAL_COUNTERMOVE_V1_TEST: PASS" "${EVIDENCE_DIR}/aurelian_first_rival_countermove_v1_test.log"
          grep -F "GODOT_AURELIAN_FIRST_FRONTIER_PAYOFF_V1_TEST: PASS" "${EVIDENCE_DIR}/aurelian_first_frontier_payoff_v1_test.log"
          grep -F "GODOT_AURELIAN_FIRST_IMPERIAL_EXPANSION_V1_TEST: PASS" "${EVIDENCE_DIR}/aurelian_first_imperial_expansion_v1_test.log"
          grep -F "GODOT_AURELIAN_NORTH_RIDGE_OUTPOST_V1_TEST: PASS" "${EVIDENCE_DIR}/aurelian_north_ridge_outpost_v1_test.log"
          grep -F "GODOT_AURELIAN_NORTH_RIDGE_SPECIALIZATION_V1_TEST: PASS" "${EVIDENCE_DIR}/aurelian_north_ridge_specialization_v1_test.log"

      - name: Capture normal launch, founding and development states
        timeout-minutes: 9
        run: |
          set -euo pipefail
          specs=(
            "normal-launch:world_neutral"
            "world-trade-selected:world_trade_selected"
            "map-east-route-selected:map_east_route_selected"
            "map-east-route-claimed:map_east_route_claimed"
            "village-claimed:village_claimed"
            "village-founded:village_founded"
            "village-developed:village_developed"
            "returned-claimed-map:map_east_route_claimed"
            "map-east-route-connected:map_east_route_connected"
            "world-trade-route-active:world_trade_route_active"
            "reopened-connected-map:map_east_route_connected"
            "reopened-village-developed:village_developed"
            "village-first-caravan-dispatched:village_trade_dispatched"
            "map-east-route-in-use:map_east_route_in_use"
            "world-first-trade-underway:world_first_trade_underway"
            "village-first-city-chartered:village_city_chartered"
            "map-greenvale-city:map_greenvale_city"
            "world-first-city-recognized:world_first_city_recognized"
            "world-first-nation-founded:world_first_nation_founded"
            "map-aurelian-homeland:map_aurelian_homeland"
            "village-greenvale-capital:village_greenvale_capital"
            "village-national-mandate-started:village_national_mandate_started"
            "map-national-mandate-active:map_national_mandate_active"
            "world-national-mandate-underway:world_national_mandate_underway"
            "village-aurelian-imperial-capital:village_aurelian_imperial_capital"
            "map-aurelian-imperial-heartland:map_aurelian_imperial_heartland"
            "world-first-empire-proclaimed:world_first_empire_proclaimed"
            "world-river-surge-crisis:world_river_surge_crisis"
            "map-river-surge-response-loci:map_river_surge_response_loci"
            "village-river-surge-response-pending:village_river_surge_response_pending"
            "village-greenvale-shielded:village_aurelian_imperial_capital_greenvale_shielded"
            "map-greenvale-response:map_aurelian_imperial_heartland_greenvale_response"
            "world-greenvale-response:world_aurelian_river_surge_greenvale_response"
            "village-east-bridge-response:village_aurelian_imperial_capital_bridge_response"
            "map-east-bridge-response:map_aurelian_imperial_heartland_bridge_response"
            "world-east-bridge-response:world_aurelian_river_surge_bridge_response"
            "world-first-rival-countermove:world_first_rival_countermove"
            "map-first-rival-east-bridge-pressure:map_first_rival_countermove_east_bridge"
            "map-first-rival-greenvale-pressure:map_first_rival_countermove_greenvale"
            "village-first-rival-response-pending:village_first_rival_response_pending"
            "village-first-rival-stand-firm:village_first_rival_response_stand_firm"
            "map-first-rival-stand-firm:map_first_rival_response_stand_firm"
            "world-first-rival-stand-firm:world_first_rival_response_stand_firm"
            "village-first-rival-negotiate-passage:village_first_rival_response_negotiate_passage"
            "map-first-rival-negotiate-passage:map_first_rival_response_negotiate_passage"
            "world-first-rival-negotiate-passage:world_first_rival_response_negotiate_passage"
            "world-frontier-payoff-gilded-revealed:world_first_frontier_payoff_gilded_crossing_revealed"
            "map-frontier-payoff-gilded-pending:map_first_frontier_payoff_gilded_crossing_pending"
            "village-frontier-payoff-gilded-pending:village_first_frontier_payoff_gilded_crossing_pending"
            "village-frontier-payoff-gilded-secured:village_first_frontier_payoff_gilded_crossing_secured"
            "map-frontier-payoff-gilded-secured:map_first_frontier_payoff_gilded_crossing_secured"
            "world-frontier-legacy-gilded-complete:world_first_frontier_legacy_gilded_crossing_complete"
            "world-frontier-payoff-bridge-revealed:world_first_frontier_payoff_east_bridge_revealed"
            "map-frontier-payoff-bridge-pending:map_first_frontier_payoff_east_bridge_pending"
            "village-frontier-payoff-bridge-pending:village_first_frontier_payoff_east_bridge_pending"
            "village-frontier-payoff-bridge-secured:village_first_frontier_payoff_east_bridge_secured"
            "map-frontier-payoff-bridge-secured:map_first_frontier_payoff_east_bridge_secured"
            "world-frontier-legacy-bridge-complete:world_first_frontier_legacy_east_bridge_complete"
            "world-imperial-expansion-north-ridge-direction:world_first_imperial_expansion_north_ridge_direction"
            "map-imperial-expansion-north-ridge-available:map_first_imperial_expansion_north_ridge_available"
            "map-imperial-expansion-north-ridge-inspected:map_first_imperial_expansion_north_ridge_inspected"
            "map-imperial-expansion-two-lands-claimed:map_first_imperial_expansion_two_lands_claimed"
            "village-imperial-expansion-capital-two-lands:village_first_imperial_expansion_greenvale_capital_two_lands"
            "world-imperial-expansion-two-land-footprint:world_first_imperial_expansion_two_land_footprint"
            "world-north-ridge-outpost-frontier-need:world_north_ridge_outpost_frontier_need"
            "map-north-ridge-outpost-claimed-inspection:map_north_ridge_outpost_claimed_inspection"
            "village-north-ridge-outpost-establish-action:village_north_ridge_outpost_establish_action"
            "map-north-ridge-outpost-established:map_north_ridge_outpost_established"
            "village-north-ridge-outpost-greenvale-administers:village_north_ridge_outpost_greenvale_administers"
            "world-north-ridge-outpost-held-frontier:world_north_ridge_outpost_held_two_land_frontier"
            "trade-village-mandate-started:village_national_mandate_started:trade"
            "trade-map-mandate-active:map_national_mandate_active:trade"
            "trade-world-mandate-underway:world_national_mandate_underway:trade"
            "frontier-village-mandate-started:village_national_mandate_started:frontier"
            "frontier-map-mandate-active:map_national_mandate_active:frontier"
            "frontier-world-mandate-underway:world_national_mandate_underway:frontier"
            "trade-village-imperial-capital:village_aurelian_imperial_capital:trade"
            "trade-map-imperial-heartland:map_aurelian_imperial_heartland:trade"
            "trade-world-first-empire:world_first_empire_proclaimed:trade"
            "frontier-village-imperial-capital:village_aurelian_imperial_capital:frontier"
            "frontier-map-imperial-heartland:map_aurelian_imperial_heartland:frontier"
            "frontier-world-first-empire:world_first_empire_proclaimed:frontier"
          )
          for spec in "${specs[@]}"; do
            IFS=: read -r output state explicit_direction <<< "$spec"
            direction="${explicit_direction:-}"
            crisis_response="shield_greenvale"
            rival_response="stand_firm"
            case "$state" in
              map_first_rival_countermove_greenvale) crisis_response="keep_east_bridge_open" ;;
              village_first_rival_response_negotiate_passage|map_first_rival_response_negotiate_passage|world_first_rival_response_negotiate_passage|*first_frontier*east_bridge*) rival_response="negotiate_passage" ;;
            esac
            case "$state" in
