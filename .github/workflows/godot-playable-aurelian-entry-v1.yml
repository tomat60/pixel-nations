              thumb=Image.open(root/f"{name}-1440x900.png").convert("RGB").resize((360,225))
              canvas.paste(thumb,((i%3)*360,(i//3)*225))
          canvas.save(root/"review-contact-sheet.jpg",quality=92)
          print("GODOT_PLAYABLE_AURELIAN_ENTRY_EVIDENCE_QA=PASS")
          PY

      - name: Upload playable entry artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-playable-aurelian-entry-v1-${{ github.event.pull_request.head.sha || github.sha }}
