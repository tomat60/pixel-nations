name: Godot Playable Aurelian Entry V1

on:
  pull_request:
    branches: [main]
    paths:
      - "game/project.godot"
      - "game/scenes/aurelian/playable_aurelian_entry_v1.gd"
      - "game/scenes/aurelian/playable_aurelian_entry_v1.tscn"
      - "game/scenes/aurelian/playable_aurelian_entry_v1_manifest.json"
      - "game/scenes/aurelian/aurelian_session_persistence_v2.gd"
      - "game/scenes/aurelian/production_map_v1.gd"
      - "game/scenes/aurelian/production_map_v1_manifest.json"
      - "game/scenes/aurelian/production_village_v1.gd"
      - "game/scenes/aurelian/production_village_v1_state_manifest.json"
      - "game/scenes/aurelian/aurelian_visible_expansion_v1_manifest.json"
      - "game/scenes/aurelian/aurelian_first_settlement_development_v1_manifest.json"
      - "game/scenes/aurelian/aurelian_first_trade_route_connection_v1_manifest.json"
      - "game/scenes/aurelian/aurelian_first_trade_caravan_dispatch_v1_manifest.json"
      - "game/scenes/aurelian/aurelian_first_city_charter_v1_manifest.json"
      - "game/scenes/aurelian/aurelian_first_nation_founding_v1_manifest.json"
      - "game/scenes/aurelian/aurelian_living_capital_vertical_slice_v1_manifest.json"
      - "game/tests/production_village_v1_test.gd"
      - "game/tests/aurelian_visible_expansion_v1_test.gd"
      - "game/tests/playable_aurelian_entry_v1_test.gd"
      - "game/tests/aurelian_first_land_claim_v1_test.gd"
      - "game/tests/aurelian_first_settlement_development_v1_test.gd"
      - "game/tests/aurelian_first_trade_route_connection_v1_test.gd"
      - "game/tests/aurelian_first_trade_caravan_dispatch_v1_test.gd"
      - "game/tests/aurelian_first_city_charter_v1_test.gd"
      - "game/tests/aurelian_first_nation_founding_v1_test.gd"
      - "game/tests/aurelian_living_capital_vertical_slice_v1_test.gd"
      - ".github/workflows/godot-playable-aurelian-entry-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-playable-aurelian-entry-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  KAYKIT_SHA: "84fa4e91af6a88989be7c99e0891cede11f2ca38"
  KAYKIT_ARCHIVE_SHA: "cfa7faff403c93fb90e8eeb448c78e6192782802a532bebed0bdb853b39f7028"
  BLENDER_VERSION: "4.3.2"
  BLENDER_BIN: "/tmp/blender/blender-4.3.2-linux-x64/blender"
  GODOT_RELEASE: "4.7.1-stable"
  GODOT_BIN: "/tmp/godot/Godot_v4.7.1-stable_linux.x86_64"
  EXPORT_DIR: "game/assets/aurelian-basin/export"
  EVIDENCE_DIR: "evidence/godot-playable-aurelian-entry-v1"

jobs:
  playable-entry:
    name: Build and capture playable Aurelian entry
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Record exact head
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_DIR}"
          git rev-parse HEAD | tee "${EVIDENCE_DIR}/exact-head.txt"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          fi

      - name: Fetch pinned Blender and KayKit
        timeout-minutes: 10
        run: |
          set -euo pipefail
          rm -rf /tmp/blender /tmp/kaykit
          mkdir -p /tmp/blender /tmp/kaykit/src
          curl -fsSL --retry 4 --retry-all-errors --connect-timeout 20 \
            "https://download.blender.org/release/Blender4.3/blender-${BLENDER_VERSION}-linux-x64.tar.xz" \
            -o /tmp/blender/blender.tar.xz
          tar -xJf /tmp/blender/blender.tar.xz -C /tmp/blender
          test -x "${BLENDER_BIN}"
          curl -fsSL --retry 4 --retry-all-errors --connect-timeout 20 \
            "https://github.com/KayKit-Game-Assets/KayKit-Medieval-Hexagon-Pack-1.0/archive/${KAYKIT_SHA}.zip" \
            -o /tmp/kaykit/source.zip
          test "$(sha256sum /tmp/kaykit/source.zip | cut -d' ' -f1)" = "${KAYKIT_ARCHIVE_SHA}"
          unzip -q /tmp/kaykit/source.zip -d /tmp/kaykit/src
          ROOT="$(find /tmp/kaykit/src -mindepth 1 -maxdepth 1 -type d | head -1)"
          test -n "$ROOT"
          echo "KAYKIT_ROOT=$ROOT" >> "$GITHUB_ENV"
          python3 -m pip install --disable-pip-version-check --no-cache-dir --user pillow

      - name: Recreate accepted shared Basin export
        timeout-minutes: 14
        run: |
          set -euo pipefail
          rm -rf "${EXPORT_DIR}"
          mkdir -p "${EXPORT_DIR}"
          export XDG_RUNTIME_DIR="${RUNNER_TEMP}/xdg-runtime"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          timeout 12m env LIBGL_ALWAYS_SOFTWARE=1 \
            "${BLENDER_BIN}" -b --python game/assets/aurelian-basin/source/aurelian_authored_terrain_v1.py -- \
            "$KAYKIT_ROOT" "$PWD/${EXPORT_DIR}" 2>&1 | tee "${EVIDENCE_DIR}/blender-author.log"
          grep -F "AURELIAN_AUTHORED_TERRAIN=PASS" "${EVIDENCE_DIR}/blender-author.log"
          test -s "${EXPORT_DIR}/aurelian_authored_terrain_v1.glb"
          cp "${EXPORT_DIR}/transform-manifest.json" "${EVIDENCE_DIR}/transform-manifest.json"
          mv "${EXPORT_DIR}/aurelian_authored_terrain_v1.blend" "${EVIDENCE_DIR}/aurelian_authored_terrain_v1.blend"
          cp game/scenes/aurelian/playable_aurelian_entry_v1_manifest.json "${EVIDENCE_DIR}/interaction-manifest.json"
          cp game/scenes/aurelian/aurelian_visible_expansion_v1_manifest.json "${EVIDENCE_DIR}/visible-expansion-manifest.json"
          cp game/scenes/aurelian/aurelian_first_settlement_development_v1_manifest.json "${EVIDENCE_DIR}/development-manifest.json"
          cp game/scenes/aurelian/aurelian_living_capital_vertical_slice_v1_manifest.json "${EVIDENCE_DIR}/living-capital-manifest.json"

      - name: Download pinned Godot
        timeout-minutes: 5
        run: |
          set -euo pipefail
          rm -rf /tmp/godot
          mkdir -p /tmp/godot
          curl -fsSL --retry 4 --retry-all-errors --connect-timeout 20 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" \
            -o /tmp/godot/godot.zip
          unzip -q /tmp/godot/godot.zip -d /tmp/godot
          chmod +x "${GODOT_BIN}"
          "${GODOT_BIN}" --version | tee "${EVIDENCE_DIR}/godot-version.txt"

      - name: Import and run contracts
        timeout-minutes: 7
        run: |
          set -euo pipefail
          "${GODOT_BIN}" --headless --path game --editor --quit > "${EVIDENCE_DIR}/godot-import.log" 2>&1 || {
            cat "${EVIDENCE_DIR}/godot-import.log"; exit 1;
          }
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Blender path is invalid" "${EVIDENCE_DIR}/godot-import.log"; then
            cat "${EVIDENCE_DIR}/godot-import.log"
            exit 1
          fi
          for test in aurelian_authored_terrain_v1_test production_village_v1_test aurelian_visible_expansion_v1_test production_map_v1_test production_world_v1_test aurelian_decision_loop_v1_test playable_aurelian_entry_v1_test aurelian_session_persistence_v2_test aurelian_first_land_claim_v1_test aurelian_first_settlement_development_v1_test aurelian_first_trade_route_connection_v1_test aurelian_first_trade_caravan_dispatch_v1_test aurelian_first_city_charter_v1_test aurelian_first_nation_founding_v1_test aurelian_living_capital_vertical_slice_v1_test; do
            "${GODOT_BIN}" --headless --path game --script "res://tests/${test}.gd" > "${EVIDENCE_DIR}/${test}.log" 2>&1
          done
          grep -F "AURELIAN_AUTHORED_TERRAIN_V1_TEST: PASS" "${EVIDENCE_DIR}/aurelian_authored_terrain_v1_test.log"
          grep -F "PRODUCTION_VILLAGE_V1_TEST: PASS" "${EVIDENCE_DIR}/production_village_v1_test.log"
          grep -F "AURELIAN_VISIBLE_EXPANSION_V1_TEST: PASS" "${EVIDENCE_DIR}/aurelian_visible_expansion_v1_test.log"
          grep -F "PRODUCTION_MAP_V1_TEST: PASS" "${EVIDENCE_DIR}/production_map_v1_test.log"
          grep -F "PRODUCTION_WORLD_V1_TEST: PASS" "${EVIDENCE_DIR}/production_world_v1_test.log"
          grep -F "AURELIAN_DECISION_LOOP_V1_TEST: PASS" "${EVIDENCE_DIR}/aurelian_decision_loop_v1_test.log"
          grep -F "GODOT_PLAYABLE_AURELIAN_ENTRY_V1_TEST: PASS" "${EVIDENCE_DIR}/playable_aurelian_entry_v1_test.log"
          grep -F "GODOT_AURELIAN_SESSION_PERSISTENCE_V2_TEST: PASS" "${EVIDENCE_DIR}/aurelian_session_persistence_v2_test.log"
          grep -F "GODOT_AURELIAN_FIRST_LAND_CLAIM_V1_TEST: PASS" "${EVIDENCE_DIR}/aurelian_first_land_claim_v1_test.log"
          grep -F "GODOT_AURELIAN_FIRST_SETTLEMENT_DEVELOPMENT_V1_TEST: PASS" "${EVIDENCE_DIR}/aurelian_first_settlement_development_v1_test.log"
          grep -F "GODOT_AURELIAN_FIRST_TRADE_ROUTE_CONNECTION_V1_TEST: PASS" "${EVIDENCE_DIR}/aurelian_first_trade_route_connection_v1_test.log"
          grep -F "GODOT_AURELIAN_FIRST_TRADE_CARAVAN_DISPATCH_V1_TEST: PASS" "${EVIDENCE_DIR}/aurelian_first_trade_caravan_dispatch_v1_test.log"
          grep -F "GODOT_AURELIAN_FIRST_CITY_CHARTER_V1_TEST: PASS" "${EVIDENCE_DIR}/aurelian_first_city_charter_v1_test.log"
          grep -F "GODOT_AURELIAN_FIRST_NATION_FOUNDING_V1_TEST: PASS" "${EVIDENCE_DIR}/aurelian_first_nation_founding_v1_test.log"
          grep -F "AURELIAN_LIVING_CAPITAL_VERTICAL_SLICE_V1_TEST: PASS" "${EVIDENCE_DIR}/aurelian_living_capital_vertical_slice_v1_test.log"

      - name: Capture normal launch, founding and development states
        timeout-minutes: 9
        run: |
          set -euo pipefail
          specs=(
            "normal-launch:world_neutral"
            "world-trade-selected:world_trade_selected"
            "map-east-route-selected:map_east_route_selected"
            "map-east-route-claimed:map_east_route_claimed"
            "village-claimed:village_claimed"
            "village-founded:village_founded"
            "village-developed:village_developed"
            "returned-claimed-map:map_east_route_claimed"
            "map-east-route-connected:map_east_route_connected"
            "world-trade-route-active:world_trade_route_active"
            "reopened-connected-map:map_east_route_connected"
            "reopened-village-developed:village_developed"
            "village-first-caravan-dispatched:village_trade_dispatched"
            "map-east-route-in-use:map_east_route_in_use"
            "world-first-trade-underway:world_first_trade_underway"
            "village-first-city-chartered:village_city_chartered"
            "map-greenvale-city:map_greenvale_city"
            "world-first-city-recognized:world_first_city_recognized"
            "world-first-nation-founded:world_first_nation_founded"
            "map-aurelian-homeland:map_aurelian_homeland"
            "village-greenvale-capital:village_greenvale_capital"
          )
          for spec in "${specs[@]}"; do
            IFS=: read -r output state <<< "$spec"
            timeout 90s xvfb-run -a -s "-screen 0 1600x1000x24" env \
              AURELIAN_EVIDENCE_DIR="$PWD/${EVIDENCE_DIR}" \
              AURELIAN_PLAYABLE_EVIDENCE_STATE="$state" \
              "${GODOT_BIN}" --path game --audio-driver Dummy --rendering-method gl_compatibility --resolution 1440x900 \
              > "${EVIDENCE_DIR}/${output}.log" 2>&1
            grep -F "PLAYABLE_AURELIAN_ENTRY_READY=$state" "${EVIDENCE_DIR}/${output}.log"
            mv "${EVIDENCE_DIR}/playable-1440x900.png" "${EVIDENCE_DIR}/${output}-1440x900.png"
          done

      - name: Capture input-driven development sequence
        timeout-minutes: 7
        run: |
          set -euo pipefail
          timeout 360s xvfb-run -a -s "-screen 0 1280x720x24" env \
            AURELIAN_CAPTURE_PLAYABLE_ENTRY=1 \
            "${GODOT_BIN}" --path game --audio-driver Dummy --rendering-method gl_compatibility \
            --resolution 1280x720 --position 0,0 --disable-vsync --fixed-fps 30 \
            --write-movie "$PWD/${EVIDENCE_DIR}/playable-entry-sequence.avi" \
            > "${EVIDENCE_DIR}/playable-entry-sequence.log" 2>&1
          for state in world_trade_selected map_east_route_selected map_east_route_claimed village_claimed village_founded village_developed map_east_route_connected world_trade_route_active village_trade_dispatched map_east_route_in_use world_first_trade_underway village_city_chartered map_greenvale_city world_first_city_recognized world_first_nation_founded map_aurelian_homeland village_greenvale_capital; do
            grep -F "PLAYABLE_AURELIAN_ENTRY_STATE=$state" "${EVIDENCE_DIR}/playable-entry-sequence.log"
          done
          grep -F "AURELIAN_FIRST_LAND_CLAIM=EAST_ROUTE" "${EVIDENCE_DIR}/playable-entry-sequence.log"
          grep -F "AURELIAN_FIRST_SETTLEMENT_FOUNDING=GREENVALE" "${EVIDENCE_DIR}/playable-entry-sequence.log"
          grep -F "AURELIAN_FIRST_SETTLEMENT_DEVELOPMENT=GREENVALE" "${EVIDENCE_DIR}/playable-entry-sequence.log"
          grep -F "AURELIAN_FIRST_TRADE_ROUTE_CONNECTION=EAST_ROUTE" "${EVIDENCE_DIR}/playable-entry-sequence.log"
          grep -F "AURELIAN_FIRST_TRADE_CARAVAN_DISPATCH=EAST_ROUTE" "${EVIDENCE_DIR}/playable-entry-sequence.log"
          grep -F "AURELIAN_FIRST_CITY_CHARTER=GREENVALE" "${EVIDENCE_DIR}/playable-entry-sequence.log"
          grep -F "AURELIAN_FIRST_NATION_FOUNDING=AURELIAN" "${EVIDENCE_DIR}/playable-entry-sequence.log"
          grep -F "PLAYABLE_AURELIAN_INPUT_SEQUENCE_COMPLETE=4050" "${EVIDENCE_DIR}/playable-entry-sequence.log"
          test -s "${EVIDENCE_DIR}/playable-entry-sequence.avi"
          mediainfo --Output=JSON "${EVIDENCE_DIR}/playable-entry-sequence.avi" > "${EVIDENCE_DIR}/video-metadata.json"

      - name: Validate evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, math, os, re
          from pathlib import Path
          from PIL import Image, ImageStat
          root=Path(os.environ["EVIDENCE_DIR"])
          names=["normal-launch","world-trade-selected","map-east-route-selected","map-east-route-claimed","village-claimed","village-founded","village-developed","returned-claimed-map","map-east-route-connected","world-trade-route-active","reopened-connected-map","reopened-village-developed","village-first-caravan-dispatched","map-east-route-in-use","world-first-trade-underway","village-first-city-chartered","map-greenvale-city","world-first-city-recognized","world-first-nation-founded","map-aurelian-homeland","village-greenvale-capital"]
          report={}
          for name in names:
              path=root/f"{name}-1440x900.png"
              im=Image.open(path).convert("RGB")
              if im.size!=(1440,900): raise SystemExit(f"{name}: size {im.size}")
              variance=sum(ImageStat.Stat(im).var)/3
              colors=len(set(im.resize((240,150)).getdata()))
              if path.stat().st_size<70000 or variance<60 or colors<250:
                  raise SystemExit(f"{name}: weak evidence")
              report[name]={"bytes":path.stat().st_size,"variance":round(variance,3),"colors":colors,"sha256":hashlib.sha256(path.read_bytes()).hexdigest()}
          manifest=json.loads((root/"interaction-manifest.json").read_text())
          if manifest["startup_scene"]!="res://scenes/aurelian/playable_aurelian_entry_v1.tscn": raise SystemExit("startup drift")
          expected_path=["world_neutral","world_trade_selected","map_east_route_selected","map_east_route_claimed","village_claimed","village_founded","village_developed","map_east_route_claimed","map_east_route_connected","world_trade_route_active","map_east_route_connected","village_developed","village_trade_dispatched","map_east_route_in_use","world_first_trade_underway","map_east_route_in_use","village_trade_dispatched","village_city_chartered","map_greenvale_city","world_first_city_recognized","map_greenvale_city","village_city_chartered","map_greenvale_city","world_first_city_recognized","world_first_nation_founded","map_aurelian_homeland","village_greenvale_capital"]
          if manifest["forward_path"]!=expected_path: raise SystemExit("development path drift")
          video=json.loads((root/"video-metadata.json").read_text())
          tracks=video.get("media",{}).get("track",[])
          general=next((x for x in tracks if x.get("@type")=="General"),{})
          raw=str(general.get("Duration",""))
          match=re.search(r"\d+(?:\.\d+)?",raw)
          if not match: raise SystemExit("duration missing")
          duration=float(match.group(0))
          if duration>1000: duration/=1000
          if not 134.5<=duration<=136.5: raise SystemExit(f"duration {duration}")
          qa={"status":"PASS_DETERMINISTIC_ONLY_PENDING_DIRECT_REVIEW","exact_head":(root/"exact-head.txt").read_text().strip(),"stills":report,"video_seconds":duration,"claim":"east_route","settlement":"greenvale","founded":True,"developed":True,"route_connected":True,"world_trade_active":True,"caravan_dispatched":True,"world_first_trade_underway":True,"city_chartered":True,"city_marker_topology":[354,285]}
          (root/"evidence-qa.json").write_text(json.dumps(qa,indent=2)+"\n")
          rows=math.ceil(len(names)/3)
          canvas=Image.new("RGB",(1080,rows*225),(32,32,32))
          for i,name in enumerate(names):
              thumb=Image.open(root/f"{name}-1440x900.png").convert("RGB").resize((360,225))
              canvas.paste(thumb,((i%3)*360,(i//3)*225))
          canvas.save(root/"review-contact-sheet.jpg",quality=92)
          print("GODOT_PLAYABLE_AURELIAN_ENTRY_EVIDENCE_QA=PASS")
          PY

      - name: Upload playable entry artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-playable-aurelian-entry-v1-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/godot-playable-aurelian-entry-v1
          if-no-files-found: error
          retention-days: 7
