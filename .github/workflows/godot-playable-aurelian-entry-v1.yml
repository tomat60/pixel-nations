yoff-bridge-revealed","map-frontier-payoff-bridge-pending","village-frontier-payoff-bridge-pending","village-frontier-payoff-bridge-secured","map-frontier-payoff-bridge-secured","world-frontier-legacy-bridge-complete","world-imperial-expansion-north-ridge-direction","map-imperial-expansion-north-ridge-available","map-imperial-expansion-north-ridge-inspected","map-imperial-expansion-two-lands-claimed","village-imperial-expansion-capital-two-lands","world-imperial-expansion-two-land-footprint","world-north-ridge-outpost-frontier-need","map-north-ridge-outpost-claimed-inspection","village-north-ridge-outpost-establish-action","map-north-ridge-outpost-established","village-north-ridge-outpost-greenvale-administers","world-north-ridge-outpost-held-frontier"]
