name: P4 Nation Stewardship Evidence

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  p4-stewardship-evidence:
    name: Generate P4 nation stewardship evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Generate P4 stewardship evidence
        run: npm run qa:p4-stewardship

      - name: Upload P4 stewardship evidence
        uses: actions/upload-artifact@v4
        with:
          name: pixel-nations-p4-stewardship-evidence
          path: public/qa/p4-nation-stewardship
          if-no-files-found: error
          retention-days: 7
