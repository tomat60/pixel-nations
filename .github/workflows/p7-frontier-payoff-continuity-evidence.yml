name: P7 Frontier Payoff Continuity Evidence

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "game/**"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  p7-frontier-payoff-continuity:
    name: Verify post-crisis frontier payoff objective continuity
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Verify P7 frontier payoff continuity
        run: node scripts/qa-p7-frontier-payoff-continuity.mjs

      - name: Upload P7 continuity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixel-nations-p7-frontier-payoff-continuity-evidence
          path: public/qa/p7-frontier-payoff-continuity
          if-no-files-found: error
          retention-days: 7
