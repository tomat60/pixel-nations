name: Godot Foundation CI

on:
  pull_request:
    paths:
      - "game/**"
      - "migration/**"
      - ".github/workflows/godot-ci.yml"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.1"
  GODOT_RELEASE: "4.7.1-stable"
  GODOT_BIN: "/tmp/godot/Godot_v4.7.1-stable_linux.x86_64"

jobs:
  foundation:
    name: Import, test and export Godot foundation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact ref
        uses: actions/checkout@v4

      - name: Install runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends unzip libgl1 libx11-6 libxcursor1 libxinerama1 libxi6 libxrandr2 >/dev/null

      - name: Download pinned Godot and export templates
        run: |
          set -euo pipefail
          mkdir -p /tmp/godot /tmp/godot-templates
          curl --silent --show-error --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" \
            --output /tmp/godot/godot.zip
          curl --silent --show-error --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz" \
            --output /tmp/godot/templates.tpz
          unzip -q /tmp/godot/godot.zip -d /tmp/godot
          chmod +x "${GODOT_BIN}"
          unzip -q /tmp/godot/templates.tpz -d /tmp/godot-templates
          mkdir -p "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cp -R /tmp/godot-templates/templates/. "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          echo "GODOT_VERSION=$(${GODOT_BIN} --version)"

      - name: Verify engine-neutral fixture parity
        run: cmp migration/golden_run_v1.json game/tests/fixtures/golden_run_v1.json

      - name: Import project headlessly
        run: |
          set -euo pipefail
          if ! "${GODOT_BIN}" --headless --path game --editor --quit > godot-import.log 2>&1; then
            cat godot-import.log
            exit 1
          fi
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" godot-import.log; then
            cat godot-import.log
            exit 1
          fi
          echo "GODOT_IMPORT=PASS"

      - name: Run deterministic state and persistence tests
        run: |
          set -euo pipefail
          if ! "${GODOT_BIN}" --headless --path game --script res://tests/run_all.gd > godot-tests.log 2>&1; then
            cat godot-tests.log
            exit 1
          fi
          grep -F "PIXEL_NATIONS_GODOT_TESTS: PASS" godot-tests.log

      - name: Export Linux and Web proofs
        run: |
          set -euo pipefail
          mkdir -p game/build/linux game/build/web
          if ! "${GODOT_BIN}" --headless --path game --export-release "Linux/X11" build/linux/pixel-nations-foundation.x86_64 > godot-export-linux.log 2>&1; then
            cat godot-export-linux.log
            exit 1
          fi
          if ! "${GODOT_BIN}" --headless --path game --export-release "Web" build/web/index.html > godot-export-web.log 2>&1; then
            cat godot-export-web.log
            exit 1
          fi
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" godot-export-linux.log godot-export-web.log; then
            cat godot-export-linux.log
            cat godot-export-web.log
            exit 1
          fi
          test -x game/build/linux/pixel-nations-foundation.x86_64
          test -f game/build/linux/pixel-nations-foundation.pck
          test -f game/build/web/index.html
          test -f game/build/web/index.wasm
          test -f game/build/web/index.pck
          echo "GODOT_EXPORT_LINUX=PASS"
          echo "GODOT_EXPORT_WEB=PASS"

      - name: Native artifact launch smoke
        run: |
          set -euo pipefail
          (
            cd game/build/linux
            timeout 10s env -u GODOT_PATH -u GODOT_PROJECT_PATH GODOT_SILENCE_ROOT_WARNING=1 ./pixel-nations-foundation.x86_64 --headless
          ) > native-smoke.log 2>&1 || {
            status=$?
            cat native-smoke.log
            exit "$status"
          }
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" native-smoke.log; then
            cat native-smoke.log
            exit 1
          fi
          echo "GODOT_NATIVE_SMOKE=PASS"

      - name: Reject generated cache leakage
        run: |
          set -euo pipefail
          if git status --short --untracked-files=all | grep -E '(^| )game/(\.godot|build)/'; then
            echo "Godot cache/build files are visible to Git; update ignore rules."
            exit 1
          fi
          echo "GODOT_CACHE_LEAKAGE=NONE"

      - name: Foundation evidence summary
        run: |
          echo "GODOT_FOUNDATION_SHA=${GITHUB_SHA}"
          echo "GODOT_FOUNDATION_RESULT=PASS"
          du -h game/build/linux/pixel-nations-foundation.x86_64 game/build/linux/pixel-nations-foundation.pck game/build/web/index.wasm game/build/web/index.pck

      - name: Upload exact-SHA foundation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-foundation-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            godot-import.log
            godot-tests.log
            godot-export-linux.log
            godot-export-web.log
            native-smoke.log
            game/build/linux/**
            game/build/web/**
