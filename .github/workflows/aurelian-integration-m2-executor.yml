name: Aurelian Integration M2 Executor

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/apply-aurelian-m2-integration.py
      - .github/workflows/aurelian-integration-m2-executor.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-and-validate:
    if: github.head_ref == 'integration/aurelian-staged-progression-m2' || github.ref_name == 'integration/aurelian-staged-progression-m2'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact M2 candidate
        uses: actions/checkout@v4
        with:
          ref: integration/aurelian-staged-progression-m2
          fetch-depth: 0

      - name: Apply deterministic product integration
        run: |
          set -euo pipefail
          executor="scripts/apply-aurelian-m2-integration.py"
          if test -f "$executor"; then
            python3 "$executor"
            rm "$executor"
            node scripts/qa-aurelian-play-integration.mjs
            git diff --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              app/play/page.tsx \
              app/play/components/AurelianVillageScene.tsx \
              scripts/qa-aurelian-play-integration.mjs \
              package.json \
              "$executor"
            git commit -m "Integrate accepted Aurelian progression into play"
            git push origin "HEAD:integration/aurelian-staged-progression-m2"
          else
            node scripts/qa-aurelian-play-integration.mjs
            echo "AURELIAN_M2_EXECUTOR_ALREADY_APPLIED"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Validate integration source
        run: |
          set -euo pipefail
          npm run qa:aurelian:play
          npm run build
          npm run qa:village
