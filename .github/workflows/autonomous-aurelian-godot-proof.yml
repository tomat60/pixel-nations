name: Autonomous Aurelian Godot Proof

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/autonomous-aurelian-godot-proof.yml
      - tools/qa/run_autonomous_aurelian_godot_proof.sh
      - tools/blender/aurelian_autonomous_override.py
      - game/scenes/art_target/autonomous_aurelian_capture.gd
      - game/scenes/art_target/autonomous_aurelian_capture.tscn
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact autonomous branch
        uses: actions/checkout@v4
        with:
          ref: art-target/autonomous-aurelian-v2
          fetch-depth: 0

      - name: Run deterministic Blender-to-Godot proof
        run: |
          set -euo pipefail
          chmod +x tools/qa/run_autonomous_aurelian_godot_proof.sh
          tools/qa/run_autonomous_aurelian_godot_proof.sh

      - name: Upload autonomous Godot proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-aurelian-godot-${{ github.run_id }}
          path: evidence/autonomous-aurelian-godot/**
          if-no-files-found: warn
          retention-days: 30

      - name: Report Godot proof run
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:312,body:`## Autonomous Godot proof run ${context.runId}\n\n- Event SHA: \`${context.sha}\`\n- Job status: \`${{ job.status }}\`\n- Artifact: \`autonomous-aurelian-godot-${context.runId}\`\n- The proof runner evaluates every MovieWriter frame and selects the strongest exact-size rendered frame before final QA.\n- Direct review of both final screenshots is required before final classification.\n\nNo user operation, payment, MAX, main write, merge or deployment was used.`})
