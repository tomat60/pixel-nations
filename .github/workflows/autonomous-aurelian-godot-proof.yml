name: Autonomous Aurelian Godot Proof

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/autonomous-aurelian-godot-proof.yml
      - tools/blender/aurelian_autonomous_override.py
      - game/scenes/art_target/autonomous_aurelian_capture.gd
      - game/scenes/art_target/autonomous_aurelian_capture.tscn
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  GODOT_RELEASE: 4.7.1-stable
  KAYKIT_SHA: 84fa4e91af6a88989be7c99e0891cede11f2ca38
  EXPECTED_ARCHIVE_SHA: cfa7faff403c93fb90e8eeb448c78e6192782802a532bebed0bdb853b39f7028
  BASE_SCRIPT_SHA: d001d96117fc9d1de20f3ff57d7a47e2441a0393
  ACCEPTED_DESKTOP_PREVIEW_SHA: 4abf789798ec27cb9d037a755f56062da3c0e9dd575f26ff013bc576d636df95
  ACCEPTED_PORTRAIT_PREVIEW_SHA: 0c23af5b6f7894b6cca21c70c6a3488cb5346100575c13d2421df1e364bf197c
  ACCEPTED_DESKTOP_DHASH: e0e2656dabdb6393
  ACCEPTED_PORTRAIT_DHASH: 31c6e6a218998361

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact autonomous branch
        uses: actions/checkout@v4
        with:
          ref: art-target/autonomous-aurelian-v2
          fetch-depth: 0

      - name: Install deterministic Blender and Godot tooling
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends blender python3-numpy python3-pil unzip xvfb libegl1 libgl1-mesa-dri libglx-mesa0 libx11-6 libxcursor1 libxinerama1 libxi6 libxrandr2 >/dev/null
          blender --version | head -1
          BLENDER_PYTHONPATH="$(python3 - <<'PY'
          import pathlib
          import numpy
          print(pathlib.Path(numpy.__file__).resolve().parent.parent)
          PY
          )"
          echo "BLENDER_PYTHONPATH=$BLENDER_PYTHONPATH" >> "$GITHUB_ENV"
          env PYTHONPATH="$BLENDER_PYTHONPATH" blender -b --python-expr "import numpy; print('BLENDER_NUMPY=' + numpy.__version__)"
          python3 - <<'PY'
          from PIL import Image
          print('PIL_OK=' + Image.__version__)
          PY
          mkdir -p /tmp/godot
          curl -fsSL --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" -o /tmp/godot/godot.zip
          unzip -q /tmp/godot/godot.zip -d /tmp/godot
          GODOT="/tmp/godot/Godot_v${GODOT_RELEASE}_linux.x86_64"
          chmod +x "$GODOT"
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"
          "$GODOT" --version

      - name: Fetch exact source and accepted technical base
        run: |
          set -euo pipefail
          rm -rf /tmp/kaykit /tmp/aurelian-base evidence/autonomous-aurelian-godot game/art_target/autonomous_aurelian
          mkdir -p /tmp/kaykit/src /tmp/aurelian-base evidence/autonomous-aurelian-godot game/art_target/autonomous_aurelian
          curl -fsSL --retry 3 "https://github.com/KayKit-Game-Assets/KayKit-Medieval-Hexagon-Pack-1.0/archive/${KAYKIT_SHA}.zip" -o /tmp/kaykit/source.zip
          ACTUAL_ARCHIVE_SHA="$(sha256sum /tmp/kaykit/source.zip | cut -d' ' -f1)"
          test "$ACTUAL_ARCHIVE_SHA" = "$EXPECTED_ARCHIVE_SHA"
          unzip -q /tmp/kaykit/source.zip -d /tmp/kaykit/src
          ROOT="$(find /tmp/kaykit/src -mindepth 1 -maxdepth 1 -type d | head -1)"
          echo "KAYKIT_ROOT=$ROOT" >> "$GITHUB_ENV"
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/tomat60/pixel-nations/${BASE_SCRIPT_SHA}/tools/blender/aurelian_basin_master.py" -o /tmp/aurelian-base/aurelian_basin_master.py
          grep -F 'SOURCE_SHA = "84fa4e91af6a88989be7c99e0891cede11f2ca38"' /tmp/aurelian-base/aurelian_basin_master.py
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/KayKit-Game-Assets/KayKit-Medieval-Hexagon-Pack-1.0/${KAYKIT_SHA}/LICENSE.txt" -o evidence/autonomous-aurelian-godot/LICENSE.txt
          grep -F 'Creative Commons Zero' evidence/autonomous-aurelian-godot/LICENSE.txt
          git rev-parse HEAD > evidence/autonomous-aurelian-godot/input-sha.txt
          git rev-parse HEAD > evidence/autonomous-aurelian-godot/output-sha.txt
          printf '%s  %s\n' "$ACTUAL_ARCHIVE_SHA" source.zip > evidence/autonomous-aurelian-godot/source-archive.sha256

      - name: Reproduce accepted Blender previews and export GLBs
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR="${RUNNER_TEMP}/xdg-runtime"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          timeout 15m env PYTHONPATH="$BLENDER_PYTHONPATH" LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x1200x24" blender -b --python tools/blender/aurelian_autonomous_override.py -- /tmp/aurelian-base/aurelian_basin_master.py "$KAYKIT_ROOT" "$PWD/evidence/autonomous-aurelian-godot" 2>&1 | tee evidence/autonomous-aurelian-godot/blender.log
          grep -F 'AUTONOMOUS_GLB_EXPORTED=desktop' evidence/autonomous-aurelian-godot/blender.log
          grep -F 'AUTONOMOUS_GLB_EXPORTED=portrait' evidence/autonomous-aurelian-godot/blender.log
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from PIL import Image
          root = Path('evidence/autonomous-aurelian-godot')
          def dhash(path):
              image = Image.open(path).convert('L').resize((9,8), Image.Resampling.LANCZOS)
              pixels = list(image.getdata())
              value = 0
              for y in range(8):
                  row = pixels[y*9:(y+1)*9]
                  for x in range(8):
                      value = (value << 1) | int(row[x] > row[x+1])
              return f'{value:016x}'
          actual = {'desktop': dhash(root/'autonomous-desktop-preview.png'), 'portrait': dhash(root/'autonomous-portrait-preview.png')}
          expected = {'desktop': os.environ['ACCEPTED_DESKTOP_DHASH'], 'portrait': os.environ['ACCEPTED_PORTRAIT_DHASH']}
          if actual != expected:
              raise SystemExit(f'accepted preview perceptual drift: actual={actual} expected={expected}')
          report = {mode:{'accepted_byte_sha256':os.environ[f'ACCEPTED_{mode.upper()}_PREVIEW_SHA'],'reproduced_byte_sha256':hashlib.sha256((root/f'autonomous-{mode}-preview.png').read_bytes()).hexdigest(),'accepted_dhash':expected[mode],'reproduced_dhash':actual[mode]} for mode in ('desktop','portrait')}
          (root/'preview-reproduction.json').write_text(json.dumps(report,indent=2)+'\n')
          print('ACCEPTED_PREVIEW_PERCEPTUAL_REPRODUCTION_OK')
          PY
          test "$(stat -c%s evidence/autonomous-aurelian-godot/autonomous-desktop.glb)" -gt 500000
          test "$(stat -c%s evidence/autonomous-aurelian-godot/autonomous-portrait.glb)" -gt 500000
          cp evidence/autonomous-aurelian-godot/autonomous-desktop.glb game/art_target/autonomous_aurelian/
          cp evidence/autonomous-aurelian-godot/autonomous-portrait.glb game/art_target/autonomous_aurelian/

      - name: Import exact GLBs into Godot
        run: |
          set -euo pipefail
          "$GODOT" --headless --path game --editor --quit 2>&1 | tee evidence/autonomous-aurelian-godot/godot-import.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Failed to load' evidence/autonomous-aurelian-godot/godot-import.log
          test -d game/.godot/imported

      - name: Capture exact Godot desktop and portrait proof with MovieWriter
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR="${RUNNER_TEMP}/xdg-runtime"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          rm -f evidence/autonomous-aurelian-godot/desktop-frame*.png evidence/autonomous-aurelian-godot/desktop-frame.wav
          timeout 90s xvfb-run -a -s "-screen 0 1440x900x24" env CAPTURE_MODE=desktop CAPTURE_WIDTH=1440 CAPTURE_HEIGHT=900 CONTRACT_PATH="$PWD/evidence/autonomous-aurelian-godot/godot-desktop-contract.json" "$GODOT" --path game --audio-driver Dummy --rendering-method gl_compatibility --resolution 1440x900 --position 0,0 --write-movie "$PWD/evidence/autonomous-aurelian-godot/desktop-frame.png" --fixed-fps 30 --quit-after 12 --disable-vsync res://scenes/art_target/autonomous_aurelian_capture.tscn 2>&1 | tee evidence/autonomous-aurelian-godot/godot-desktop.log
          grep -F 'AUTONOMOUS_GODOT_SCENE_READY=desktop' evidence/autonomous-aurelian-godot/godot-desktop.log
          DESKTOP_LAST="$(find evidence/autonomous-aurelian-godot -maxdepth 1 -name 'desktop-frame????????.png' | sort | tail -1)"
          test -n "$DESKTOP_LAST"
          cp "$DESKTOP_LAST" evidence/autonomous-aurelian-godot/godot-desktop-1440x900.png
          rm -f evidence/autonomous-aurelian-godot/desktop-frame*.png evidence/autonomous-aurelian-godot/desktop-frame.wav

          rm -f evidence/autonomous-aurelian-godot/portrait-frame*.png evidence/autonomous-aurelian-godot/portrait-frame.wav
          timeout 90s xvfb-run -a -s "-screen 0 390x844x24" env CAPTURE_MODE=portrait CAPTURE_WIDTH=390 CAPTURE_HEIGHT=844 CONTRACT_PATH="$PWD/evidence/autonomous-aurelian-godot/godot-portrait-contract.json" "$GODOT" --path game --audio-driver Dummy --rendering-method gl_compatibility --resolution 390x844 --position 0,0 --write-movie "$PWD/evidence/autonomous-aurelian-godot/portrait-frame.png" --fixed-fps 30 --quit-after 12 --disable-vsync res://scenes/art_target/autonomous_aurelian_capture.tscn 2>&1 | tee evidence/autonomous-aurelian-godot/godot-portrait.log
          grep -F 'AUTONOMOUS_GODOT_SCENE_READY=portrait' evidence/autonomous-aurelian-godot/godot-portrait.log
          PORTRAIT_LAST="$(find evidence/autonomous-aurelian-godot -maxdepth 1 -name 'portrait-frame????????.png' | sort | tail -1)"
          test -n "$PORTRAIT_LAST"
          cp "$PORTRAIT_LAST" evidence/autonomous-aurelian-godot/godot-portrait-390x844.png
          rm -f evidence/autonomous-aurelian-godot/portrait-frame*.png evidence/autonomous-aurelian-godot/portrait-frame.wav
          ! grep -E 'SCRIPT ERROR|Parse Error|Failed to load' evidence/autonomous-aurelian-godot/godot-desktop.log evidence/autonomous-aurelian-godot/godot-portrait.log
          echo AUTONOMOUS_GODOT_MOVIE_FRAMES_CAPTURED

      - name: Build exact final evidence contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          from PIL import Image, ImageStat
          root = Path('evidence/autonomous-aurelian-godot')
          expected = {'godot-desktop-1440x900.png': (1440,900), 'godot-portrait-390x844.png': (390,844)}
          qa = {}
          for name, dims in expected.items():
              path = root / name
              if not path.exists() or path.stat().st_size < 20000:
                  raise SystemExit(f'missing or tiny Godot PNG: {name}')
              image = Image.open(path).convert('RGB')
              if image.size != dims:
                  raise SystemExit(f'wrong Godot dimensions {name}: {image.size}')
              stat = ImageStat.Stat(image)
              luminance = sum(stat.mean) / 3.0
              variance = sum(stat.var) / 3.0
              pixels = list(image.resize((240,150)).getdata())
              near_white = sum(1 for p in pixels if min(p) > 245) / len(pixels)
              if variance < 45.0 or luminance < 30.0 or luminance > 215.0 or near_white > 0.05:
                  raise SystemExit(f'Godot image QA failed {name}: lum={luminance:.2f} var={variance:.2f} white={near_white:.4f}')
              qa[name] = {'width':dims[0],'height':dims[1],'bytes':path.stat().st_size,'sha256':hashlib.sha256(path.read_bytes()).hexdigest(),'luminance':round(luminance,3),'variance':round(variance,3),'near_white':round(near_white,5)}
          for contract_name in ('godot-desktop-contract.json','godot-portrait-contract.json'):
              contract = json.loads((root/contract_name).read_text())
              if contract['camera_nodes'] < 1 or contract['mesh_instances'] < 20:
                  raise SystemExit(f'invalid imported scene contract: {contract}')
              if contract['camera']['projection'] != 'orthogonal':
                  raise SystemExit('imported camera is not orthogonal')
          input_sha = (root/'input-sha.txt').read_text().strip()
          output_sha = (root/'output-sha.txt').read_text().strip()
          if input_sha != output_sha:
              raise SystemExit('input/output SHA mismatch')
          final = {'classification':'PENDING_DIRECT_VISUAL_REVIEW','input_sha':input_sha,'output_sha':output_sha,'source_commit':'84fa4e91af6a88989be7c99e0891cede11f2ca38','preview_reproduction':json.loads((root/'preview-reproduction.json').read_text()),'godot_images':qa}
          (root/'final-contract.json').write_text(json.dumps(final,indent=2)+'\n')
          print('AUTONOMOUS_GODOT_EVIDENCE_OK')
          PY
          find evidence/autonomous-aurelian-godot -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > evidence/autonomous-aurelian-godot/SHA256SUMS.txt

      - name: Upload autonomous Godot proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-aurelian-godot-${{ github.run_id }}
          path: evidence/autonomous-aurelian-godot/**
          if-no-files-found: warn
          retention-days: 30

      - name: Report Godot proof run
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:312,body:`## Autonomous Godot proof run ${context.runId}\n\n- Event SHA: \`${context.sha}\`\n- Job status: \`${{ job.status }}\`\n- Artifact: \`autonomous-aurelian-godot-${context.runId}\`\n- Direct review of both final screenshots is required before final classification.\n\nNo user operation, payment, MAX, main write, merge or deployment was used.`})
