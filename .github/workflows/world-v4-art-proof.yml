name: Pixel Nations World V4 Art Proof
on:
  push:
    branches: [art/world-v4-continuity-proof]
    paths:
      - .github/workflows/world-v4-art-proof.yml
      - tools/blender/aurelian_world_v4_continuity.py
      - tools/art/world_v4_extract.py
      - tools/qa/run_aurelian_world_v4_proof.sh
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: world-v4-art-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.ref_name }}", fetch-depth: 1}
      - run: bash tools/qa/run_aurelian_world_v4_proof.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixel-nations-world-v4-proof
          path: |
            ${{ runner.temp }}/pixel-nations-world-v4/render
            game/art_target/world_v4
            review/aurelian-world-v4
          if-no-files-found: error
          retention-days: 7
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/art_target/world_v4 review/aurelian-world-v4
          if ! git diff --cached --quiet; then
            git commit -m "art: render World V4 continuity proof [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
