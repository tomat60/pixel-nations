name: Pixel Nations CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      validation:
        description: "Validation depth"
        required: true
        default: core
        type: choice
        options:
          - core
          - full-screens

permissions:
  contents: read

concurrency:
  group: pixel-nations-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Install and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cloud readiness gate
        run: npm run pn:cloud-ready

      - name: Build
        run: npm run build

  smoke:
    name: Bounded mechanical smoke validation
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run bounded smoke
        timeout-minutes: 13
        run: timeout 12m npm run qa:smoke

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixel-nations-smoke-evidence
          path: |
            public/qa/latest/**
          if-no-files-found: ignore
          retention-days: 7

  screenshots:
    name: Optional screenshot QA manual
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.validation == 'full-screens' }}
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run screenshots
        run: npm run qa:screens
