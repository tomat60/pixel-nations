name: Imperial Decision Visibility Audit

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  visibility-audit:
    name: Measure imperial decision visibility
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Measure imperial decision visibility
        run: node scripts/qa-imperial-decision-visibility-audit.mjs

      - name: Upload visibility evidence
        uses: actions/upload-artifact@v4
        with:
          name: pixel-nations-imperial-decision-visibility-audit
          path: public/qa/imperial-decision-visibility-audit
          if-no-files-found: error
          retention-days: 7
