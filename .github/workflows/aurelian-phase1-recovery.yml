name: Aurelian Phase 1 Terrain Recovery Proof

on:
  pull_request:
    branches: [main]
    paths:
      - "game/assets/aurelian-basin/source/**"
      - "game/scenes/aurelian/**"
      - "game/tests/aurelian_phase1_recovery_test.gd"
      - ".github/workflows/aurelian-phase1-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  KAYKIT_SHA: "84fa4e91af6a88989be7c99e0891cede11f2ca38"
  KAYKIT_ARCHIVE_SHA: "cfa7faff403c93fb90e8eeb448c78e6192782802a532bebed0bdb853b39f7028"
  GODOT_RELEASE: "4.7.1-stable"
  GODOT_BIN: "/tmp/godot/Godot_v4.7.1-stable_linux.x86_64"
  EXPORT_DIR: "game/assets/aurelian-basin/export"
  EVIDENCE_DIR: "evidence/aurelian-phase1-recovery"

jobs:
  terrain-recovery-proof:
    name: Author, import and capture one shared Aurelian Basin
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Record exact input head
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_DIR}"
          git rev-parse HEAD | tee "${EVIDENCE_DIR}/exact-head.txt"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          fi

      - name: Install deterministic render tooling
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            blender unzip xvfb ffmpeg python3-pil \
            libegl1 libgl1-mesa-dri libglx-mesa0 libx11-6 libxcursor1 \
            libxinerama1 libxi6 libxrandr2 >/dev/null
          blender --version | head -1 | tee "${EVIDENCE_DIR}/blender-version.txt"
          ffmpeg -version | head -1 | tee "${EVIDENCE_DIR}/ffmpeg-version.txt"

      - name: Fetch exact KayKit CC0 source
        run: |
          set -euo pipefail
          rm -rf /tmp/kaykit
          mkdir -p /tmp/kaykit/src
          curl -fsSL --retry 3 \
            "https://github.com/KayKit-Game-Assets/KayKit-Medieval-Hexagon-Pack-1.0/archive/${KAYKIT_SHA}.zip" \
            -o /tmp/kaykit/source.zip
          test "$(sha256sum /tmp/kaykit/source.zip | cut -d' ' -f1)" = "${KAYKIT_ARCHIVE_SHA}"
          unzip -q /tmp/kaykit/source.zip -d /tmp/kaykit/src
          ROOT="$(find /tmp/kaykit/src -mindepth 1 -maxdepth 1 -type d | head -1)"
          test -n "$ROOT"
          echo "KAYKIT_ROOT=$ROOT" >> "$GITHUB_ENV"
          cp "$ROOT/addons/kaykit_medieval_hexagon_pack/LICENSE.txt" "${EVIDENCE_DIR}/KAYKIT_CC0_LICENSE.txt"
          grep -F "Creative Commons Zero" "${EVIDENCE_DIR}/KAYKIT_CC0_LICENSE.txt"
          printf '%s  source.zip\n' "${KAYKIT_ARCHIVE_SHA}" > "${EVIDENCE_DIR}/kaykit-archive.sha256"

      - name: Author one canonical Blender scene and export one GLB
        run: |
          set -euo pipefail
          rm -rf "${EXPORT_DIR}"
          mkdir -p "${EXPORT_DIR}"
          export XDG_RUNTIME_DIR="${RUNNER_TEMP}/xdg-runtime"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          timeout 14m env LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x1200x24" \
            blender -b --python game/assets/aurelian-basin/source/aurelian_phase1_recovery.py -- \
            "$KAYKIT_ROOT" "$PWD/${EXPORT_DIR}" \
            2>&1 | tee "${EVIDENCE_DIR}/blender-author.log"
          grep -F "AURELIAN_RECOVERY_AUTHORING=PASS" "${EVIDENCE_DIR}/blender-author.log"
          test -s "${EXPORT_DIR}/aurelian_basin_phase1_recovery.glb"
          test -s "${EXPORT_DIR}/transform-manifest.json"
          test -s "${EXPORT_DIR}/source-manifest.json"
          cp "${EXPORT_DIR}/transform-manifest.json" "${EVIDENCE_DIR}/transform-manifest.json"
          cp "${EXPORT_DIR}/source-manifest.json" "${EVIDENCE_DIR}/source-manifest.json"
          sha256sum "${EXPORT_DIR}/aurelian_basin_phase1_recovery.glb" > "${EVIDENCE_DIR}/glb.sha256"
          stat -c '%s' "${EXPORT_DIR}/aurelian_basin_phase1_recovery.glb" > "${EVIDENCE_DIR}/glb-bytes.txt"

      - name: Download pinned Godot 4.7.1
        run: |
          set -euo pipefail
          mkdir -p /tmp/godot
          curl -fsSL --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" \
            -o /tmp/godot/godot.zip
          unzip -q /tmp/godot/godot.zip -d /tmp/godot
          chmod +x "${GODOT_BIN}"
          "${GODOT_BIN}" --version | tee "${EVIDENCE_DIR}/godot-version.txt"

      - name: Import exact GLB and run Godot contracts
        run: |
          set -euo pipefail
          "${GODOT_BIN}" --headless --path game --editor --quit > "${EVIDENCE_DIR}/godot-import.log" 2>&1 || {
            cat "${EVIDENCE_DIR}/godot-import.log"; exit 1;
          }
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" "${EVIDENCE_DIR}/godot-import.log"; then
            cat "${EVIDENCE_DIR}/godot-import.log"
            exit 1
          fi
          "${GODOT_BIN}" --headless --path game --script res://tests/run_all.gd \
            > "${EVIDENCE_DIR}/godot-foundation-tests.log" 2>&1
          grep -F "PIXEL_NATIONS_GODOT_TESTS: PASS" "${EVIDENCE_DIR}/godot-foundation-tests.log"
          "${GODOT_BIN}" --headless --path game --script res://tests/aurelian_phase1_recovery_test.gd \
            > "${EVIDENCE_DIR}/aurelian-recovery-test.log" 2>&1
          grep -F "AURELIAN_PHASE1_RECOVERY_TEST: PASS" "${EVIDENCE_DIR}/aurelian-recovery-test.log"

      - name: Capture exact 1440x900 SubViewport stills
        run: |
          set -euo pipefail
          for preset in village map world bridge; do
            timeout 90s xvfb-run -a -s "-screen 0 1600x1000x24" env \
              AURELIAN_EVIDENCE_DIR="$PWD/${EVIDENCE_DIR}" \
              AURELIAN_CAPTURE_PRESET="$preset" \
              "${GODOT_BIN}" --path game --audio-driver Dummy --rendering-method gl_compatibility \
              res://scenes/aurelian/aurelian_phase1_recovery.tscn \
              > "${EVIDENCE_DIR}/${preset}.log" 2>&1
            grep -F "AURELIAN_RECOVERY_STILL=${preset}:" "${EVIDENCE_DIR}/${preset}.log"
            test -s "${EVIDENCE_DIR}/${preset}-1440x900.png"
            if grep -E "SCRIPT ERROR|Parse Error|Failed to load|^ERROR:" "${EVIDENCE_DIR}/${preset}.log"; then
              cat "${EVIDENCE_DIR}/${preset}.log"
              exit 1
            fi
          done

      - name: Capture 18 second shared-camera video
        run: |
          set -euo pipefail
          timeout 120s xvfb-run -a -s "-screen 0 1280x720x24" env \
            AURELIAN_CAPTURE_SEQUENCE=1 \
            "${GODOT_BIN}" --path game --audio-driver Dummy --rendering-method gl_compatibility \
            --resolution 1280x720 --position 0,0 --disable-vsync --fixed-fps 30 \
            --write-movie "$PWD/${EVIDENCE_DIR}/camera-switch.avi" \
            res://scenes/aurelian/aurelian_phase1_recovery.tscn \
            > "${EVIDENCE_DIR}/camera-switch.log" 2>&1
          grep -F "AURELIAN_RECOVERY_SEQUENCE_COMPLETE=540" "${EVIDENCE_DIR}/camera-switch.log"
          test -s "${EVIDENCE_DIR}/camera-switch.avi"
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load|^ERROR:" "${EVIDENCE_DIR}/camera-switch.log"; then
            cat "${EVIDENCE_DIR}/camera-switch.log"
            exit 1
          fi
          ffmpeg -y -loglevel error -i "${EVIDENCE_DIR}/camera-switch.avi" \
            -c:v libx264 -pix_fmt yuv420p "${EVIDENCE_DIR}/camera-switch.mp4"
          ffprobe -v error -show_entries stream=width,height,r_frame_rate,codec_name \
            -show_entries format=duration -of json "${EVIDENCE_DIR}/camera-switch.mp4" \
            > "${EVIDENCE_DIR}/video-metadata.json"

      - name: Validate visual evidence, contracts and exact head
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from PIL import Image, ImageStat, ImageChops

          root = Path(os.environ['EVIDENCE_DIR'])
          report = {}
          images = {}
          for preset in ('village','map','world','bridge'):
              path = root / f'{preset}-1440x900.png'
              image = Image.open(path).convert('RGB')
              if image.size != (1440,900):
                  raise SystemExit(f'{preset}: wrong size {image.size}')
              stat = ImageStat.Stat(image)
              variance = sum(stat.var)/3.0
              sample = image.resize((240,150))
              colors = len(set(sample.getdata()))
              if path.stat().st_size < 80000 or variance < 90.0 or colors < 350:
                  raise SystemExit(f'{preset}: weak/blank evidence bytes={path.stat().st_size} variance={variance:.2f} colors={colors}')
              report[preset] = {
                  'bytes': path.stat().st_size,
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                  'variance': round(variance,3),
                  'sample_colors': colors,
              }
              images[preset] = sample

          for a,b in (('village','map'),('map','world'),('village','bridge')):
              diff = ImageStat.Stat(ImageChops.difference(images[a], images[b]))
              mean_delta = sum(diff.mean)/3.0
              if mean_delta < 2.0:
                  raise SystemExit(f'camera evidence too similar: {a}/{b} delta={mean_delta:.3f}')

          manifest = json.loads((root/'transform-manifest.json').read_text())
          if manifest.get('contract') != 'AURELIAN_BASIN_PHASE1_RECOVERY_V1':
              raise SystemExit('wrong transform contract')
          if manifest['bridge']['topology_endpoints'] != [[455.0,340.0],[575.0,340.0]]:
              raise SystemExit('bridge topology drift')
          if len(manifest['river_centerline']) != 9:
              raise SystemExit('river topology drift')
          for index, sample in enumerate(manifest['river_centerline']):
              if not sample['bank_a_z'] > sample['water_z'] + 0.15 or not sample['bank_b_z'] > sample['water_z'] + 0.15:
                  raise SystemExit(f'river bank clearance failed at {index}')
          bridge = manifest['bridge']
          if bridge['deck_clearance_over_water'] <= 1.0:
              raise SystemExit('bridge water clearance failed')
          if bridge['west_road_join_gap'] > 0.05 or bridge['east_road_join_gap'] > 0.05:
              raise SystemExit('bridge road join failed')
          if set(manifest['cameras']) != {'village','map','world','bridge'}:
              raise SystemExit('camera contract drift')

          video = json.loads((root/'video-metadata.json').read_text())
          duration = float(video['format']['duration'])
          stream = video['streams'][0]
          if not 17.5 <= duration <= 18.5:
              raise SystemExit(f'video duration wrong: {duration}')
          if int(stream['width']) != 1280 or int(stream['height']) != 720:
              raise SystemExit(f'video dimensions wrong: {stream}')

          qa = {
              'status': 'PASS_DETERMINISTIC_ONLY_PENDING_DIRECT_VISUAL_REVIEW',
              'stills': report,
              'transform_manifest': 'PASS',
              'bridge_contract': 'PASS',
              'video_seconds': duration,
              'exact_head': (root/'exact-head.txt').read_text().strip(),
          }
          (root/'evidence-qa.json').write_text(json.dumps(qa, indent=2)+'\n')

          canvas = Image.new('RGB',(720,900),(24,24,24))
          for i,preset in enumerate(('village','map','world','bridge')):
              thumb = Image.open(root/f'{preset}-1440x900.png').convert('RGB').resize((360,225))
              canvas.paste(thumb,((i%2)*360,(i//2)*225))
          canvas.save(root/'review-contact-sheet.jpg',quality=92)
          print('AURELIAN_PHASE1_RECOVERY_EVIDENCE_QA=PASS')
          PY

      - name: Write runtime provenance manifest
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          root=Path(os.environ['EVIDENCE_DIR'])
          export=Path(os.environ['EXPORT_DIR'])
          data={
            'exact_head': (root/'exact-head.txt').read_text().strip() if (root/'exact-head.txt').exists() else None,
            'renderer': 'Godot Compatibility / gl_compatibility',
            'still_viewport': [1440,900],
            'video_target': [1280,720,30],
            'kaykit_commit': os.environ['KAYKIT_SHA'],
            'kaykit_archive_sha256': os.environ['KAYKIT_ARCHIVE_SHA'],
            'blender_version': (root/'blender-version.txt').read_text().strip() if (root/'blender-version.txt').exists() else None,
            'godot_version': (root/'godot-version.txt').read_text().strip() if (root/'godot-version.txt').exists() else None,
          }
          glb=export/'aurelian_basin_phase1_recovery.glb'
          if glb.exists():
            data['glb_sha256']=hashlib.sha256(glb.read_bytes()).hexdigest()
            data['glb_bytes']=glb.stat().st_size
          source=Path('game/assets/aurelian-basin/source/aurelian_phase1_recovery.py')
          if source.exists(): data['authoring_source_sha256']=hashlib.sha256(source.read_bytes()).hexdigest()
          root.mkdir(parents=True,exist_ok=True)
          (root/'runtime-manifest.json').write_text(json.dumps(data,indent=2)+'\n')
          PY
          find "${EVIDENCE_DIR}" -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "${EVIDENCE_DIR}/SHA256SUMS.txt"

      - name: Stage review copy of exported GLB
        if: always()
        run: |
          if [ -s "${EXPORT_DIR}/aurelian_basin_phase1_recovery.glb" ]; then
            cp "${EXPORT_DIR}/aurelian_basin_phase1_recovery.glb" "${EVIDENCE_DIR}/aurelian_basin_phase1_recovery.glb"
          fi

      - name: Upload exact-head recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurelian-phase1-recovery-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/aurelian-phase1-recovery/**
          if-no-files-found: error
          retention-days: 30
