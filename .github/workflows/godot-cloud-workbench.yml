name: Godot Cloud Workbench — playable core

on:
  push:
    branches:
      - "steward/playable-core-*"
    paths:
      - "game/core/**"
      - "game/integration/**"
      - "game/scenes/bootstrap/**"
      - "game/tests/**"
      - "tools/playable_core/**"
      - "migration/golden_run_v1.json"
      - ".github/workflows/godot-cloud-workbench.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-cloud-workbench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playable-core-proof:
    name: State tests and rendered foundation frame (cloud)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GODOT_RELEASE: "4.7.1-stable"
      GODOT_BIN: "/tmp/pn-godot/Godot_v4.7.1-stable_linux.x86_64"
      EVIDENCE_DIR: "evidence/godot-cloud-workbench"
    steps:
      - name: Checkout exact cloud candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Record provenance and reject fixture mismatch
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE_DIR"
          git rev-parse HEAD | tee "$EVIDENCE_DIR/commit-sha.txt"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m py_compile tools/playable_core/materialize_scene_sources.py
          cmp migration/golden_run_v1.json game/tests/fixtures/golden_run_v1.json
          test -s game/scenes/bootstrap/bootstrap.tscn
          test -s game/tests/run_all.gd
          echo "PN_CLOUD_EXACT_REF=PASS"

      - name: Install pinned Godot and minimal Xvfb dependencies
        shell: bash
        timeout-minutes: 4
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            xvfb unzip libgl1 libvulkan1 mesa-vulkan-drivers vulkan-tools \
            libx11-6 libxcursor1 libxinerama1 libxi6 libxrandr2 > /dev/null
          mkdir -p /tmp/pn-godot
          curl -fsSL --retry 3 --connect-timeout 15 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" \
            -o /tmp/pn-godot/godot.zip
          unzip -q /tmp/pn-godot/godot.zip -d /tmp/pn-godot
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version | tee "$EVIDENCE_DIR/godot-version.txt"
          vulkaninfo --summary > "$EVIDENCE_DIR/vulkan-summary.txt"

      - name: Import and execute canonical reducer/save tests
        shell: bash
        timeout-minutes: 3
        run: |
          set -Eeuo pipefail
          "$GODOT_BIN" --headless --path game --editor --quit \
            > "$EVIDENCE_DIR/import.log" 2>&1 || {
              cat "$EVIDENCE_DIR/import.log"
              exit 1
            }
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" "$EVIDENCE_DIR/import.log"; then
            exit 1
          fi
          "$GODOT_BIN" --headless --path game --script res://tests/run_all.gd \
            > "$EVIDENCE_DIR/tests.log" 2>&1 || {
              cat "$EVIDENCE_DIR/tests.log"
              exit 1
            }
          grep -F "PIXEL_NATIONS_GODOT_TESTS: PASS" "$EVIDENCE_DIR/tests.log"
          "$GODOT_BIN" --headless --path game --script res://tests/playable_core_controller_test.gd \
            > "$EVIDENCE_DIR/controller-tests.log" 2>&1 || {
              cat "$EVIDENCE_DIR/controller-tests.log"
              exit 1
            }
          grep -F "PN_PLAYABLE_CORE_CONTROLLER_TESTS: PASS" "$EVIDENCE_DIR/controller-tests.log"
          echo "PN_CLOUD_GAME_STATE_TESTS=PASS"

      - name: Materialize pinned World and Village source inputs
        shell: bash
        timeout-minutes: 9
        run: |
          set -Eeuo pipefail
          python3 tools/playable_core/materialize_scene_sources.py \
            --output /tmp/pn-playable-scene-sources \
            > "$EVIDENCE_DIR/source-bridge.log" 2>&1 || {
              cat "$EVIDENCE_DIR/source-bridge.log"
              exit 1
            }
          grep -F "PN_PLAYABLE_SOURCE_BRIDGE=PASS" "$EVIDENCE_DIR/source-bridge.log"
          "$GODOT_BIN" --headless --editor \
            --path /tmp/pn-playable-scene-sources --quit \
            > "$EVIDENCE_DIR/source-bridge-import.log" 2>&1 || {
              cat "$EVIDENCE_DIR/source-bridge-import.log"
              exit 1
            }
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|ERROR:" \
            "$EVIDENCE_DIR/source-bridge-import.log"; then
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("/tmp/pn-playable-scene-sources")
          manifest = json.loads((root / ".pn-source-manifest.json").read_text())
          assert manifest["missing_pixel_nations_transform"] is False
          assert manifest["status"] == "ROUGH_PLAYABLE_TRANSFORM_NOT_PRODUCT_ACCEPTANCE"
          assert manifest["unresolved_release_assets"] == []
          ne2 = root / "map/map_data/ne2.png"
          assert __import__("hashlib").sha256(ne2.read_bytes()).hexdigest() == "668970ed38a142a11a54e99348b458dc3f41e2d4e6b82bd527392031fb35afad"
          ne2_provenance = manifest["opengs_asset_provenance"]["map/map_data/ne2.png"]
          assert ne2_provenance["source_license"] == "Public Domain"
          assert ne2_provenance["source_url"].startswith("https://www.naturalearthdata.com/")
          assert (root / "game/main_game.tscn").is_file()
          assert (root / "village/scenes/approved.tscn").is_file()
          assert (root / "pixel_nations/playable_core.tscn").is_file()
          assert len(__import__("json").loads((root / "pixel_nations/a01_lands.json").read_text())["lands"]) == 30
          assert (root / "pixel_nations/a01_atlas_substrate.svg").is_file()
          assert "STATIC COMPOSITION TARGET" not in (root / "pixel_nations/a01_atlas_substrate.svg").read_text()
          hud = (root / "village/ui/approved_hud.gd").read_text()
          assert "Pixel Nations" in hud
          assert "Greengate's first road" in hud
          assert "Credits, licenses and source" in hud
          assert "The Free Game" not in hud
          assert "Primeiro, ligue a escola" not in hud
          assert manifest["village_identity_files_transformed"] == 2
          assert manifest["a01_atlas_substrate"]["source"] == "docs/visual-targets/world_atlas_a01_cartographic_mass_v1.svg"
          assert (root / "third_party/the-free-game/licenses/CC-BY-4.0.txt").is_file()
          assert (root / "THIRD_PARTY_CHANGES.md").is_file()
          print("PN_CLOUD_PLAYABLE_SOURCE_INPUTS=PASS")
          PY
          timeout 420s xvfb-run -a -s "-screen 0 1600x1000x24" env \
            LIBGL_ALWAYS_SOFTWARE=1 \
            PN_CLOUD_EVIDENCE_DIR="$PWD/$EVIDENCE_DIR" \
            "$GODOT_BIN" --path /tmp/pn-playable-scene-sources --audio-driver Dummy \
            --resolution 1440x900 --script res://pixel_nations/test_playable_runtime.gd \
            > "$EVIDENCE_DIR/playable-runtime.log" 2>&1 || {
              cat "$EVIDENCE_DIR/playable-runtime.log"
              exit 1
            }
          grep -F "PN_PLAYABLE_RUNTIME_CONTRACT=PASS" "$EVIDENCE_DIR/playable-runtime.log"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, struct
          evidence = Path("evidence/godot-cloud-workbench")
          for stem in ("world-claimed", "village-road-built", "world-riverbend-claimed", "world-riverbend-connected", "village-riverbend-supply", "world-riverbend-supplied", "village-highmere-survey", "world-highmere-inspected", "world-highmere-claimed", "world-highmere-claimed-reopened", "village-highmere-link-supply", "world-highmere-connected", "world-highmere-connected-reopened", "world-northgate-inspected", "world-northgate-inspected-reopened"):
              for suffix, expected in (("1440x900", (1440, 900)), ("360x225", (360, 225))):
                  path = evidence / f"{stem}-{suffix}.png"
                  data = path.read_bytes()
                  if data[:8] != b"\x89PNG\r\n\x1a\n" or struct.unpack(">II", data[16:24]) != expected:
                      raise SystemExit(f"invalid runtime evidence: {path}")
                  (evidence / f"{path.name}.sha256").write_text(hashlib.sha256(data).hexdigest()+"\n")
          print("PN_CLOUD_PLAYABLE_FRAMES=PASS")
          PY

      - name: Render bootstrap scene at two sizes (foundation smoke only)
        shell: bash
        timeout-minutes: 2
        run: |
          set -Eeuo pipefail
          # Deliberately captures the real bootstrap scene, NOT the unmerged OpenGS atlas.
          # This proves runner-side Godot rendering only; it is not an art/gameplay PASS.
          cat > game/tests/_cloud_capture.gd <<'GD'
          extends SceneTree

          func _initialize() -> void:
              call_deferred("_capture")

          func _capture() -> void:
              # The project defaults to 1280x720 with canvas stretching.
              # Explicitly resize the root window AND internal viewport for the QA still.
              root.content_scale_size = Vector2i(1440, 900)
              root.size = Vector2i(1440, 900)
              var packed := load("res://scenes/bootstrap/bootstrap.tscn") as PackedScene
              if packed == null:
                  push_error("PN_CLOUD_BOOTSTRAP_SCENE_MISSING")
                  quit(2)
                  return
              var scene := packed.instantiate() as Control
              root.add_child(scene)
              await process_frame
              await process_frame
              await create_timer(0.3).timeout
              var status := scene.get_node_or_null("Center/Panel/Margin/Content/StatusLabel") as Label
              if status == null or status.text != "FOUNDATION TEST: PASS":
                  push_error("PN_CLOUD_BOOTSTRAP_STATE_FAILED")
                  quit(3)
                  return
              var still := root.get_viewport().get_texture().get_image()
              print("PN_CLOUD_RENDERED_SIZE=", still.get_size())
              if still.get_size() != Vector2i(1440, 900):
                  push_error("PN_CLOUD_WRONG_FRAME_DIMENSIONS")
                  quit(4)
                  return
              var folder := OS.get_environment("PN_CLOUD_EVIDENCE_DIR")
              if still.save_png(folder.path_join("bootstrap-1440x900.png")) != OK:
                  quit(5)
                  return
              still.resize(360, 225, Image.INTERPOLATE_LANCZOS)
              if still.save_png(folder.path_join("bootstrap-360x225.png")) != OK:
                  quit(6)
                  return
              print("PN_CLOUD_BOOTSTRAP_FRAMES=PASS")
              quit(0)
          GD
          timeout 55s xvfb-run -a -s "-screen 0 1600x1000x24" env \
            LIBGL_ALWAYS_SOFTWARE=1 \
            PN_CLOUD_EVIDENCE_DIR="$PWD/$EVIDENCE_DIR" \
            "$GODOT_BIN" --path game --audio-driver Dummy \
            --rendering-method gl_compatibility --resolution 1440x900 \
            --script res://tests/_cloud_capture.gd \
            > "$EVIDENCE_DIR/render.log" 2>&1 || {
              cat "$EVIDENCE_DIR/render.log"
              exit 1
            }
          grep -F "PN_CLOUD_BOOTSTRAP_FRAMES=PASS" "$EVIDENCE_DIR/render.log"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, struct
          d = Path("evidence/godot-cloud-workbench")
          for name, expected in (("bootstrap-1440x900.png", (1440,900)), ("bootstrap-360x225.png",(360,225))):
              p=d/name
              data=p.read_bytes()
              if data[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit(f"Invalid PNG: {p}")
              size=struct.unpack(">II",data[16:24])
              if size!=expected or len(data)<3000:
                  raise SystemExit(f"Weak/mismatched PNG: {p}, {size}, {len(data)} bytes")
              (d/(name+".sha256")).write_text(hashlib.sha256(data).hexdigest()+"\n")
          print("PN_CLOUD_FRAME_EVIDENCE=PASS")
          PY

      - name: Always upload exact-SHA logs and images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pn-cloud-core-${{ github.sha }}-${{ github.run_id }}
          path: evidence/godot-cloud-workbench/**
          if-no-files-found: warn
          retention-days: 7
