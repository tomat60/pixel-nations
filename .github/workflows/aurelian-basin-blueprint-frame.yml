name: Aurelian Basin Blueprint Frame

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/aurelian-basin-blueprint-frame.yml
      - game/scenes/art_target/aurelian_basin_blueprint_frame.gd
      - game/scenes/art_target/aurelian_basin_blueprint_frame.tscn
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  GODOT_RELEASE: 4.7.1-stable
  KAYKIT_SHA: 84fa4e91af6a88989be7c99e0891cede11f2ca38
  EXPECTED_ARCHIVE_SHA: cfa7faff403c93fb90e8eeb448c78e6192782802a532bebed0bdb853b39f7028

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: art-target/aurelian-basin-blueprint-frame
          fetch-depth: 0

      - name: Install Godot and capture dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends unzip xvfb libgl1 libegl1 libx11-6 libxcursor1 libxinerama1 libxi6 libxrandr2 python3-pil >/dev/null
          mkdir -p /tmp/godot
          curl -fsSL --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" -o /tmp/godot/godot.zip
          unzip -q /tmp/godot/godot.zip -d /tmp/godot
          GODOT="/tmp/godot/Godot_v${GODOT_RELEASE}_linux.x86_64"
          chmod +x "$GODOT"
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"
          "$GODOT" --version

      - name: Fetch and verify exact KayKit subset
        run: |
          set -euo pipefail
          rm -rf /tmp/kaykit game/art_target/aurelian_basin evidence/aurelian-basin-frame
          mkdir -p /tmp/kaykit/src game/art_target/aurelian_basin evidence/aurelian-basin-frame
          curl -fsSL --retry 3 "https://github.com/KayKit-Game-Assets/KayKit-Medieval-Hexagon-Pack-1.0/archive/${KAYKIT_SHA}.zip" -o /tmp/kaykit/source.zip
          ACTUAL_ARCHIVE_SHA="$(sha256sum /tmp/kaykit/source.zip | cut -d' ' -f1)"
          test "$ACTUAL_ARCHIVE_SHA" = "$EXPECTED_ARCHIVE_SHA"
          unzip -q /tmp/kaykit/source.zip -d /tmp/kaykit/src
          ROOT="$(find /tmp/kaykit/src -mindepth 1 -maxdepth 1 -type d | head -1)"
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/KayKit-Game-Assets/KayKit-Medieval-Hexagon-Pack-1.0/${KAYKIT_SHA}/LICENSE.txt" -o game/art_target/aurelian_basin/LICENSE.txt
          grep -F "Creative Commons Zero" game/art_target/aurelian_basin/LICENSE.txt
          python3 - "$ROOT" game/art_target/aurelian_basin <<'PY'
          import hashlib, json, shutil, sys
          from pathlib import Path
          src, dest = Path(sys.argv[1]), Path(sys.argv[2])
          stems = [
              'building_home_A_red','building_home_B_red','building_blacksmith_red',
              'building_church_red','building_barracks_red','building_market_red','building_well_red'
          ]
          manifest = {'source_commit':'84fa4e91af6a88989be7c99e0891cede11f2ca38','license':'CC0-1.0','models':{}}
          copied = set()
          for stem in stems:
              hits = list(src.rglob(stem + '.gltf'))
              if len(hits) != 1:
                  raise SystemExit(f'Expected one {stem}, found {len(hits)}')
              model = hits[0]
              data = json.loads(model.read_text())
              target = dest / model.name
              shutil.copy2(model, target); copied.add(target.name)
              deps = []
              for item in data.get('buffers', []) + data.get('images', []):
                  uri = item.get('uri', '')
                  if not uri or uri.startswith('data:'):
                      continue
                  dep = (model.parent / uri).resolve()
                  if not dep.exists():
                      raise SystemExit(f'Missing dependency {uri} for {model}')
                  dep_target = dest / dep.name
                  if dep_target.name not in copied:
                      shutil.copy2(dep, dep_target); copied.add(dep_target.name)
                  deps.append(dep_target.name)
              manifest['models'][stem] = {
                  'source_path': str(model.relative_to(src)),
                  'resource_path': 'res://art_target/aurelian_basin/' + model.name,
                  'sha256': hashlib.sha256(model.read_bytes()).hexdigest(),
                  'dependencies': deps,
              }
          (dest/'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY
          printf '%s  %s\n' "$ACTUAL_ARCHIVE_SHA" source.zip > evidence/aurelian-basin-frame/source-archive.sha256
          sha256sum game/art_target/aurelian_basin/* | sort > evidence/aurelian-basin-frame/SOURCE_SHA256SUMS.txt
          cp game/art_target/aurelian_basin/manifest.json evidence/aurelian-basin-frame/source-manifest.json
          git rev-parse HEAD > evidence/aurelian-basin-frame/input-sha.txt
          git rev-parse HEAD > evidence/aurelian-basin-frame/output-sha.txt

      - name: Import exact Godot project
        run: |
          set -euo pipefail
          "$GODOT" --headless --path game --editor --quit 2>&1 | tee evidence/aurelian-basin-frame/import.log
          ! grep -E "SCRIPT ERROR|Parse Error|Failed to load|ERROR:" evidence/aurelian-basin-frame/import.log

      - name: Capture desktop and portrait frame
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR="${RUNNER_TEMP}/xdg-runtime"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          timeout 60s xvfb-run -a env CAPTURE_MODE=desktop CAPTURE_WIDTH=1440 CAPTURE_HEIGHT=900 CAPTURE_PATH="$PWD/evidence/aurelian-basin-frame/desktop-1440x900.png" CONTRACT_PATH="$PWD/evidence/aurelian-basin-frame/desktop-contract.json" "$GODOT" --path game res://scenes/art_target/aurelian_basin_blueprint_frame.tscn 2>&1 | tee evidence/aurelian-basin-frame/desktop.log
          timeout 60s xvfb-run -a env CAPTURE_MODE=portrait CAPTURE_WIDTH=390 CAPTURE_HEIGHT=844 CAPTURE_PATH="$PWD/evidence/aurelian-basin-frame/portrait-390x844.png" CONTRACT_PATH="$PWD/evidence/aurelian-basin-frame/portrait-contract.json" "$GODOT" --path game res://scenes/art_target/aurelian_basin_blueprint_frame.tscn 2>&1 | tee evidence/aurelian-basin-frame/portrait.log
          ! grep -E "SCRIPT ERROR|Parse Error|Failed to load|ERROR:" evidence/aurelian-basin-frame/desktop.log evidence/aurelian-basin-frame/portrait.log
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          from PIL import Image, ImageStat
          root = Path('evidence/aurelian-basin-frame')
          expected = {'desktop-1440x900.png':(1440,900), 'portrait-390x844.png':(390,844)}
          qa = {}
          for name, dims in expected.items():
              path = root/name
              if not path.exists() or path.stat().st_size < 15000:
                  raise SystemExit(f'Missing or tiny PNG: {name}')
              image = Image.open(path).convert('RGB')
              if image.size != dims:
                  raise SystemExit(f'Wrong dimensions {name}: {image.size}')
              stat = ImageStat.Stat(image)
              luminance = sum(stat.mean)/3.0
              variance = sum(stat.var)/3.0
              pixels = image.resize((240,150)).getdata()
              near_white = sum(1 for p in pixels if min(p) > 245) / (240*150)
              if variance < 35.0 or luminance < 25.0 or luminance > 225.0 or near_white > 0.08:
                  raise SystemExit(f'Image QA failed {name}: luminance={luminance:.2f} variance={variance:.2f} near_white={near_white:.4f}')
              qa[name] = {'width':dims[0],'height':dims[1],'bytes':path.stat().st_size,'sha256':hashlib.sha256(path.read_bytes()).hexdigest(),'mean_luminance':round(luminance,3),'variance':round(variance,3),'near_white_fraction':round(near_white,5)}
          desktop = json.loads((root/'desktop-contract.json').read_text())
          portrait = json.loads((root/'portrait-contract.json').read_text())
          input_sha = (root/'input-sha.txt').read_text().strip()
          output_sha = (root/'output-sha.txt').read_text().strip()
          if input_sha != output_sha:
              raise SystemExit('Input/output SHA mismatch')
          final = {'classification':'PENDING_HUMAN_REVIEW','input_sha':input_sha,'output_sha':output_sha,'source_commit':'84fa4e91af6a88989be7c99e0891cede11f2ca38','desktop':desktop,'portrait':portrait,'image_qa':qa}
          (root/'final-contract.json').write_text(json.dumps(final,indent=2)+'\n')
          PY
          find game/art_target/aurelian_basin -type f -printf '%s\n' | awk '{s+=$1} END{print s+0}' > evidence/aurelian-basin-frame/asset-bytes.txt
          find evidence/aurelian-basin-frame -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > evidence/aurelian-basin-frame/SHA256SUMS.txt

      - name: Upload exact frame evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurelian-basin-frame-${{ github.run_id }}
          path: evidence/aurelian-basin-frame/**
          if-no-files-found: warn
          retention-days: 30

      - name: Report frame run
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:308,body:`## Aurelian Basin frame run ${context.runId}\n\n- Event SHA: \`${context.sha}\`\n- Job status: \`${{ job.status }}\`\n- Artifact: \`aurelian-basin-frame-${context.runId}\`\n- Expected evidence: exact source manifest, desktop 1440x900, portrait 390x844, import/runtime logs, image QA and final contract.\n\nNo gameplay, second asset family, main write, merge, deployment or paid tool was used.`})
