name: Aurelian Accepted Map Assets

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/aurelian-map-assets.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: write

env:
  ACCEPTED_ARTIFACT_ID: 8729295069
  EXPECTED_ARTIFACT_DIGEST: c9681e78faf5cbed143b902beba3c06a1502cfc64138b136da36df62dd8d6a82
  EXPECTED_DESKTOP_SHA: bd9c996aa564720b66723f9242c9455154fc0e70b1b49c799fbf417c2310e22b
  EXPECTED_PORTRAIT_SHA: 06670347b122514100b106674bd839ea9eb9e4e55b8de59e18dd0edeb3bc5be9

jobs:
  generate-and-commit:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact integration branch
        uses: actions/checkout@v4
        with:
          ref: art-target/aurelian-2d-world-integration
          fetch-depth: 0

      - name: Fetch and verify accepted map artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/aurelian-accepted
          mkdir -p /tmp/aurelian-accepted public/art
          curl -fsSL --retry 3 \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ACCEPTED_ARTIFACT_ID}/zip" \
            -o /tmp/aurelian-accepted/artifact.zip
          test "$(sha256sum /tmp/aurelian-accepted/artifact.zip | cut -d' ' -f1)" = "$EXPECTED_ARTIFACT_DIGEST"
          unzip -q /tmp/aurelian-accepted/artifact.zip -d /tmp/aurelian-accepted/files
          cp /tmp/aurelian-accepted/files/godot-desktop-1440x900.png public/art/aurelian-basin-map-desktop.png
          cp /tmp/aurelian-accepted/files/godot-portrait-390x844.png public/art/aurelian-basin-map-portrait.png
          EXPECTED_DESKTOP_SHA="$EXPECTED_DESKTOP_SHA" EXPECTED_PORTRAIT_SHA="$EXPECTED_PORTRAIT_SHA" python3 - <<'PY'
          import hashlib, os, struct
          from pathlib import Path
          checks = {
              Path('public/art/aurelian-basin-map-desktop.png'): ((1440, 900), os.environ['EXPECTED_DESKTOP_SHA']),
              Path('public/art/aurelian-basin-map-portrait.png'): ((390, 844), os.environ['EXPECTED_PORTRAIT_SHA']),
          }
          for path, (dims, expected_sha) in checks.items():
              data = path.read_bytes()
              if data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'not a PNG: {path}')
              width, height = struct.unpack('>II', data[16:24])
              actual_sha = hashlib.sha256(data).hexdigest()
              if (width, height) != dims or actual_sha != expected_sha:
                  raise SystemExit(f'accepted asset mismatch {path}: dims={(width,height)} sha={actual_sha}')
              print(f'ACCEPTED_MAP_ASSET_VERIFIED={path}:{width}x{height}:{actual_sha}')
          PY

      - name: Commit exact accepted assets to integration branch
        run: |
          set -euo pipefail
          git config user.name "pixel-nations-steward[bot]"
          git config user.email "pixel-nations-steward[bot]@users.noreply.github.com"
          git add public/art/aurelian-basin-map-desktop.png public/art/aurelian-basin-map-portrait.png
          if git diff --cached --quiet; then
            echo AURELIAN_ASSETS_ALREADY_CURRENT
          else
            git commit -m "Add accepted Aurelian desktop and portrait map assets"
            git push origin HEAD:art-target/aurelian-2d-world-integration
            echo AURELIAN_ASSETS_COMMITTED
          fi

      - name: Report asset bootstrap
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:316,body:`## Accepted map asset bootstrap ${context.runId}\n\n- Event SHA: \`${context.sha}\`\n- Job status: \`${{ job.status }}\`\n- Source artifact: \`${process.env.ACCEPTED_ARTIFACT_ID}\`\n- Target branch: \`art-target/aurelian-2d-world-integration\`\n- Exact PNG bytes are committed only after artifact digest, dimensions and SHA-256 verification.\n\nNo Blender rerender, public-main write, merge, deployment, payment or MAX was used.`})
