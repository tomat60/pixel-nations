name: KayKit Aurelian Basin Static Target

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/kaykit-aurelian-basin-static.yml
      - game/scenes/art_target/**
      - tools/blender/aurelian_basin_static.py
  push:
    branches: [art-target/kaykit-aurelian-basin-static]
    paths: [.github/workflows/kaykit-aurelian-basin-static.yml]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  GODOT_RELEASE: 4.7.1-stable
  KAYKIT_SHA: 84fa4e91af6a88989be7c99e0891cede11f2ca38
  TARGET_BRANCH: art-target/kaykit-aurelian-basin-static

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Install Blender, Godot and render dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends blender unzip xvfb libgl1 libx11-6 libxcursor1 libxinerama1 libxi6 libxrandr2 >/dev/null
          mkdir -p /tmp/godot
          curl -fsSL --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" -o /tmp/godot/godot.zip
          unzip -q /tmp/godot/godot.zip -d /tmp/godot
          GODOT="/tmp/godot/Godot_v${GODOT_RELEASE}_linux.x86_64"
          chmod +x "$GODOT"
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"
          blender --version | head -1
          "$GODOT" --version

      - name: Curate exact pinned KayKit subset
        run: |
          set -euo pipefail
          rm -rf /tmp/kaykit game/art_target/kaykit game/art_target/terrain evidence/kaykit-aurelian-basin
          mkdir -p /tmp/kaykit/src game/art_target/kaykit game/art_target/terrain evidence/kaykit-aurelian-basin
          curl -fsSL --retry 3 "https://github.com/KayKit-Game-Assets/KayKit-Medieval-Hexagon-Pack-1.0/archive/${KAYKIT_SHA}.zip" -o /tmp/kaykit/source.zip
          test "$(head -c 2 /tmp/kaykit/source.zip)" = "PK"
          unzip -q /tmp/kaykit/source.zip -d /tmp/kaykit/src
          sha256sum /tmp/kaykit/source.zip | tee game/art_target/kaykit/source-archive.sha256
          ROOT="$(find /tmp/kaykit/src -mindepth 1 -maxdepth 1 -type d | head -1)"
          find "$ROOT" -type f | sort > evidence/kaykit-aurelian-basin/full-source-manifest.txt
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/KayKit-Game-Assets/KayKit-Medieval-Hexagon-Pack-1.0/${KAYKIT_SHA}/LICENSE.txt" -o game/art_target/kaykit/LICENSE.txt
          grep -F "Creative Commons Zero" game/art_target/kaykit/LICENSE.txt
          python3 - "$ROOT" game/art_target/kaykit <<'PY'
          import hashlib,json,re,shutil,sys
          from pathlib import Path
          src,dest=Path(sys.argv[1]),Path(sys.argv[2])
          files=sorted(src.rglob('*.gltf'))
          exact={
            'church':'building_church_red',
            'blacksmith':'building_blacksmith_red',
            'barracks':'building_barracks_red',
            'house_a':'building_home_A_red',
            'house_b':'building_home_B_red',
            'market':'building_market_red',
            'well':'building_well_red',
          }
          chosen={}
          for role,stem in exact.items():
              hits=[p for p in files if p.stem==stem]
              if len(hits)!=1: raise SystemExit(f'Expected one {stem}, found {len(hits)}')
              chosen[role]=hits[0]
          for role,pattern in {'tree':r'tree','rock':r'rock'}.items():
              hits=[p for p in files if re.search(pattern,p.stem,re.I)]
              if not hits: raise SystemExit(f'Missing {role}; available nature stems='+','.join(p.stem for p in files if 'decoration/nature' in str(p).replace('\\','/')))
              chosen[role]=hits[0]
          copied=set(); manifest={'source_commit':'84fa4e91af6a88989be7c99e0891cede11f2ca38','license':'CC0-1.0','models':{}}
          for role,p in chosen.items():
              rel=p.relative_to(src); target=dest/'source'/rel; target.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(p,target); copied.add(p.resolve())
              deps=[]
              data=json.loads(p.read_text())
              for item in data.get('buffers',[])+data.get('images',[]):
                  uri=item.get('uri','')
                  if not uri or uri.startswith('data:'): continue
                  dep=(p.parent/uri).resolve()
                  if not dep.exists(): raise SystemExit(f'Missing {uri} for {p}')
                  drel=dep.relative_to(src.resolve()); dt=dest/'source'/drel; dt.parent.mkdir(parents=True,exist_ok=True)
                  if dep not in copied: shutil.copy2(dep,dt); copied.add(dep)
                  deps.append(str(drel))
              manifest['models'][role]={'source_path':str(rel),'resource_path':'res://art_target/kaykit/source/'+str(rel).replace('\\','/'),'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'dependencies':deps}
          if len(chosen)>16: raise SystemExit(f'Curated model gate exceeded: {len(chosen)}')
          if len(copied)>20: raise SystemExit(f'Curated source file gate exceeded: {len(copied)}; files='+','.join(str(p.relative_to(src.resolve())) for p in sorted(copied)))
          manifest['curated_source_file_count']=len(copied); manifest['curated_model_count']=len(chosen)
          (dest/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          with (dest/'SHA256SUMS.txt').open('w') as out:
              for p in sorted(dest.rglob('*')):
                  if p.is_file() and p.name!='SHA256SUMS.txt': out.write(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(dest)}\n")
          PY
          cat game/art_target/kaykit/manifest.json | tee evidence/kaykit-aurelian-basin/curated-manifest.json

      - name: Author continuous terrain and support geometry in Blender
        run: |
          set -euo pipefail
          blender -b --python tools/blender/aurelian_basin_static.py > evidence/kaykit-aurelian-basin/blender.log 2>&1
          test -s /tmp/aurelian_basin.glb
          cp /tmp/aurelian_basin.glb game/art_target/terrain/aurelian_basin.glb
          sha256sum game/art_target/terrain/aurelian_basin.glb | tee evidence/kaykit-aurelian-basin/terrain-sha256.txt
          grep -F 'AURELIAN_TERRAIN_EXPORTED=' evidence/kaykit-aurelian-basin/blender.log

      - name: Import and capture exact scene
        run: |
          set -euo pipefail
          "$GODOT" --headless --path game --editor --quit > evidence/kaykit-aurelian-basin/import.log 2>&1
          ! grep -E "SCRIPT ERROR|Parse Error|Failed to load" evidence/kaykit-aurelian-basin/import.log
          timeout 35s xvfb-run -a env CAPTURE_WIDTH=1440 CAPTURE_HEIGHT=900 CAPTURE_PATH="$PWD/evidence/kaykit-aurelian-basin/desktop-1440x900.png" "$GODOT" --path game res://scenes/art_target/aurelian_basin_target.tscn > evidence/kaykit-aurelian-basin/desktop.log 2>&1
          timeout 35s xvfb-run -a env CAPTURE_WIDTH=390 CAPTURE_HEIGHT=844 CAPTURE_PATH="$PWD/evidence/kaykit-aurelian-basin/mobile-390x844.png" "$GODOT" --path game res://scenes/art_target/aurelian_basin_target.tscn > evidence/kaykit-aurelian-basin/mobile.log 2>&1
          test -s evidence/kaykit-aurelian-basin/desktop-1440x900.png
          test -s evidence/kaykit-aurelian-basin/mobile-390x844.png
          ! grep -E "SCRIPT ERROR|Parse Error|Failed to load|ERROR:" evidence/kaykit-aurelian-basin/*.log
          find game/art_target -type f -printf '%s\n' | awk '{s+=$1} END{print s+0}' > evidence/kaykit-aurelian-basin/asset-bytes.txt
          sha256sum evidence/kaykit-aurelian-basin/*.png game/art_target/kaykit/manifest.json game/art_target/terrain/aurelian_basin.glb > evidence/kaykit-aurelian-basin/SHA256SUMS.txt

      - name: Commit generated subset and evidence
        run: |
          set -euo pipefail
          git config user.name pixel-nations-steward
          git config user.email actions@users.noreply.github.com
          git add game/art_target game/scenes/art_target tools/blender/aurelian_basin_static.py evidence/kaykit-aurelian-basin
          git diff --cached --quiet && { echo 'No generated changes'; exit 1; }
          git commit -m "feat(godot): add authored KayKit Aurelian Basin target"
          git push origin HEAD:${TARGET_BRANCH}

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaykit-aurelian-basin-${{ github.run_id }}
          path: evidence/kaykit-aurelian-basin/**
          if-no-files-found: warn
          retention-days: 30

      - name: Comment gate issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:298,body:`## KayKit authored target run ${context.runId}\n\n- Workflow SHA: \`${context.sha}\`\n- Branch: \`${process.env.TARGET_BRANCH}\`\n- Job status: \`${{ job.status }}\`\n- Artifact: \`kaykit-aurelian-basin-${context.runId}\`\n- Evidence expected: pinned manifest, static Blender terrain GLB, desktop 1440x900, mobile 390x844.\n\nNo main write, merge, deployment, gameplay, paid asset or second asset family was used.`})

