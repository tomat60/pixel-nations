name: Pixel Nations Play Visual QA

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  play-visual-qa:
    name: Generate /play gameplay evidence
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Generate primary play evidence
        id: primary
        continue-on-error: true
        run: node scripts/qa-play-screenshots.mjs

      - name: Generate Village progression evidence
        id: village
        if: always()
        continue-on-error: true
        run: npm run qa:village

      - name: Generate Village progression video evidence
        id: progression
        if: always()
        continue-on-error: true
        run: node scripts/qa-village-progression-video.mjs

      - name: Generate complete Founder Run evidence
        id: founder
        if: always()
        continue-on-error: true
        run: npm run qa:founder-run

      - name: Generate City to Nation continuity evidence
        id: city_nation
        if: always()
        continue-on-error: true
        run: npm run qa:city-nation

      - name: Generate settlement stewardship evidence
        id: settlement
        if: always()
        continue-on-error: true
        run: npm run qa:settlement

      - name: Generate posture evidence
        id: posture
        if: always()
        continue-on-error: true
        run: node scripts/qa-play-branches.mjs

      - name: Generate imperial cycle evidence
        id: imperial
        if: always()
        continue-on-error: true
        run: node scripts/qa-imperial-turn.mjs

      - name: Generate first-run finale evidence
        id: finale
        if: always()
        continue-on-error: true
        run: node scripts/qa-demo-complete.mjs

      - name: Generate empire crisis evidence
        id: crisis
        if: always()
        continue-on-error: true
        run: node scripts/qa-empire-crisis.mjs

      - name: Generate post-crisis counter-move evidence
        id: post_crisis
        if: always()
        continue-on-error: true
        run: node scripts/qa-post-crisis-countermove.mjs

      - name: Upload play evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pixel-nations-play-evidence
          path: |
            public/qa/play-latest
            public/qa/village-scene
            public/qa/village-progression
            public/qa/founder-run
            public/qa/city-nation-continuity
            public/qa/settlement-economy
          if-no-files-found: error
          retention-days: 7

      - name: Enforce complete gameplay evidence gates
        if: always()
        env:
          PRIMARY_OUTCOME: ${{ steps.primary.outcome }}
          VILLAGE_OUTCOME: ${{ steps.village.outcome }}
          PROGRESSION_OUTCOME: ${{ steps.progression.outcome }}
          FOUNDER_OUTCOME: ${{ steps.founder.outcome }}
          CITY_NATION_OUTCOME: ${{ steps.city_nation.outcome }}
          SETTLEMENT_OUTCOME: ${{ steps.settlement.outcome }}
          POSTURE_OUTCOME: ${{ steps.posture.outcome }}
          IMPERIAL_OUTCOME: ${{ steps.imperial.outcome }}
          FINALE_OUTCOME: ${{ steps.finale.outcome }}
          CRISIS_OUTCOME: ${{ steps.crisis.outcome }}
          POST_CRISIS_OUTCOME: ${{ steps.post_crisis.outcome }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";

          const failures = [];
          const outcomes = {
            primary: process.env.PRIMARY_OUTCOME,
            village: process.env.VILLAGE_OUTCOME,
            progression: process.env.PROGRESSION_OUTCOME,
            founder: process.env.FOUNDER_OUTCOME,
            cityNation: process.env.CITY_NATION_OUTCOME,
            settlement: process.env.SETTLEMENT_OUTCOME,
            posture: process.env.POSTURE_OUTCOME,
            imperial: process.env.IMPERIAL_OUTCOME,
            finale: process.env.FINALE_OUTCOME,
            crisis: process.env.CRISIS_OUTCOME,
            postCrisis: process.env.POST_CRISIS_OUTCOME,
          };
          for (const [name, outcome] of Object.entries(outcomes)) {
            if (outcome !== "success") failures.push(`${name} step outcome: ${outcome}`);
          }

          async function readJson(path, label) {
            try {
              return JSON.parse(await readFile(path, "utf8"));
            } catch (error) {
              failures.push(`${label} missing or invalid: ${error.message}`);
              return null;
            }
          }

          const interactions = await readJson("public/qa/play-latest/interaction-log.json", "primary interaction log");
          if (Array.isArray(interactions)) {
            for (const item of interactions.filter((entry) => entry.status !== "ok")) {
              failures.push(`primary ${item.viewport}/${item.stepId}: ${item.error ?? item.status}`);
            }
          }

          const village = await readJson("public/qa/village-scene/village-scene-result.json", "Village result");
          if (village && village.status !== "PASS") failures.push(`Village result: ${village.blockingStep || "unknown"}: ${village.error || village.status}`);

          const progression = await readJson("public/qa/village-progression/sequence-manifest.json", "progression manifest");
          if (progression && progression.status !== "passed") failures.push(`Progression result: ${progression.blockingFailure || progression.status}`);

          const founder = await readJson("public/qa/founder-run/founder-run-result.json", "Founder Run result");
          if (founder && founder.status !== "PASS") failures.push(`Founder Run result: ${founder.blockingStep || "unknown"}: ${founder.error || founder.status}`);
          if (founder && (!Array.isArray(founder.viewports) || founder.viewports.length !== 2)) failures.push("Founder Run must include desktop and mobile evidence.");

          const cityNation = await readJson("public/qa/city-nation-continuity/city-nation-continuity-result.json", "City/Nation continuity result");
          if (cityNation && cityNation.status !== "PASS") failures.push(`City/Nation result: ${cityNation.blockingStep || "unknown"}: ${cityNation.error || cityNation.status}`);
          if (cityNation && (!Array.isArray(cityNation.viewports) || cityNation.viewports.length !== 2)) failures.push("City/Nation continuity must include desktop and mobile evidence.");

          const settlement = await readJson("public/qa/settlement-economy/settlement-economy-result.json", "settlement stewardship result");
          if (settlement && settlement.status !== "PASS") failures.push(`Settlement result: ${settlement.blockingStep || "unknown"}: ${settlement.error || settlement.status}`);
          if (settlement && (!Array.isArray(settlement.viewports) || settlement.viewports.length !== 2)) failures.push("Settlement stewardship must include desktop and mobile evidence.");
          if (settlement && (!Array.isArray(settlement.screenshots) || settlement.screenshots.length !== 4)) failures.push("Settlement stewardship must include four screenshots.");

          const advancedEvidence = [
            ["public/qa/play-latest/branches/branch-summary.json", "posture evidence"],
            ["public/qa/play-latest/imperial-turn/turn-summary.json", "Imperial Turn evidence"],
            ["public/qa/play-latest/demo-complete/demo-summary.json", "advanced finale evidence"],
            ["public/qa/play-latest/empire-crisis/empire-crisis-summary.json", "empire crisis evidence"],
            ["public/qa/play-latest/post-crisis-countermove/post-crisis-countermove-summary.json", "post-crisis evidence"],
          ];
          for (const [path, label] of advancedEvidence) {
            const summary = await readJson(path, label);
            if (summary && summary.status && summary.status !== "ok") failures.push(`${label} status: ${summary.status}`);
          }

          if (failures.length) {
            console.error("PIXEL_NATIONS_PLAY_QA_FAILED");
            for (const failure of failures) console.error(`- ${failure}`);
            process.exit(1);
          }
          console.log("PIXEL_NATIONS_PLAY_QA_PASSED");
          NODE
