name: Pixel Nations Play Visual QA

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  play-visual-qa:
    name: Generate /play gameplay evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Generate /play gameplay evidence
        run: node scripts/qa-play-screenshots.mjs

      - name: Upload /play visual evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pixel-nations-play-evidence
          path: public/qa/play-latest
          if-no-files-found: error
          retention-days: 14
