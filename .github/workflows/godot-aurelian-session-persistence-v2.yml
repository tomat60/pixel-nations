        run: |
          if [ -n "${WEB_SERVER_PID:-}" ]; then kill "${WEB_SERVER_PID}" || true; fi

      - name: Upload exact-head persistence v2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-aurelian-session-persistence-v2-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/godot-aurelian-session-persistence-v2
          if-no-files-found: error
          retention-days: 7
