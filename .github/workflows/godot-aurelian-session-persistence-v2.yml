name: Godot Aurelian Session Persistence V2

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/godot-aurelian-session-persistence-v2.yml"
      - "game/scenes/aurelian/aurelian_session_persistence_v2.gd"
      - "game/scenes/aurelian/playable_aurelian_entry_v1.gd"
      - "game/scenes/aurelian/playable_aurelian_entry_v1_manifest.json"
      - "game/scenes/aurelian/aurelian_first_settlement_development_v1_manifest.json"
      - "game/scenes/aurelian/aurelian_first_trade_route_connection_v1_manifest.json"
      - "game/scenes/aurelian/aurelian_first_trade_caravan_dispatch_v1_manifest.json"
      - "game/scenes/aurelian/aurelian_first_city_charter_v1_manifest.json"
      - "game/scenes/aurelian/aurelian_first_nation_founding_v1_manifest.json"
      - "game/scenes/aurelian/aurelian_living_capital_vertical_slice_v1_manifest.json"
      - "game/scenes/aurelian/first_national_direction_commitment_v1_manifest.json"
      - "game/scenes/aurelian/first_national_mandate_v1_manifest.json"
      - "game/scenes/aurelian/first_empire_proclamation_v1_manifest.json"
      - "game/scenes/aurelian/directional_empire_identity_v1_manifest.json"
      - "game/scenes/aurelian/river_surge_crisis_v1_manifest.json"
      - "game/scenes/aurelian/first_rival_countermove_v1_manifest.json"
      - "game/scenes/aurelian/first_frontier_payoff_v1_manifest.json"
      - "game/scenes/aurelian/first_imperial_expansion_v1_manifest.json"
      - "game/scenes/aurelian/north_ridge_outpost_v1_manifest.json"
      - "game/scenes/aurelian/north_ridge_specialization_v1_manifest.json"
      - "game/scenes/aurelian/north_ridge_specialization_payoff_v1_manifest.json"
      - "game/tests/aurelian_session_persistence_v2_test.gd"
      - "game/tests/playable_aurelian_entry_v1_test.gd"
      - "game/tests/aurelian_first_land_claim_v1_test.gd"
      - "game/tests/aurelian_first_settlement_development_v1_test.gd"
      - "game/tests/aurelian_first_trade_route_connection_v1_test.gd"
      - "game/tests/aurelian_first_trade_caravan_dispatch_v1_test.gd"
      - "game/tests/aurelian_first_city_charter_v1_test.gd"
      - "game/tests/aurelian_first_nation_founding_v1_test.gd"
      - "game/tests/aurelian_living_capital_vertical_slice_v1_test.gd"
      - "game/tests/aurelian_first_national_direction_commitment_v1_test.gd"
      - "game/tests/aurelian_first_national_mandate_v1_test.gd"
      - "game/tests/aurelian_first_empire_proclamation_v1_test.gd"
      - "game/tests/aurelian_directional_empire_identity_v1_test.gd"
      - "game/tests/aurelian_river_surge_crisis_v1_test.gd"
      - "game/tests/aurelian_first_rival_countermove_v1_test.gd"
      - "game/tests/aurelian_first_frontier_payoff_v1_test.gd"
      - "game/tests/aurelian_first_imperial_expansion_v1_test.gd"
      - "game/tests/aurelian_north_ridge_outpost_v1_test.gd"
      - "game/tests/aurelian_north_ridge_specialization_v1_test.gd"
      - "game/tests/aurelian_north_ridge_specialization_payoff_v1_test.gd"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-aurelian-session-persistence-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.1"
  GODOT_RELEASE: "4.7.1-stable"
  GODOT_BIN: "/tmp/godot/Godot_v4.7.1-stable_linux.x86_64"
  EVIDENCE_DIR: "evidence/godot-aurelian-session-persistence-v2"
  GLB_SHA256: "04116e3d662d461f0d29ca797444193b0873f5aba6012790af7d366c63e01048"

jobs:
  prove-session-persistence-v2:
    name: Prove native and synchronous Web persistence v2
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Record exact head
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_DIR}/stills"
          git rev-parse HEAD | tee "${EVIDENCE_DIR}/exact-head.txt"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          fi
          cp game/scenes/aurelian/playable_aurelian_entry_v1_manifest.json "${EVIDENCE_DIR}/persistence-schema-manifest.json"
          cp game/scenes/aurelian/aurelian_living_capital_vertical_slice_v1_manifest.json "${EVIDENCE_DIR}/living-capital-manifest.json"
          cp game/scenes/aurelian/first_national_direction_commitment_v1_manifest.json "${EVIDENCE_DIR}/national-direction-manifest.json"
          cp game/scenes/aurelian/first_national_mandate_v1_manifest.json "${EVIDENCE_DIR}/national-mandate-manifest.json"
          cp game/scenes/aurelian/first_empire_proclamation_v1_manifest.json "${EVIDENCE_DIR}/empire-proclamation-manifest.json"
          cp game/scenes/aurelian/directional_empire_identity_v1_manifest.json "${EVIDENCE_DIR}/directional-empire-identity-manifest.json"
          cp game/scenes/aurelian/river_surge_crisis_v1_manifest.json "${EVIDENCE_DIR}/river-surge-crisis-manifest.json"
          cp game/scenes/aurelian/first_rival_countermove_v1_manifest.json "${EVIDENCE_DIR}/first-rival-countermove-manifest.json"
          cp game/scenes/aurelian/first_frontier_payoff_v1_manifest.json "${EVIDENCE_DIR}/first-frontier-payoff-manifest.json"
          cp game/scenes/aurelian/first_imperial_expansion_v1_manifest.json "${EVIDENCE_DIR}/first-imperial-expansion-manifest.json"
          cp game/scenes/aurelian/north_ridge_outpost_v1_manifest.json "${EVIDENCE_DIR}/north-ridge-outpost-manifest.json"
          cp game/scenes/aurelian/north_ridge_specialization_v1_manifest.json "${EVIDENCE_DIR}/north-ridge-specialization-manifest.json"
          cp game/scenes/aurelian/north_ridge_specialization_payoff_v1_manifest.json "${EVIDENCE_DIR}/north-ridge-specialization-payoff-manifest.json"

      - name: Install existing QA tools
        timeout-minutes: 8
        run: |
          set -euo pipefail
          npm ci
          npx playwright install chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends unzip libgl1 imagemagick ffmpeg xvfb xdotool >/dev/null

      - name: Download pinned Godot and export templates
        timeout-minutes: 7
        run: |
          set -euo pipefail
          mkdir -p /tmp/godot /tmp/godot-templates
          curl -fsSL --retry 4 --retry-all-errors --connect-timeout 20 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" \
            -o /tmp/godot/godot.zip
          curl -fsSL --retry 4 --retry-all-errors --connect-timeout 20 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz" \
            -o /tmp/godot/templates.tpz
          unzip -q /tmp/godot/godot.zip -d /tmp/godot
          chmod +x "${GODOT_BIN}"
          unzip -q /tmp/godot/templates.tpz -d /tmp/godot-templates
          mkdir -p "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cp -R /tmp/godot-templates/templates/. "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          "${GODOT_BIN}" --version | tee "${EVIDENCE_DIR}/godot-version.txt"

      - name: Import, test adapters, and export
        timeout-minutes: 8
        run: |
          set -euo pipefail
          test "$(sha256sum game/assets/aurelian-basin/export/aurelian_authored_terrain_v1.glb | cut -d' ' -f1)" = "${GLB_SHA256}"
          "${GODOT_BIN}" --headless --path game --editor --quit > "${EVIDENCE_DIR}/godot-import.log" 2>&1
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" "${EVIDENCE_DIR}/godot-import.log"; then
            cat "${EVIDENCE_DIR}/godot-import.log"
            exit 1
          fi
          for test in playable_aurelian_entry_v1_test aurelian_session_persistence_v2_test aurelian_first_land_claim_v1_test aurelian_first_settlement_development_v1_test aurelian_first_trade_route_connection_v1_test aurelian_first_trade_caravan_dispatch_v1_test aurelian_first_city_charter_v1_test aurelian_first_nation_founding_v1_test aurelian_living_capital_vertical_slice_v1_test aurelian_first_national_direction_commitment_v1_test aurelian_first_national_mandate_v1_test aurelian_first_empire_proclamation_v1_test aurelian_directional_empire_identity_v1_test aurelian_river_surge_crisis_v1_test aurelian_first_rival_countermove_v1_test aurelian_first_frontier_payoff_v1_test aurelian_first_imperial_expansion_v1_test aurelian_north_ridge_outpost_v1_test aurelian_north_ridge_specialization_v1_test aurelian_north_ridge_specialization_payoff_v1_test; do
            "${GODOT_BIN}" --headless --path game --script "res://tests/${test}.gd" > "${EVIDENCE_DIR}/${test}.log" 2>&1 || { cat "${EVIDENCE_DIR}/${test}.log"; exit 1; }
          done
          grep -F "GODOT_PLAYABLE_AURELIAN_ENTRY_V1_TEST: PASS" "${EVIDENCE_DIR}/playable_aurelian_entry_v1_test.log"
          grep -F "GODOT_AURELIAN_SESSION_PERSISTENCE_V2_TEST: PASS" "${EVIDENCE_DIR}/aurelian_session_persistence_v2_test.log"
          grep -F "GODOT_AURELIAN_FIRST_LAND_CLAIM_V1_TEST: PASS" "${EVIDENCE_DIR}/aurelian_first_land_claim_v1_test.log"
          grep -F "GODOT_AURELIAN_FIRST_SETTLEMENT_DEVELOPMENT_V1_TEST: PASS" "${EVIDENCE_DIR}/aurelian_first_settlement_development_v1_test.log"
          grep -F "GODOT_AURELIAN_FIRST_TRADE_ROUTE_CONNECTION_V1_TEST: PASS" "${EVIDENCE_DIR}/aurelian_first_trade_route_connection_v1_test.log"
          grep -F "GODOT_AURELIAN_FIRST_TRADE_CARAVAN_DISPATCH_V1_TEST: PASS" "${EVIDENCE_DIR}/aurelian_first_trade_caravan_dispatch_v1_test.log"
          grep -F "GODOT_AURELIAN_FIRST_CITY_CHARTER_V1_TEST: PASS" "${EVIDENCE_DIR}/aurelian_first_city_charter_v1_test.log"
          grep -F "GODOT_AURELIAN_FIRST_NATION_FOUNDING_V1_TEST: PASS" "${EVIDENCE_DIR}/aurelian_first_nation_founding_v1_test.log"
          grep -F "AURELIAN_LIVING_CAPITAL_VERTICAL_SLICE_V1_TEST: PASS" "${EVIDENCE_DIR}/aurelian_living_capital_vertical_slice_v1_test.log"
          grep -F "GODOT_AURELIAN_FIRST_NATIONAL_DIRECTION_COMMITMENT_V1_TEST: PASS" "${EVIDENCE_DIR}/aurelian_first_national_direction_commitment_v1_test.log"
          grep -F "GODOT_AURELIAN_FIRST_NATIONAL_MANDATE_V1_TEST: PASS" "${EVIDENCE_DIR}/aurelian_first_national_mandate_v1_test.log"
          grep -F "GODOT_AURELIAN_FIRST_EMPIRE_PROCLAMATION_V1_TEST: PASS" "${EVIDENCE_DIR}/aurelian_first_empire_proclamation_v1_test.log"
          grep -F "GODOT_AURELIAN_DIRECTIONAL_EMPIRE_IDENTITY_V1_TEST: PASS" "${EVIDENCE_DIR}/aurelian_directional_empire_identity_v1_test.log"
          grep -F "GODOT_AURELIAN_RIVER_SURGE_CRISIS_V1_TEST: PASS" "${EVIDENCE_DIR}/aurelian_river_surge_crisis_v1_test.log"
          grep -F "GODOT_AURELIAN_FIRST_RIVAL_COUNTERMOVE_V1_TEST: PASS" "${EVIDENCE_DIR}/aurelian_first_rival_countermove_v1_test.log"
          grep -F "GODOT_AURELIAN_FIRST_FRONTIER_PAYOFF_V1_TEST: PASS" "${EVIDENCE_DIR}/aurelian_first_frontier_payoff_v1_test.log"
          grep -F "GODOT_AURELIAN_FIRST_IMPERIAL_EXPANSION_V1_TEST: PASS" "${EVIDENCE_DIR}/aurelian_first_imperial_expansion_v1_test.log"
          grep -F "GODOT_AURELIAN_NORTH_RIDGE_OUTPOST_V1_TEST: PASS" "${EVIDENCE_DIR}/aurelian_north_ridge_outpost_v1_test.log"
          grep -F "GODOT_AURELIAN_NORTH_RIDGE_SPECIALIZATION_V1_TEST: PASS" "${EVIDENCE_DIR}/aurelian_north_ridge_specialization_v1_test.log"
          grep -F "GODOT_AURELIAN_NORTH_RIDGE_SPECIALIZATION_PAYOFF_V1_TEST: PASS" "${EVIDENCE_DIR}/aurelian_north_ridge_specialization_payoff_v1_test.log"
          mkdir -p game/build/linux game/build/web
          "${GODOT_BIN}" --headless --path game --export-release "Linux/X11" build/linux/pixel-nations-foundation.x86_64 > "${EVIDENCE_DIR}/export-linux.log" 2>&1
          "${GODOT_BIN}" --headless --path game --export-release "Web" build/web/index.html > "${EVIDENCE_DIR}/export-web.log" 2>&1
          test -x game/build/linux/pixel-nations-foundation.x86_64
          test -s game/build/web/index.pck
          grep -aF "aurelian_session_persistence_v2.gd" game/build/linux/pixel-nations-foundation.pck
          grep -aF "aurelian_session_persistence_v2.gd" game/build/web/index.pck

      - name: Prove native developed-settlement restart with real input
        timeout-minutes: 5
        run: |
          set -euo pipefail
          export HOME="${RUNNER_TEMP}/aurelian-native-v2-profile"
          mkdir -p "$HOME"
          export DISPLAY=:99
          Xvfb :99 -screen 0 1440x900x24 > "${EVIDENCE_DIR}/xvfb.log" 2>&1 &
          XVFB_PID=$!
          trap 'kill $XVFB_PID || true' EXIT
          for attempt in $(seq 1 40); do
            xdotool getdisplaygeometry >/dev/null 2>&1 && break
            sleep 0.25
          done
          xdotool getdisplaygeometry >/dev/null
          cd game/build/linux
          stdbuf -oL -eL ./pixel-nations-foundation.x86_64 --audio-driver Dummy --rendering-method gl_compatibility --resolution 1440x900 --position 0,0 > "../../../${EVIDENCE_DIR}/native-first.log" 2>&1 &
          GAME_PID=$!
          for attempt in $(seq 1 120); do
            WINDOW_ID="$(xdotool search --onlyvisible --name "Pixel Nations" 2>/dev/null | head -1 || true)"
            [ -n "$WINDOW_ID" ] && break
            sleep 0.25
          done
          test -n "${WINDOW_ID:-}"
          xdotool key --window "$WINDOW_ID" Return
          sleep 0.7
          xdotool key --window "$WINDOW_ID" Right
          sleep 0.7
          xdotool key --window "$WINDOW_ID" Return
          sleep 0.7
          xdotool key --window "$WINDOW_ID" Right
          sleep 0.7
          xdotool key --window "$WINDOW_ID" Return
          sleep 0.7
          xdotool key --window "$WINDOW_ID" Return
          sleep 0.7
          xdotool key --window "$WINDOW_ID" Left
          sleep 1.2
          import -window root "../../../${EVIDENCE_DIR}/stills/native-developed-map-before-restart-1440x900.png"
          xdotool key --window "$WINDOW_ID" Return
          sleep 1.2
          import -window root "../../../${EVIDENCE_DIR}/stills/native-connected-map-before-dispatch-1440x900.png"
          xdotool key --window "$WINDOW_ID" Right
          sleep 0.7
          xdotool key --window "$WINDOW_ID" Return
          sleep 0.7
          xdotool key --window "$WINDOW_ID" Left
          sleep 1.2
          import -window root "../../../${EVIDENCE_DIR}/stills/native-route-in-use-before-restart-1440x900.png"
          xdotool key --window "$WINDOW_ID" Right
          sleep 0.7
          xdotool key --window "$WINDOW_ID" Return
          sleep 1.2
          import -window root "../../../${EVIDENCE_DIR}/stills/native-city-chartered-before-restart-1440x900.png"
          xdotool key --window "$WINDOW_ID" Left
          sleep 1.2
          import -window root "../../../${EVIDENCE_DIR}/stills/native-city-map-before-restart-1440x900.png"
          xdotool key --window "$WINDOW_ID" Left
          sleep 0.7
          xdotool key --window "$WINDOW_ID" Return
          sleep 1.2
          import -window root "../../../${EVIDENCE_DIR}/stills/native-nation-world-before-restart-1440x900.png"
          xdotool key --window "$WINDOW_ID" Down
          sleep 0.5
          xdotool key --window "$WINDOW_ID" Down
          sleep 0.5
          xdotool key --window "$WINDOW_ID" Up
          sleep 0.5
          xdotool key --window "$WINDOW_ID" Return
          sleep 1.2
          import -window root "../../../${EVIDENCE_DIR}/stills/native-direction-expand-committed-1440x900.png"
          xdotool key --window "$WINDOW_ID" Right
          sleep 1.2
          import -window root "../../../${EVIDENCE_DIR}/stills/native-homeland-map-before-mandate-1440x900.png"
          xdotool key --window "$WINDOW_ID" Right
          sleep 0.7
          xdotool key --window "$WINDOW_ID" Return
          sleep 1.0
          import -window root "../../../${EVIDENCE_DIR}/stills/native-mandate-village-started-before-restart-1440x900.png"
          xdotool key --window "$WINDOW_ID" Left
          sleep 1.2
          import -window root "../../../${EVIDENCE_DIR}/stills/native-mandate-map-active-before-restart-1440x900.png"
          xdotool key --window "$WINDOW_ID" Right
          sleep 1.2
          import -window root "../../../${EVIDENCE_DIR}/stills/native-village-before-empire-proclamation-1440x900.png"
          xdotool key --window "$WINDOW_ID" Return
          sleep 1.2
          import -window root "../../../${EVIDENCE_DIR}/stills/native-village-aurelian-imperial-capital-1440x900.png"
          xdotool key --window "$WINDOW_ID" Left
          sleep 1.2
          import -window root "../../../${EVIDENCE_DIR}/stills/native-map-aurelian-imperial-heartland-before-restart-1440x900.png"
          xdotool key --window "$WINDOW_ID" Left
          sleep 0.7
          xdotool key --window "$WINDOW_ID" Return
          sleep 1.0
          import -window root "../../../${EVIDENCE_DIR}/stills/native-world-river-surge-crisis-1440x900.png"
          xdotool key --window "$WINDOW_ID" Right
          sleep 1.0
          import -window root "../../../${EVIDENCE_DIR}/stills/native-map-river-surge-response-loci-1440x900.png"
          xdotool key --window "$WINDOW_ID" Right
          sleep 0.7
          xdotool key --window "$WINDOW_ID" Down
          sleep 0.7
          xdotool key --window "$WINDOW_ID" Return
          sleep 1.0
          import -window root "../../../${EVIDENCE_DIR}/stills/native-village-east-bridge-response-1440x900.png"
          xdotool key --window "$WINDOW_ID" Left
          sleep 1.0
          import -window root "../../../${EVIDENCE_DIR}/stills/native-map-east-bridge-response-before-rival-1440x900.png"
          xdotool key --window "$WINDOW_ID" Left
          sleep 0.7
          xdotool key --window "$WINDOW_ID" Return
          sleep 1.0
          import -window root "../../../${EVIDENCE_DIR}/stills/native-world-first-rival-countermove-1440x900.png"
          xdotool key --window "$WINDOW_ID" Right
          sleep 1.0
          import -window root "../../../${EVIDENCE_DIR}/stills/native-map-first-rival-greenvale-pressure-1440x900.png"
          xdotool key --window "$WINDOW_ID" Right
          sleep 0.7
          xdotool key --window "$WINDOW_ID" Down
          sleep 0.5
          xdotool key --window "$WINDOW_ID" Return
          sleep 1.0
          import -window root "../../../${EVIDENCE_DIR}/stills/native-village-first-rival-negotiate-passage-1440x900.png"
          xdotool key --window "$WINDOW_ID" Left
          sleep 1.0
          import -window root "../../../${EVIDENCE_DIR}/stills/native-map-first-rival-negotiate-passage-before-payoff-1440x900.png"
          xdotool key --window "$WINDOW_ID" Left
          sleep 0.7
          xdotool key --window "$WINDOW_ID" Return
          sleep 1.0
          import -window root "../../../${EVIDENCE_DIR}/stills/native-world-frontier-payoff-east-bridge-revealed-1440x900.png"
          xdotool key --window "$WINDOW_ID" Right
          sleep 1.0
          import -window root "../../../${EVIDENCE_DIR}/stills/native-map-frontier-payoff-east-bridge-pending-1440x900.png"
          xdotool key --window "$WINDOW_ID" Right
          sleep 1.0
          import -window root "../../../${EVIDENCE_DIR}/stills/native-village-frontier-payoff-east-bridge-pending-1440x900.png"
          xdotool key --window "$WINDOW_ID" Return
          sleep 1.0
          import -window root "../../../${EVIDENCE_DIR}/stills/native-village-frontier-payoff-east-bridge-secured-1440x900.png"
          xdotool key --window "$WINDOW_ID" Left
          sleep 1.0
          import -window root "../../../${EVIDENCE_DIR}/stills/native-map-frontier-payoff-east-bridge-secured-before-restart-1440x900.png"
          xdotool key --window "$WINDOW_ID" Left
          sleep 0.7
          xdotool key --window "$WINDOW_ID" Return
          sleep 1.0
          import -window root "../../../${EVIDENCE_DIR}/stills/native-world-imperial-expansion-north-ridge-direction-1440x900.png"
          xdotool key --window "$WINDOW_ID" Right
          sleep 1.0
          import -window root "../../../${EVIDENCE_DIR}/stills/native-map-imperial-expansion-north-ridge-available-1440x900.png"
          xdotool key --window "$WINDOW_ID" Return
          sleep 1.0
          import -window root "../../../${EVIDENCE_DIR}/stills/native-map-imperial-expansion-north-ridge-inspected-1440x900.png"
          xdotool key --window "$WINDOW_ID" Return
          sleep 1.0
          import -window root "../../../${EVIDENCE_DIR}/stills/native-map-imperial-expansion-two-lands-before-restart-1440x900.png"
          xdotool key --window "$WINDOW_ID" Right
          sleep 0.7
          xdotool key --window "$WINDOW_ID" Left
          sleep 0.7
          xdotool key --window "$WINDOW_ID" Left
          sleep 1.0
          import -window root "../../../${EVIDENCE_DIR}/stills/native-world-imperial-expansion-two-land-footprint-before-outpost-1440x900.png"
          xdotool key --window "$WINDOW_ID" Return
          sleep 1.0
          import -window root "../../../${EVIDENCE_DIR}/stills/native-world-north-ridge-outpost-frontier-need-1440x900.png"
          xdotool key --window "$WINDOW_ID" Right
          sleep 1.0
          import -window root "../../../${EVIDENCE_DIR}/stills/native-map-north-ridge-outpost-claimed-inspection-1440x900.png"
          xdotool key --window "$WINDOW_ID" Right
          sleep 1.0
          import -window root "../../../${EVIDENCE_DIR}/stills/native-village-north-ridge-outpost-establish-action-1440x900.png"
          xdotool key --window "$WINDOW_ID" Return
          sleep 1.0
          import -window root "../../../${EVIDENCE_DIR}/stills/native-map-north-ridge-outpost-established-before-restart-1440x900.png"
          xdotool key --window "$WINDOW_ID" Left
          sleep 0.7
          xdotool key --window "$WINDOW_ID" Return
          sleep 1.0
          import -window root "../../../${EVIDENCE_DIR}/stills/native-world-north-ridge-specialization-held-frontier-1440x900.png"
          xdotool key --window "$WINDOW_ID" Right
          sleep 1.0
          import -window root "../../../${EVIDENCE_DIR}/stills/native-map-north-ridge-specialization-inspection-1440x900.png"
          xdotool key --window "$WINDOW_ID" Right
          sleep 0.7
          xdotool key --window "$WINDOW_ID" Down
          sleep 1.0
