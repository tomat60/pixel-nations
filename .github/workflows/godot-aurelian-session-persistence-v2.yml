            await page.keyboard.press('ArrowLeft');
            await waitFor(() => states.filter(x => x === 'world_north_ridge_logistics_line_active_frontier_role').length >= 1,'Ridge Logistics Line role after profile reopen');
            await sleep(1500);
            await page.screenshot({path:path.join(stills,'web-world-north-ridge-logistics-line-role-after-profile-reopen-1440x900.png')});
            await context.close();

            const browser = await chromium.launch({headless:true,args:['--use-gl=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
            const denied = await browser.newContext({viewport:{width:1440,height:900}});
            await denied.addInitScript(() => {
              Object.defineProperty(window,'localStorage',{configurable:true,get(){throw new DOMException('denied','SecurityError');}});
            });
            const deniedPage = await denied.newPage();
            attach(deniedPage);
            await deniedPage.goto('http://127.0.0.1:8060/index.html',{waitUntil:'domcontentloaded',timeout:90000});
            await deniedPage.locator('canvas').waitFor({state:'visible',timeout:90000});
            await waitFor(() => loads.some(x => x.status === 'unavailable' && x.adapter === 'web_local_storage' && x.state === 'world_neutral'),'denied fallback');
            await denied.close();
            await browser.close();

            fs.writeFileSync(path.join(root,'result-manifest.json'),JSON.stringify({
              contract:'GODOT_AURELIAN_SESSION_PERSISTENCE_V2',
              exact_head:fs.readFileSync(path.join(root,'exact-head.txt'),'utf8').trim(),
              schema:'pixel_nations.aurelian_session',
              schema_version:2,
              native_adapter:'native_file_access',
              web_adapter:'web_local_storage',
              web_key:'pixel_nations.aurelian_session.v2',
              capability_result:'available',
              save_acknowledgement:'stored',
              before_reload_state:'map_north_ridge_logistics_line_open',
              reloaded_state:'map_north_ridge_logistics_line_open',
              profile_reopen_state:'map_north_ridge_logistics_line_open',
              settlement_founded:true,
              settlement_developed:true,
              route_connected:true,
              caravan_dispatched:true,
              city_chartered:true,
              nation_founded:true,
              national_direction:'expand',
              national_mandate_started:true,
              empire_proclaimed:true,
              imperial_crisis:'river_surge',
              imperial_crisis_response:'shield_greenvale',
              first_rival_countermove:'obsidian_march',
              first_rival_countermove_response:'stand_firm',
              first_frontier_payoff:'secure_gilded_crossing',
              selected_intent:'east_trade',
              imperial_expansion_target:'north_ridge',
              claimed_lands:['east_route','north_ridge'],
              first_imperial_expansion:'north_ridge_claimed',
              imperial_expansion_event_count:1,
              north_ridge_outpost:'established',
              north_ridge_outpost_event_count:1,
              native_north_ridge_specialization:'watch_post',
              web_north_ridge_specialization:'trade_post',
              north_ridge_specialization_event_count:1,
              native_north_ridge_specialization_payoff:'ridge_signal_lit',
              web_north_ridge_specialization_payoff:'ridge_logistics_line_open',
              north_ridge_specialization_payoff_event_count:1,
              continued_state:'world_north_ridge_logistics_line_active_frontier_role',
              denied_storage_fallback:'world_neutral',
              input_actions:['Enter','ArrowRight','Enter','ArrowRight','Enter','Enter','ArrowLeft','Enter','ArrowRight','Enter','ArrowLeft','ArrowRight','Enter','ArrowLeft','ArrowLeft','Enter','ArrowDown','ArrowDown','ArrowUp','Enter','ArrowRight','ArrowRight','Enter','ArrowLeft','ArrowRight','Enter','ArrowLeft','ArrowLeft','Enter','ArrowRight','ArrowRight','Enter','ArrowLeft','ArrowLeft','Enter','ArrowRight','ArrowRight','Enter','ArrowLeft','ArrowLeft','Enter','ArrowRight','Enter','Enter','ArrowRight','ArrowLeft','ArrowLeft','Enter','ArrowRight','ArrowRight','Enter','ArrowLeft','Enter','ArrowRight','ArrowRight','Enter','ArrowLeft','Enter','ArrowRight','ArrowRight','Enter','reload','browser_reopen','ArrowRight','ArrowLeft','ArrowLeft'],
              evidence_storage_seeding:false,
              glb_sha256:process.env.GLB_SHA256
            },null,2)+'\n');
            writeArtifacts();
            if (requestFailures.length || responseFailures.length) throw new Error('Browser request failure');
            if (consoleLines.some(x => /SCRIPT ERROR|Parse Error|pageerror|WebGL not supported/i.test(x))) throw new Error('Blocking browser runtime error');
          })().catch(error => {
            writeArtifacts();
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Validate exact evidence
        run: |
          set -euo pipefail
          test "$(find "${EVIDENCE_DIR}/stills" -name '*.png' | wc -l)" = "95"
          for image in "${EVIDENCE_DIR}"/stills/*.png; do
            test "$(identify -format '%wx%h' "$image")" = "1440x900"
            test "$(stat -c %s "$image")" -gt 70000
          done
          duration="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "${EVIDENCE_DIR}/session-persistence-v2-sequence.webm")"
          awk -v duration="$duration" 'BEGIN { exit !(duration >= 110 && duration <= 240) }'
          grep -F "AURELIAN_SESSION_V2_LOAD=restored:web_local_storage:map_north_ridge_logistics_line_open:east_trade" "${EVIDENCE_DIR}/browser-console.log"
          grep -F "AURELIAN_SESSION_V2_SAVE_ACK=stored:web_local_storage:map_north_ridge_logistics_line_open:east_trade" "${EVIDENCE_DIR}/browser-console.log"
