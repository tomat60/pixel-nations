      - name: Prove acknowledged developed-settlement Web reload and profile reopen
        timeout-minutes: 7
        run: |
          set -euo pipefail
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');
          const root = path.resolve(process.env.EVIDENCE_DIR);
          const stills = path.join(root, 'stills');
          const profile = path.join(process.env.RUNNER_TEMP, 'aurelian-web-v2-profile');
          const consoleLines = [];
          const requestFailures = [];
          const responseFailures = [];
          const states = [];
          const loads = [];
          const saveAcks = [];
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

          function attach(page) {
            page.on('console', msg => {
              const line = '[' + msg.type() + '] ' + msg.text();
              consoleLines.push(line);
              let match = msg.text().match(/PLAYABLE_AURELIAN_ENTRY_STATE=([a-z_]+)/);
              if (match) states.push(match[1]);
              match = msg.text().match(/AURELIAN_SESSION_V2_LOAD=([a-z_]+):([a-z_]+):([a-z_]+):([a-z_]+)/);
              if (match) loads.push({status:match[1],adapter:match[2],state:match[3],intent:match[4]});
              match = msg.text().match(/AURELIAN_SESSION_V2_SAVE_ACK=([a-z_]+):([a-z_]+):([a-z_]+):([a-z_]+)/);
              if (match) saveAcks.push({status:match[1],adapter:match[2],state:match[3],intent:match[4]});
            });
            page.on('pageerror', e => consoleLines.push('[pageerror] ' + (e.stack || e.message)));
            page.on('requestfailed', r => requestFailures.push({url:r.url(),error:r.failure()?.errorText||'unknown'}));
            page.on('response', r => { if (r.status() >= 400) responseFailures.push({url:r.url(),status:r.status()}); });
          }
          async function waitFor(predicate, label, timeout = 90000) {
            const start = Date.now();
            while (Date.now() - start < timeout) {
              if (predicate()) return;
              await sleep(100);
            }
            throw new Error('Timed out for ' + label + ': states=' + states.join(',') + ' loads=' + JSON.stringify(loads) + ' acks=' + JSON.stringify(saveAcks));
          }
          async function openPage(context) {
            const page = context.pages()[0] || await context.newPage();
            attach(page);
            await page.goto('http://127.0.0.1:8060/index.html',{waitUntil:'domcontentloaded',timeout:90000});
            await page.locator('canvas').waitFor({state:'visible',timeout:90000});
            await page.locator('canvas').click();
            return page;
          }
          function writeArtifacts() {
            fs.writeFileSync(path.join(root,'browser-console.log'),consoleLines.join('\n')+'\n');
            fs.writeFileSync(path.join(root,'browser-requests.json'),JSON.stringify({request_failures:requestFailures,response_failures:responseFailures},null,2)+'\n');
          }

          (async () => {
            let context = await chromium.launchPersistentContext(profile,{
              headless:true,
              viewport:{width:1440,height:900},
              recordVideo:{dir:path.join(root,'video-tmp'),size:{width:1440,height:900}},
              args:['--use-gl=swiftshader','--enable-webgl','--ignore-gpu-blocklist']
            });
            let page = await openPage(context);
            await waitFor(() => states.filter(x => x === 'world_neutral').length >= 1,'initial world');
            await waitFor(() => saveAcks.some(x => x.status === 'stored' && x.adapter === 'web_local_storage' && x.state === 'world_neutral'),'initial save ack');
            await sleep(1500);
            await page.screenshot({path:path.join(stills,'web-world-neutral-1440x900.png')});
            await page.keyboard.press('Enter');
            await waitFor(() => states.includes('world_trade_selected'),'trade state');
            await waitFor(() => saveAcks.some(x => x.status === 'stored' && x.state === 'world_trade_selected'),'trade save ack');
            await sleep(1000);
            await page.keyboard.press('ArrowRight');
            await waitFor(() => states.includes('map_east_route_selected'),'selected map state');
            await waitFor(() => saveAcks.some(x => x.status === 'stored' && x.state === 'map_east_route_selected'),'selected map save ack');
            await sleep(1000);
            await page.keyboard.press('Enter');
            await waitFor(() => states.includes('map_east_route_claimed'),'claimed map state');
            await waitFor(() => saveAcks.some(x => x.status === 'stored' && x.state === 'map_east_route_claimed'),'claimed map save ack');
            await page.keyboard.press('ArrowRight');
            await waitFor(() => states.includes('village_claimed'),'claimed village');
            await page.keyboard.press('Enter');
            await waitFor(() => states.includes('village_founded'),'founded village');
            await page.keyboard.press('Enter');
            await waitFor(() => states.includes('village_developed'),'developed village');
            await waitFor(() => saveAcks.some(x => x.status === 'stored' && x.state === 'village_developed'),'developed save ack');
            await sleep(1500);
