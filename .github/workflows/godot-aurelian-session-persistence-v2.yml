            await page.reload({waitUntil:'domcontentloaded',timeout:90000});
            await page.locator('canvas').waitFor({state:'visible',timeout:90000});
            await waitFor(() => loads.some(x => x.status === 'restored' && x.adapter === 'web_local_storage' && x.state === 'map_north_ridge_logistics_line_open' && x.intent === 'east_trade'),'Ridge Logistics Line reload restore');
            await waitFor(() => states.filter(x => x === 'map_north_ridge_logistics_line_open').length >= 2,'reloaded Ridge Logistics Line map');
            await sleep(2500);
            await page.screenshot({path:path.join(stills,'web-map-north-ridge-logistics-line-open-restored-1440x900.png')});
            const video = page.video();
            await context.close();
            const recordedPath = await video.path();
            fs.copyFileSync(recordedPath,path.join(root,'session-persistence-v2-sequence.webm'));

            await sleep(500);
            context = await chromium.launchPersistentContext(profile,{
              headless:true,
              viewport:{width:1440,height:900},
              args:['--use-gl=swiftshader','--enable-webgl','--ignore-gpu-blocklist']
            });
            page = await openPage(context);
            await waitFor(() => loads.filter(x => x.status === 'restored' && x.state === 'map_north_ridge_logistics_line_open').length >= 2,'Ridge Logistics Line profile reopen restore');
            await waitFor(() => states.filter(x => x === 'map_north_ridge_logistics_line_open').length >= 3,'profile reopened Ridge Logistics Line map');
