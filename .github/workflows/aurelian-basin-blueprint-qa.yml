name: Aurelian Basin Blueprint QA

on:
  pull_request:
    branches: [main]
    paths:
      - docs/art-direction/aurelian-basin-blueprint.md
      - docs/art-direction/aurelian-basin-blueprint.json
      - docs/art-direction/aurelian-basin-desktop.svg
      - docs/art-direction/aurelian-basin-portrait.svg
      - .github/workflows/aurelian-basin-blueprint-qa.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate blueprint contract
        run: |
          set -euo pipefail
          rm -rf blueprint-evidence
          mkdir -p blueprint-evidence
          python3 - <<'PY'
          import json, pathlib, xml.etree.ElementTree as ET
          root = pathlib.Path('docs/art-direction')
          required = [
            root/'aurelian-basin-blueprint.md',
            root/'aurelian-basin-blueprint.json',
            root/'aurelian-basin-desktop.svg',
            root/'aurelian-basin-portrait.svg',
          ]
          for p in required:
            if not p.is_file() or p.stat().st_size < 200:
              raise SystemExit(f'Missing or tiny deliverable: {p}')
          data = json.loads((root/'aurelian-basin-blueprint.json').read_text())
          assert data['source']['kaykit_commit'] == '84fa4e91af6a88989be7c99e0891cede11f2ca38'
          assert data['source']['uniform_scale'] == 11.71437541
          assert data['rules']['max_primary_silhouette_overlap'] <= 0.30
          assert data['rules']['terrain_continues_beyond_frame'] is True
          assert data['desktop']['output'] == [1440, 900]
          assert data['portrait']['output'] == [390, 844]
          assert data['desktop']['camera']['position'] == [39, 34, 45]
          assert data['portrait']['camera']['position'] != [50, 38, 0]
          for mode in ('desktop','portrait'):
            for name, rect in data[mode]['regions'].items():
              if len(rect) != 4 or any(not 0 <= float(v) <= 1 for v in rect):
                raise SystemExit(f'Invalid normalized region {mode}.{name}: {rect}')
          dims = {
            'aurelian-basin-desktop.svg': ('1440','900','0 0 1440 900'),
            'aurelian-basin-portrait.svg': ('390','844','0 0 390 844'),
          }
          for name, expected in dims.items():
            svg = ET.parse(root/name).getroot()
            actual = (svg.attrib.get('width'), svg.attrib.get('height'), svg.attrib.get('viewBox'))
            if actual != expected:
              raise SystemExit(f'Wrong SVG contract {name}: {actual}')
          print('BLUEPRINT_VALIDATION_OK')
          PY
          git rev-parse HEAD > blueprint-evidence/input-sha.txt
          cp docs/art-direction/aurelian-basin-* blueprint-evidence/
          find blueprint-evidence -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > blueprint-evidence/SHA256SUMS.txt
          test "$(wc -l < blueprint-evidence/SHA256SUMS.txt)" -eq 5
      - name: Upload blueprint evidence
        uses: actions/upload-artifact@v4
        with:
          name: aurelian-basin-blueprint-${{ github.run_id }}
          path: blueprint-evidence/**
          retention-days: 30
      - name: Report blueprint QA
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:306,body:`## Aurelian Basin blueprint QA ${context.runId}\n\n- Event SHA: \`${context.sha}\`\n- Job status: \`${{ job.status }}\`\n- Artifact: \`aurelian-basin-blueprint-${context.runId}\`\n- Scope: Markdown, JSON, desktop SVG, portrait SVG and deterministic hashes only.\n\nNo engine scene, gameplay, main write, merge, deployment or paid tool was used.`})
