name: Godot KayKit Calibration Cluster

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/godot-kaykit-calibration-cluster.yml
      - game/scenes/calibration/kaykit_cluster.gd
      - game/scenes/calibration/kaykit_cluster.tscn
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  GODOT_RELEASE: 4.7.1-stable
  KAYKIT_SHA: 84fa4e91af6a88989be7c99e0891cede11f2ca38
  EXPECTED_ARCHIVE_SHA: cfa7faff403c93fb90e8eeb448c78e6192782802a532bebed0bdb853b39f7028

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout calibration branch
        uses: actions/checkout@v4
        with:
          ref: calibration/godot-kaykit-test-cluster
          fetch-depth: 0

      - name: Install Godot and capture dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends unzip xvfb libgl1 libegl1 libx11-6 libxcursor1 libxinerama1 libxi6 libxrandr2 python3-pil >/dev/null
          mkdir -p /tmp/godot
          curl -fsSL --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" -o /tmp/godot/godot.zip
          unzip -q /tmp/godot/godot.zip -d /tmp/godot
          GODOT="/tmp/godot/Godot_v${GODOT_RELEASE}_linux.x86_64"
          chmod +x "$GODOT"
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"
          "$GODOT" --version
          ldconfig -p | grep -E 'libEGL.so.1|libGL.so.1'

      - name: Fetch and verify exact KayKit subset
        run: |
          set -euo pipefail
          rm -rf /tmp/kaykit game/art_target/kaykit_cluster evidence/godot-kaykit-cluster
          mkdir -p /tmp/kaykit/src game/art_target/kaykit_cluster evidence/godot-kaykit-cluster
          curl -fsSL --retry 3 "https://github.com/KayKit-Game-Assets/KayKit-Medieval-Hexagon-Pack-1.0/archive/${KAYKIT_SHA}.zip" -o /tmp/kaykit/source.zip
          ACTUAL_ARCHIVE_SHA="$(sha256sum /tmp/kaykit/source.zip | cut -d' ' -f1)"
          test "$ACTUAL_ARCHIVE_SHA" = "$EXPECTED_ARCHIVE_SHA"
          printf '%s  %s\n' "$ACTUAL_ARCHIVE_SHA" source.zip > evidence/godot-kaykit-cluster/source-archive.sha256
          unzip -q /tmp/kaykit/source.zip -d /tmp/kaykit/src
          ROOT="$(find /tmp/kaykit/src -mindepth 1 -maxdepth 1 -type d | head -1)"
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/KayKit-Game-Assets/KayKit-Medieval-Hexagon-Pack-1.0/${KAYKIT_SHA}/LICENSE.txt" -o game/art_target/kaykit_cluster/LICENSE.txt
          grep -F "Creative Commons Zero" game/art_target/kaykit_cluster/LICENSE.txt
          python3 - "$ROOT" game/art_target/kaykit_cluster <<'PY'
          import hashlib, json, shutil, sys
          from pathlib import Path
          src, dest = Path(sys.argv[1]), Path(sys.argv[2])
          expected = {
              'building_home_A_red':'158bcb4149f4d6db461774d7bd67d264262f30145762eddd0a8def8be292286c',
              'building_blacksmith_red':'5689a8f37fa59a956927b4deaeb6d8ee48228fe29c2c61b71048bec04a7b086f',
              'building_church_red':'e4dc40472c3c0039c0dde205630ebb3a4e51da2ddf55109a3c2f9a8ba91ad2c3',
          }
          manifest = {'source_commit':'84fa4e91af6a88989be7c99e0891cede11f2ca38','license':'CC0-1.0','models':{}}
          copied = set()
          for stem, expected_sha in expected.items():
              hits = list(src.rglob(stem + '.gltf'))
              if len(hits) != 1:
                  raise SystemExit(f'Expected one {stem}, found {len(hits)}')
              model = hits[0]
              model_sha = hashlib.sha256(model.read_bytes()).hexdigest()
              if model_sha != expected_sha:
                  raise SystemExit(f'Hash mismatch for {stem}: {model_sha}')
              data = json.loads(model.read_text())
              target = dest / model.name
              shutil.copy2(model, target); copied.add(target.name)
              deps = []
              for item in data.get('buffers', []) + data.get('images', []):
                  uri = item.get('uri', '')
                  if not uri or uri.startswith('data:'):
                      continue
                  dep = (model.parent / uri).resolve()
                  if not dep.exists():
                      raise SystemExit(f'Missing dependency {uri} for {model}')
                  dep_target = dest / dep.name
                  if dep_target.name not in copied:
                      shutil.copy2(dep, dep_target); copied.add(dep_target.name)
                  deps.append(dep_target.name)
              manifest['models'][stem] = {
                  'source_path': str(model.relative_to(src)),
                  'resource_path': 'res://art_target/kaykit_cluster/' + model.name,
                  'sha256': model_sha,
                  'dependencies': deps,
              }
          (dest/'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY
          sha256sum game/art_target/kaykit_cluster/* | sort > evidence/godot-kaykit-cluster/SOURCE_SHA256SUMS.txt
          cp game/art_target/kaykit_cluster/manifest.json evidence/godot-kaykit-cluster/source-manifest.json
          git rev-parse HEAD > evidence/godot-kaykit-cluster/input-sha.txt

      - name: Import exact Godot project
        run: |
          set -euo pipefail
          "$GODOT" --headless --path game --editor --quit 2>&1 | tee evidence/godot-kaykit-cluster/import.log
          ! grep -E "SCRIPT ERROR|Parse Error|Failed to load|Missing KayKit model|Grounding failed|No mesh found" evidence/godot-kaykit-cluster/import.log

      - name: Capture desktop and portrait contracts
        id: captures
        run: |
          set -uo pipefail
          export XDG_RUNTIME_DIR="/tmp/pixel-nations-xdg"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          set +e
          timeout 45s xvfb-run -a env CAPTURE_MODE=desktop CAPTURE_WIDTH=1440 CAPTURE_HEIGHT=900 CAPTURE_PATH="$PWD/evidence/godot-kaykit-cluster/desktop-1440x900.png" CONTRACT_PATH="$PWD/evidence/godot-kaykit-cluster/desktop-contract.json" "$GODOT" --path game res://scenes/calibration/kaykit_cluster.tscn 2>&1 | tee evidence/godot-kaykit-cluster/desktop.log
          desktop_status=${PIPESTATUS[0]}
          timeout 45s xvfb-run -a env CAPTURE_MODE=portrait CAPTURE_WIDTH=390 CAPTURE_HEIGHT=844 CAPTURE_PATH="$PWD/evidence/godot-kaykit-cluster/portrait-390x844.png" CONTRACT_PATH="$PWD/evidence/godot-kaykit-cluster/portrait-contract.json" "$GODOT" --path game res://scenes/calibration/kaykit_cluster.tscn 2>&1 | tee evidence/godot-kaykit-cluster/portrait.log
          portrait_status=${PIPESTATUS[0]}
          printf '%s\n' "$desktop_status" > evidence/godot-kaykit-cluster/desktop-exit-status.txt
          printf '%s\n' "$portrait_status" > evidence/godot-kaykit-cluster/portrait-exit-status.txt
          {
            echo '## Desktop log tail'
            echo '```'
            tail -n 80 evidence/godot-kaykit-cluster/desktop.log
            echo '```'
            echo '## Portrait log tail'
            echo '```'
            tail -n 80 evidence/godot-kaykit-cluster/portrait.log
            echo '```'
          } > evidence/godot-kaykit-cluster/capture-diagnostics.md
          cat evidence/godot-kaykit-cluster/capture-diagnostics.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$desktop_status" -ne 0 ] || [ "$portrait_status" -ne 0 ]; then
            echo "Capture process failed: desktop=$desktop_status portrait=$portrait_status" >&2
            exit 1
          fi
          set -e
          ! grep -E "SCRIPT ERROR|Parse Error|Failed to load|Missing KayKit model|Grounding failed|No mesh found|Screenshot save failed|Contract file open failed" evidence/godot-kaykit-cluster/desktop.log evidence/godot-kaykit-cluster/portrait.log
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          from PIL import Image, ImageStat
          root = Path('evidence/godot-kaykit-cluster')
          expected = {'desktop-1440x900.png':(1440,900), 'portrait-390x844.png':(390,844)}
          qa = {}
          for name, dims in expected.items():
              path = root/name
              if not path.exists() or path.stat().st_size < 10000:
                  raise SystemExit(f'Missing or tiny PNG: {name}')
              image = Image.open(path).convert('RGB')
              if image.size != dims:
                  raise SystemExit(f'Wrong dimensions {name}: {image.size}')
              stat = ImageStat.Stat(image)
              luminance = sum(stat.mean)/3.0
              variance = sum(stat.var)/3.0
              pixels = list(image.getdata())
              near_white = sum(1 for r,g,b in pixels if r > 245 and g > 245 and b > 245) / len(pixels)
              if variance < 25.0 or luminance < 20.0 or luminance > 220.0 or near_white > 0.08:
                  raise SystemExit(f'Image QA failed {name}: luminance={luminance:.2f} variance={variance:.2f} near_white={near_white:.4f}')
              qa[name] = {'width':dims[0],'height':dims[1],'bytes':path.stat().st_size,'sha256':hashlib.sha256(path.read_bytes()).hexdigest(),'mean_luminance':round(luminance,3),'variance':round(variance,3),'near_white_fraction':round(near_white,6)}
          desktop = json.loads((root/'desktop-contract.json').read_text())
          portrait = json.loads((root/'portrait-contract.json').read_text())
          input_sha = (root/'input-sha.txt').read_text().strip()
          if sorted(desktop['roles']) != ['blacksmith','church','home'] or sorted(portrait['roles']) != ['blacksmith','church','home']:
              raise SystemExit('Role contract incomplete')
          for mode, contract in [('desktop',desktop),('portrait',portrait)]:
              for role, data in contract['roles'].items():
                  if abs(data['world_aabb_position'][1]) > 0.03:
                      raise SystemExit(f'Grounding contract failed {mode}/{role}: {data}')
          final = {'classification':'PENDING_HUMAN_REVIEW','input_sha':input_sha,'output_sha':input_sha,'source_commit':'84fa4e91af6a88989be7c99e0891cede11f2ca38','source_archive_sha256':'cfa7faff403c93fb90e8eeb448c78e6192782802a532bebed0bdb853b39f7028','desktop':desktop,'portrait':portrait,'image_qa':qa}
          (root/'final-contract.json').write_text(json.dumps(final,indent=2)+'\n')
          PY
          find game/art_target/kaykit_cluster -type f -printf '%s\n' | awk '{s+=$1} END{print s+0}' > evidence/godot-kaykit-cluster/asset-bytes.txt
          find evidence/godot-kaykit-cluster -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > evidence/godot-kaykit-cluster/SHA256SUMS.txt

      - name: Upload exact cluster evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-kaykit-cluster-${{ github.run_id }}
          path: evidence/godot-kaykit-cluster/**
          if-no-files-found: warn
          retention-days: 30

      - name: Report cluster run
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            let diagnostics = 'No capture diagnostics file was produced.'
            try {
              diagnostics = fs.readFileSync('evidence/godot-kaykit-cluster/capture-diagnostics.md', 'utf8').slice(-12000)
            } catch (_) {}
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:304,body:`## Godot KayKit calibration cluster run ${context.runId}\n\n- Event SHA: \`${context.sha}\`\n- Job status: \`${{ job.status }}\`\n- Artifact: \`godot-kaykit-cluster-${context.runId}\`\n- Expected evidence: exact source manifest, desktop 1440x900, portrait 390x844, import/runtime logs, image QA and final contract.\n\n<details><summary>Capture diagnostics</summary>\n\n${diagnostics}\n\n</details>\n\nNo full frame, gameplay, second asset family, main write, merge, deployment or paid tool was used.`})