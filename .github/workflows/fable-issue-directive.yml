name: Fable Issue Directive

on:
  issues:
    types: [opened, edited]
  pull_request:
    paths:
      - '.github/workflows/fable-issue-directive.yml'
      - 'scripts/fable-issue-directive.mjs'
      - 'scripts/validate-fable-evidence-ref.mjs'

permissions:
  contents: read
  actions: read
  issues: write

defaults:
  run:
    shell: bash

concurrency:
  group: fable-issue-directive-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  evidence-ref-self-test:
    name: Immutable evidence ref self-test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate immutable evidence-ref parser
        run: node scripts/validate-fable-evidence-ref.mjs --self-test

      - name: Validate trusted-tooling separation contract
        run: |
          set -euo pipefail
          test -f scripts/fable-issue-directive.mjs
          test -f scripts/validate-fable-evidence-ref.mjs
          rm -rf evidence-repo
          mkdir -p evidence-repo
          git archive HEAD | tar -x -C evidence-repo
          test -f evidence-repo/README.md
          test "$(realpath evidence-repo)" != "$(realpath .)"
          echo "FABLE_EVIDENCE_WORKTREE_SEPARATION=PASS"

  fable-issue-directive:
    name: Fable Issue Directive
    if: >-
      github.event_name == 'issues' &&
      github.event.issue.user.login == 'tomat60' &&
      (startsWith(github.event.issue.title, 'FABLE DIRECTIVE:') || startsWith(github.event.issue.title, 'FABLE DIRECTIVE ['))
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Resolve immutable visual evidence ref
        id: evidence_ref
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            const matches = [...body.matchAll(/^Visual evidence ref:\s*(\S+)\s*$/gim)].map((match) => match[1]);
            if (matches.length > 1) {
              core.setFailed('Visual evidence ref must appear at most once.');
              return;
            }
            const value = matches[0] || '';
            if (value && !/^[0-9a-f]{40}$/i.test(value)) {
              core.setFailed('Visual evidence ref must be exactly one full 40-character hexadecimal commit SHA.');
              return;
            }
            core.setOutput('requested', value.toLowerCase());
            core.setOutput('checkout', value || context.payload.repository.default_branch);

      - name: Resolve optional Founder Run artifact evidence
        id: founder_evidence
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            const enabled = body.includes('FOUNDER_RUN_EVIDENCE_STAGING: v1');
            const matches = [...body.matchAll(/^Founder Run evidence run:\s*(\d+)\s*$/gim)].map((match) => match[1]);
            if (matches.length > 1) {
              core.setFailed('Founder Run evidence run must appear at most once.');
              return;
            }
            if (enabled && matches.length !== 1) {
              core.setFailed('FOUNDER_RUN_EVIDENCE_STAGING: v1 requires exactly one `Founder Run evidence run: <run-id>` line.');
              return;
            }
            core.setOutput('enabled', enabled ? 'true' : 'false');
            core.setOutput('run_id', matches[0] || '');

      - name: Comment directive started
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: `Fable directive started under the binding-output protocol.\n\nRun: ${runUrl}`,
            });

      - name: Checkout trusted workflow tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Checkout immutable evidence snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.evidence_ref.outputs.checkout }}
          path: evidence-repo
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify checked-out evidence identity
        run: |
          set -euo pipefail
          evidence_sha="$(git -C evidence-repo rev-parse HEAD)"
          node scripts/validate-fable-evidence-ref.mjs \
            --event "$GITHUB_EVENT_PATH" \
            --checked-out-sha "$evidence_sha"
          echo "FABLE_TRUSTED_TOOLING_SHA=$(git rev-parse HEAD)"
          echo "FABLE_EVIDENCE_SHA=$evidence_sha"

      - name: Stage approved Aurelian evidence inside the visual allowlist
        if: "${{ contains(github.event.issue.body, 'AURELIAN_EVIDENCE_STAGING: v1') }}"
        run: |
          set -euo pipefail
          source_dir="evidence-repo/review/aurelian-staged-progression-m1"
          target_dir="evidence-repo/docs/visual-evidence/aurelian-m2"
          test -f "$source_dir/contact-sheet-desktop.png"
          test -f "$source_dir/contact-sheet-portrait.png"
          mkdir -p "$target_dir"
          cp "$source_dir/contact-sheet-desktop.png" "$target_dir/contact-sheet-desktop.png"
          cp "$source_dir/contact-sheet-portrait.png" "$target_dir/contact-sheet-portrait.png"
          sha256sum "$target_dir/contact-sheet-desktop.png" "$target_dir/contact-sheet-portrait.png"
          echo "FABLE_AURELIAN_EVIDENCE_STAGING=PASS"

      - name: Stage exact Founder Run evidence inside the visual allowlist
        if: steps.founder_evidence.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.founder_evidence.outputs.run_id }}
          EXPECTED_SHA: ${{ steps.evidence_ref.outputs.requested }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_SHA"
          actual_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.head_sha')"
          test "$actual_sha" = "$EXPECTED_SHA"

          rm -rf /tmp/founder-run-evidence
          mkdir -p /tmp/founder-run-evidence
          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name pixel-nations-play-evidence \
            --dir /tmp/founder-run-evidence

          source_dir="/tmp/founder-run-evidence/founder-run"
          target_dir="evidence-repo/docs/visual-evidence/founder-run"
          test -s "$source_dir/desktop-founder-run.webm"
          test -s "$source_dir/mobile-founder-run.webm"
          test -s "$source_dir/desktop-founder-record.png"
          test -s "$source_dir/mobile-founder-record.png"
          mkdir -p "$target_dir"

          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg >/dev/null
          fi

          ffmpeg -y -loglevel error \
            -i "$source_dir/desktop-founder-run.webm" \
            -vf "fps=2,scale=360:-1,tile=5x2:padding=6:margin=6" \
            -frames:v 1 -c:v libwebp -quality 82 \
            "$target_dir/desktop-founder-run-contact.webp"
          ffmpeg -y -loglevel error \
            -i "$source_dir/mobile-founder-run.webm" \
            -vf "fps=2,scale=190:-1,tile=5x2:padding=6:margin=6" \
            -frames:v 1 -c:v libwebp -quality 84 \
            "$target_dir/mobile-founder-run-contact.webp"
          cp "$source_dir/desktop-founder-record.png" "$target_dir/desktop-founder-record.png"
          cp "$source_dir/mobile-founder-record.png" "$target_dir/mobile-founder-record.png"

          test -s "$target_dir/desktop-founder-run-contact.webp"
          test -s "$target_dir/mobile-founder-run-contact.webp"
          test -s "$target_dir/desktop-founder-record.png"
          test -s "$target_dir/mobile-founder-record.png"
          sha256sum "$target_dir"/*
          echo "FABLE_FOUNDER_RUN_EVIDENCE_STAGING=PASS"

      - name: Run validated Fable issue directive
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-fable-5
          MAX_INPUT_TOKENS: '70000'
          MAX_OUTPUT_TOKENS: '15000'
          MAX_ESTIMATED_COST_USD: '1.50'
          INPUT_PRICE_PER_MILLION_USD: '10'
          OUTPUT_PRICE_PER_MILLION_USD: '50'
          FABLE_PREFLIGHT_ONLY: 'false'
        run: |
          set -euo pipefail
          cd evidence-repo
          node ../scripts/fable-issue-directive.mjs

      - name: Upload directive artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fable-issue-directive-${{ github.event.issue.number }}
          path: |
            evidence-repo/fable-output/fable-issue-directive.md
            evidence-repo/fable-output/fable-issue-directive-meta.json
          if-no-files-found: warn
          retention-days: 14

      - name: Comment directive finished
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            let resultClass = 'NO_ARTIFACT';
            let failures = [];
            try {
              const meta = JSON.parse(fs.readFileSync('evidence-repo/fable-output/fable-issue-directive-meta.json', 'utf8'));
              resultClass = meta.resultClass || resultClass;
              failures = Array.isArray(meta.validationFailures) ? meta.validationFailures : [];
            } catch (error) {
              failures = [`Could not read result metadata: ${error.message}`];
            }
            const messages = {
              VALIDATED_FABLE_OUTPUT: 'Fable output passed the selected mode, evidence and compliance gates.',
              HOLD_NO_IMPLEMENTATION: 'Deterministic preflight returned HOLD_NO_IMPLEMENTATION. No model call or implementation authorization occurred.',
              DRY_RUN_VALIDATED: 'Preflight-only validation passed. No model call occurred.',
              MODEL_OUTPUT_REJECTED: 'The model responded, but the output was rejected by validation.',
              PREFLIGHT_FAILURE: 'Preflight failed before a valid model result. The artifact contains the exact error.',
              NO_ARTIFACT: 'No readable result metadata was produced; inspect job logs.',
            };
            const detail = failures.length ? `\n\nValidation details:\n${failures.map((item) => `- ${item}`).join('\n')}` : '';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: `Fable directive result: ${resultClass}.\n\n${messages[resultClass] || 'Inspect the artifact before relying on this run.'}${detail}\n\nRun and artifacts: ${runUrl}`,
            });
