name: World Atlas V1

on:
  pull_request:
    branches: [main]
    paths:
      - "game/assets/aurelian-basin/source/world_atlas_v1_spec.json"
      - "game/assets/aurelian-basin/source/world_atlas_v1.py"
      - "game/scenes/aurelian/world_atlas_v1.gd"
      - "game/scenes/aurelian/world_atlas_v1.tscn"
      - "game/tests/world_atlas_v1_test.gd"
      - ".github/workflows/world-atlas-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-atlas-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BLENDER_VERSION: "4.3.2"
  BLENDER_BIN: "/tmp/blender/blender-4.3.2-linux-x64/blender"
  GODOT_RELEASE: "4.7.1-stable"
  GODOT_BIN: "/tmp/godot/Godot_v4.7.1-stable_linux.x86_64"
  SECTOR_BUILD_DIR: "/tmp/pn-sector-v4-reference"
  ATLAS_BUILD_DIR: "/tmp/pn-world-atlas-v1"
  EVIDENCE_DIR: "evidence/world-atlas-v1"
  CANONICAL_GLB: "game/assets/aurelian-basin/export/aurelian_authored_terrain_v1.glb"
  TOPOLOGY_MANIFEST: "game/assets/aurelian-basin/export/transform-manifest.json"
  CITY_MANIFEST: "game/scenes/aurelian/production_village_v1_state_manifest.json"
  SECTOR_SPEC: "game/assets/aurelian-basin/source/sector_a01_generator_v4_spec.json"
  GENERATED_SECTOR_GLB: "game/assets/aurelian-basin/export/aurelian_sector_generator_v4.glb"
  GENERATED_SECTOR_MANIFEST: "game/assets/aurelian-basin/export/aurelian_sector_generator_v4_manifest.json"
  ATLAS_SPEC: "game/assets/aurelian-basin/source/world_atlas_v1_spec.json"
  GENERATED_ATLAS_GLB: "game/assets/aurelian-basin/export/world_atlas_v1.glb"
  GENERATED_ATLAS_MANIFEST: "game/assets/aurelian-basin/export/world_atlas_v1_manifest.json"

jobs:
  atlas-proof:
    name: Rebuild accepted Sector and capture World Atlas
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Record exact head and prove accepted inputs untouched
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_DIR}"
          git rev-parse HEAD | tee "${EVIDENCE_DIR}/exact-head.txt"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          fi
          test -s "${CANONICAL_GLB}"
          test -s "${TOPOLOGY_MANIFEST}"
          test -s "${CITY_MANIFEST}"
          test -s "${SECTOR_SPEC}"
          test -s "${ATLAS_SPEC}"
          git diff --exit-code origin/main...HEAD -- \
            game/assets/aurelian-basin/source/aurelian_sector_generator_v4.py \
            game/assets/aurelian-basin/source/sector_a01_generator_v4_spec.json \
            game/scenes/aurelian/world_scale_sector_generator_v4.gd \
            game/scenes/aurelian/world_scale_sector_generator_v4.tscn \
            game/assets/aurelian-basin/export/aurelian_authored_terrain_v1.glb \
            game/assets/aurelian-basin/export/transform-manifest.json \
            game/scenes/aurelian/production_village_v1_state_manifest.json
          sha256sum "${CANONICAL_GLB}" "${SECTOR_SPEC}" "${ATLAS_SPEC}" \
            | tee "${EVIDENCE_DIR}/atlas-inputs.sha256"

      - name: Install deterministic authoring tooling
        timeout-minutes: 7
        run: |
          set -euo pipefail
          command -v curl
          command -v tar
          command -v xvfb-run
          command -v unzip
          command -v python3
          rm -rf /tmp/blender /tmp/godot "${SECTOR_BUILD_DIR}" "${ATLAS_BUILD_DIR}"
          mkdir -p /tmp/blender /tmp/godot "${SECTOR_BUILD_DIR}" "${ATLAS_BUILD_DIR}"
          curl -fsSL --retry 4 --retry-all-errors --connect-timeout 20 \
            "https://download.blender.org/release/Blender4.3/blender-${BLENDER_VERSION}-linux-x64.tar.xz" \
            -o /tmp/blender/blender.tar.xz
          tar -xJf /tmp/blender/blender.tar.xz -C /tmp/blender
          test -x "${BLENDER_BIN}"
          "${BLENDER_BIN}" --version | head -1 | tee "${EVIDENCE_DIR}/blender-version.txt"
          python3 -m pip install --disable-pip-version-check --quiet --user pillow

      - name: Rebuild accepted Sector v4 reference
        timeout-minutes: 14
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR="${RUNNER_TEMP}/xdg-runtime"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          timeout 12m env LIBGL_ALWAYS_SOFTWARE=1 \
            "${BLENDER_BIN}" -b \
            --python game/assets/aurelian-basin/source/aurelian_sector_generator_v4.py -- \
            "$PWD/${CANONICAL_GLB}" \
            "$PWD/${TOPOLOGY_MANIFEST}" \
            "$PWD/${CITY_MANIFEST}" \
            "$PWD/${SECTOR_SPEC}" \
            "${SECTOR_BUILD_DIR}" \
            2>&1 | tee "${EVIDENCE_DIR}/sector-reference-build.log"
          grep -F "AURELIAN_SECTOR_GENERATOR_V4=PASS" "${EVIDENCE_DIR}/sector-reference-build.log"
          test -s "${SECTOR_BUILD_DIR}/aurelian_sector_generator_v4.glb"
          test -s "${SECTOR_BUILD_DIR}/aurelian_sector_generator_v4_manifest.json"
          cp "${SECTOR_BUILD_DIR}/aurelian_sector_generator_v4.glb" "${GENERATED_SECTOR_GLB}"
          cp "${SECTOR_BUILD_DIR}/aurelian_sector_generator_v4_manifest.json" "${GENERATED_SECTOR_MANIFEST}"
          cp "${SECTOR_BUILD_DIR}/aurelian_sector_generator_v4_manifest.json" "${EVIDENCE_DIR}/sector-reference-manifest.json"

      - name: Build World Atlas v1 from macro spec
        timeout-minutes: 14
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR="${RUNNER_TEMP}/xdg-runtime"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          timeout 12m env LIBGL_ALWAYS_SOFTWARE=1 \
            "${BLENDER_BIN}" -b \
            --python game/assets/aurelian-basin/source/world_atlas_v1.py -- \
            "$PWD/${CANONICAL_GLB}" \
            "$PWD/${SECTOR_SPEC}" \
            "$PWD/${ATLAS_SPEC}" \
            "${ATLAS_BUILD_DIR}" \
            2>&1 | tee "${EVIDENCE_DIR}/atlas-build.log"
          grep -F "PIXEL_NATIONS_WORLD_ATLAS_V1=PASS" "${EVIDENCE_DIR}/atlas-build.log"
          test -s "${ATLAS_BUILD_DIR}/world_atlas_v1.glb"
          test -s "${ATLAS_BUILD_DIR}/world_atlas_v1_manifest.json"
          cp "${ATLAS_BUILD_DIR}/world_atlas_v1.glb" "${GENERATED_ATLAS_GLB}"
          cp "${ATLAS_BUILD_DIR}/world_atlas_v1_manifest.json" "${GENERATED_ATLAS_MANIFEST}"
          cp "${ATLAS_BUILD_DIR}/world_atlas_v1_manifest.json" "${EVIDENCE_DIR}/world_atlas_v1_manifest.json"
          cp "${ATLAS_SPEC}" "${EVIDENCE_DIR}/world_atlas_v1_spec.json"
          sha256sum "${GENERATED_ATLAS_GLB}" | tee "${EVIDENCE_DIR}/atlas-glb.sha256"

      - name: Validate Atlas manifest
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path(os.environ['GENERATED_ATLAS_MANIFEST']).read_text())
          spec = json.loads(Path(os.environ['ATLAS_SPEC']).read_text())
          assert manifest['contract'] == 'PIXEL_NATIONS_WORLD_ATLAS_V1'
          assert manifest['seed'] == spec['seed']
          assert 12 <= manifest['macro_region_count'] <= 20
          assert manifest['relief_chain_count'] >= 3
          assert manifest['vegetation_mass_count'] >= 3
          assert manifest['water_system_count'] >= 2
          assert manifest['strategic_loci_count'] <= 8
          assert manifest['origin_sector'] == 'A-01'
          assert manifest['technical_padding'] >= 3000
          assert manifest['literal_sector_grid'] is False
          assert manifest['literal_land_grid'] is False
          assert manifest['full_sector_glbs_generated'] == 0
          assert manifest['gameplay_state_changed'] is False
          assert manifest['new_asset_family'] is False
          print('PIXEL_NATIONS_WORLD_ATLAS_V1_MANIFEST=PASS')
          PY

      - name: Download pinned Godot
        timeout-minutes: 5
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 --retry-all-errors --connect-timeout 20 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" \
            -o /tmp/godot/godot.zip
          unzip -q /tmp/godot/godot.zip -d /tmp/godot
          chmod +x "${GODOT_BIN}"
          "${GODOT_BIN}" --version | tee "${EVIDENCE_DIR}/godot-version.txt"

      - name: Import generated GLBs and run focused contracts
        timeout-minutes: 7
        run: |
          set -euo pipefail
          "${GODOT_BIN}" --headless --path game --editor --quit > "${EVIDENCE_DIR}/godot-import.log" 2>&1 || {
            cat "${EVIDENCE_DIR}/godot-import.log"; exit 1;
          }
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Blender path is invalid" "${EVIDENCE_DIR}/godot-import.log"; then
            cat "${EVIDENCE_DIR}/godot-import.log"
            exit 1
          fi
          "${GODOT_BIN}" --headless --path game \
            --script res://tests/aurelian_sector_generator_v4_test.gd \
            > "${EVIDENCE_DIR}/sector-reference-contract.log" 2>&1
          grep -F "AURELIAN_SECTOR_GENERATOR_V4_TEST: PASS" "${EVIDENCE_DIR}/sector-reference-contract.log"
          "${GODOT_BIN}" --headless --path game \
            --script res://tests/world_atlas_v1_test.gd \
            > "${EVIDENCE_DIR}/world-atlas-contract.log" 2>&1
          grep -F "PIXEL_NATIONS_WORLD_ATLAS_V1_TEST: PASS" "${EVIDENCE_DIR}/world-atlas-contract.log"

      - name: Capture accepted Sector A-01 reference
        timeout-minutes: 3
        run: |
          set -euo pipefail
          SECTOR_TMP="${EVIDENCE_DIR}/sector-tmp"
          mkdir -p "$SECTOR_TMP"
          timeout 80s xvfb-run -a -s "-screen 0 1600x1000x24" env \
            AURELIAN_EVIDENCE_DIR="$PWD/$SECTOR_TMP" \
            AURELIAN_CAPTURE_SECTOR_GENERATOR_V4=1 \
            "${GODOT_BIN}" --path game --audio-driver Dummy --rendering-method gl_compatibility \
            res://scenes/aurelian/world_scale_sector_generator_v4.tscn \
            > "${EVIDENCE_DIR}/sector-reference.log" 2>&1
          grep -F "AURELIAN_SECTOR_GENERATOR_V4_STILL=" "${EVIDENCE_DIR}/sector-reference.log"
          test -s "$SECTOR_TMP/sector-a01-generator-v4-1440x900.png"
          cp "$SECTOR_TMP/sector-a01-generator-v4-1440x900.png" \
            "${EVIDENCE_DIR}/accepted-sector-a01-1440x900.png"
          rm -rf "$SECTOR_TMP"

      - name: Capture World Atlas v1
        timeout-minutes: 3
        run: |
          set -euo pipefail
          timeout 80s xvfb-run -a -s "-screen 0 1600x1000x24" env \
            AURELIAN_EVIDENCE_DIR="$PWD/${EVIDENCE_DIR}" \
            AURELIAN_CAPTURE_WORLD_ATLAS_V1=1 \
            "${GODOT_BIN}" --path game --audio-driver Dummy --rendering-method gl_compatibility \
            res://scenes/aurelian/world_atlas_v1.tscn \
            > "${EVIDENCE_DIR}/world-atlas.log" 2>&1
          grep -F "PIXEL_NATIONS_WORLD_ATLAS_V1_STILL=" "${EVIDENCE_DIR}/world-atlas.log"
          test -s "${EVIDENCE_DIR}/world-atlas-v1-1440x900.png"
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load|^ERROR:" "${EVIDENCE_DIR}/world-atlas.log"; then
            cat "${EVIDENCE_DIR}/world-atlas.log"
            exit 1
          fi

      - name: Validate exact two-frame evidence
        timeout-minutes: 3
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from PIL import Image, ImageChops, ImageStat

          root = Path(os.environ['EVIDENCE_DIR'])
          names = ['accepted-sector-a01-1440x900.png', 'world-atlas-v1-1440x900.png']
          images = {}
          report = {}
          for name in names:
              path = root / name
              image = Image.open(path).convert('RGB')
              if image.size != (1440, 900):
                  raise SystemExit(f'{name}: wrong size {image.size}')
              variance = sum(ImageStat.Stat(image).var) / 3.0
              colors = len(set(image.resize((240, 150)).getdata()))
              if path.stat().st_size < 65000 or variance < 35.0 or colors < 220:
                  raise SystemExit(f'{name}: weak evidence bytes={path.stat().st_size} variance={variance:.2f} colors={colors}')
              images[name] = image
              report[name] = {
                  'bytes': path.stat().st_size,
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                  'variance': round(variance, 3),
                  'sample_colors': colors,
              }

          changed = sum(1 for px in ImageChops.difference(images[names[0]].resize((240,150)), images[names[1]].resize((240,150))).getdata() if px != (0,0,0))
          if changed < 7000:
              raise SystemExit(f'Sector/Atlas delta too small: {changed}')

          sheet = Image.new('RGB', (960, 300), (37, 40, 38))
          sheet.paste(images[names[0]].resize((480, 300)), (0, 0))
          sheet.paste(images[names[1]].resize((480, 300)), (480, 0))
          sheet.save(root / 'sector-vs-world-atlas-review.jpg', quality=95)

          manifest = json.loads((root / 'world_atlas_v1_manifest.json').read_text())
          qa = {
              'status': 'PASS_DETERMINISTIC_ONLY_PENDING_DIRECT_VISUAL_REVIEW',
              'exact_head': (root / 'exact-head.txt').read_text().strip(),
              'frames': report,
              'sector_atlas_changed_sample_pixels': changed,
              'seed': manifest['seed'],
              'macro_region_count': manifest['macro_region_count'],
              'origin_sector': manifest['origin_sector'],
              'literal_sector_grid': manifest['literal_sector_grid'],
              'literal_land_grid': manifest['literal_land_grid'],
          }
          (root / 'evidence-qa.json').write_text(json.dumps(qa, indent=2) + '\n')
          print('PIXEL_NATIONS_WORLD_ATLAS_V1_EVIDENCE=PASS')
          PY

      - name: Stage Atlas GLB for review artifact
        if: always()
        run: |
          if [ -s "${GENERATED_ATLAS_GLB}" ]; then
            cp "${GENERATED_ATLAS_GLB}" "${EVIDENCE_DIR}/world_atlas_v1.glb"
          fi

      - name: Upload World Atlas evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-atlas-v1-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/world-atlas-v1
          if-no-files-found: error
          retention-days: 1
