name: Pixel Nations Village V4 Reauthor Proof

on:
  push:
    branches:
      - visual/village-v4-reauthor
    paths:
      - .github/workflows/village-v4-reauthor-proof.yml
      - tools/blender/aurelian_village_v4_reauthor.py
      - tools/qa/run_aurelian_village_v4_reauthor.sh
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: village-v4-reauthor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact V4 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Render materially re-authored desktop and portrait candidate
        run: bash tools/qa/run_aurelian_village_v4_reauthor.sh

      - name: Upload exact contact sheets and layer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixel-nations-village-v4-reauthor
          path: |
            ${{ runner.temp }}/pixel-nations-village-v4-reauthor/render
            game/art_target/village_v4_reauthor
            review/aurelian-village-v4-m2
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

      - name: Commit deterministic candidate assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/art_target/village_v4_reauthor review/aurelian-village-v4-m2
          if git diff --cached --quiet; then
            echo "Village V4 reauthor assets already current."
          else
            git commit -m "art: render Village V4 reauthored candidate [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
