name: Apply P2 Settlement Patch

on:
  push:
    branches:
      - gpt56/p2-settlement-stewardship

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  apply-patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: gpt56/p2-settlement-stewardship
          fetch-depth: 0

      - name: Decode and validate patch
        run: |
          base64 --decode patches/p2-settlement-stewardship.patch.gz.b64 | gzip --decompress --stdout > /tmp/p2-settlement.patch
          git apply --check /tmp/p2-settlement.patch
          git apply /tmp/p2-settlement.patch
          git diff --check

      - name: Remove temporary delivery files
        run: |
          rm -f patches/p2-settlement-stewardship.patch.gz.b64
          rmdir patches 2>/dev/null || true
          rm -f .github/workflows/apply-p2-settlement.yml

      - name: Commit deterministic implementation
        run: |
          git config user.name "pixel-nations-steward[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: add settlement stewardship loop"
          git push origin HEAD:gpt56/p2-settlement-stewardship
