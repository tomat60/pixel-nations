name: Godot Aurelian World Scale Regional R1

on:
  push:
    branches:
      - agent/world-scale-regional-terrain-v2
    paths:
      - "game/scenes/aurelian/world_scale_regional_terrain_v2.gd"
      - "game/scenes/aurelian/world_scale_regional_terrain_v2.tscn"
      - "game/tests/aurelian_world_scale_regional_terrain_v2_test.gd"
      - ".github/workflows/godot-aurelian-world-scale-regional-r1.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_RELEASE: "4.7.1-stable"
  GODOT_BIN: "/tmp/godot/Godot_v4.7.1-stable_linux.x86_64"
  EVIDENCE_DIR: "evidence/world-scale-regional-r1"
  ACCEPTED_LOCAL_SHA256: "ed31f7ca430e759494c42ade2d57ad40de4d0334772e7f34d8726a4529bf44cc"

jobs:
  regional-r1:
    name: Render accepted local and continuous Sector A-01
    runs-on: ubuntu-latest
    timeout-minutes: 14

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record exact head
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_DIR}"
          git rev-parse HEAD | tee "${EVIDENCE_DIR}/exact-head.txt"
          test -s game/assets/aurelian-basin/export/aurelian_authored_terrain_v1.glb

      - name: Download pinned Godot
        timeout-minutes: 5
        run: |
          set -euo pipefail
          rm -rf /tmp/godot
          mkdir -p /tmp/godot
          curl -fsSL --retry 4 --retry-all-errors --connect-timeout 20 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" \
            -o /tmp/godot/godot.zip
          unzip -q /tmp/godot/godot.zip -d /tmp/godot
          chmod +x "${GODOT_BIN}"
          "${GODOT_BIN}" --version | tee "${EVIDENCE_DIR}/godot-version.txt"
          python3 -m pip install --disable-pip-version-check --quiet --user pillow

      - name: Import and run focused contracts
        timeout-minutes: 4
        run: |
          set -euo pipefail
          "${GODOT_BIN}" --headless --path game --editor --quit > "${EVIDENCE_DIR}/godot-import.log" 2>&1 || {
            cat "${EVIDENCE_DIR}/godot-import.log"; exit 1;
          }
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Blender path is invalid" "${EVIDENCE_DIR}/godot-import.log"; then
            cat "${EVIDENCE_DIR}/godot-import.log"
            exit 1
          fi
          "${GODOT_BIN}" --headless --path game --script res://tests/aurelian_full_progression_clarity_composition_v1_test.gd \
            > "${EVIDENCE_DIR}/clarity-regression.log" 2>&1
          grep -F "AURELIAN_FULL_PROGRESSION_CLARITY_COMPOSITION_V1_TEST: PASS" "${EVIDENCE_DIR}/clarity-regression.log"
          "${GODOT_BIN}" --headless --path game --script res://tests/aurelian_world_scale_regional_terrain_v2_test.gd \
            > "${EVIDENCE_DIR}/regional-contract.log" 2>&1
          grep -F "AURELIAN_WORLD_SCALE_REGIONAL_TERRAIN_V2_TEST: PASS" "${EVIDENCE_DIR}/regional-contract.log"

      - name: Capture accepted local reference
        timeout-minutes: 3
        run: |
          set -euo pipefail
          capture_dir="${EVIDENCE_DIR}/tmp-local"
          mkdir -p "$capture_dir"
          timeout 80s xvfb-run -a -s "-screen 0 1600x1000x24" env \
            AURELIAN_EVIDENCE_DIR="$PWD/$capture_dir" \
            AURELIAN_CAPTURE_PRESET=world \
            AURELIAN_PROGRESSION_STAGE=empire \
            "${GODOT_BIN}" --path game --audio-driver Dummy --rendering-method gl_compatibility \
            res://scenes/aurelian/full_progression_clarity_composition_v1.tscn \
            > "${EVIDENCE_DIR}/local.log" 2>&1
          grep -F "FULL_PROGRESSION_VISUAL_GRAMMAR_V2_GATE_B_READY=empire:world" "${EVIDENCE_DIR}/local.log"
          test -s "$capture_dir/world-1440x900.png"
          cp "$capture_dir/world-1440x900.png" "${EVIDENCE_DIR}/local-1440x900.png"
          rm -rf "$capture_dir"
          local_sha="$(sha256sum "${EVIDENCE_DIR}/local-1440x900.png" | awk '{print $1}')"
          test "$local_sha" = "${ACCEPTED_LOCAL_SHA256}"

      - name: Capture continuous Sector A-01 candidate
        timeout-minutes: 3
        run: |
          set -euo pipefail
          capture_dir="${EVIDENCE_DIR}/tmp-sector"
          mkdir -p "$capture_dir"
          timeout 80s xvfb-run -a -s "-screen 0 1600x1000x24" env \
            AURELIAN_EVIDENCE_DIR="$PWD/$capture_dir" \
            AURELIAN_CAPTURE_PRESET=world \
            AURELIAN_PROGRESSION_STAGE=empire \
            "${GODOT_BIN}" --path game --audio-driver Dummy --rendering-method gl_compatibility \
            res://scenes/aurelian/world_scale_regional_terrain_v2.tscn \
            > "${EVIDENCE_DIR}/sector.log" 2>&1
          grep -F "FULL_PROGRESSION_VISUAL_GRAMMAR_V2_GATE_B_READY=empire:world" "${EVIDENCE_DIR}/sector.log"
          test -s "$capture_dir/world-1440x900.png"
          cp "$capture_dir/world-1440x900.png" "${EVIDENCE_DIR}/sector-r1-1440x900.png"
          rm -rf "$capture_dir"

      - name: Build direct-review sheet and deterministic QA
        timeout-minutes: 2
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from PIL import Image, ImageChops, ImageStat

          root = Path(os.environ['EVIDENCE_DIR'])
          paths = {
              'local': root/'local-1440x900.png',
              'sector_r1': root/'sector-r1-1440x900.png',
          }
          images = {}
          report = {}
          for key,path in paths.items():
              image = Image.open(path).convert('RGB')
              if image.size != (1440,900):
                  raise SystemExit(f'{key}: wrong size {image.size}')
              variance = sum(ImageStat.Stat(image).var) / 3.0
              if path.stat().st_size < 65000 or variance < 30.0:
                  raise SystemExit(f'{key}: weak frame bytes={path.stat().st_size} variance={variance:.2f}')
              images[key] = image
              report[key] = {
                  'bytes': path.stat().st_size,
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                  'variance': round(variance,3),
              }

          a = images['local'].resize((240,150))
          b = images['sector_r1'].resize((240,150))
          diff = ImageChops.difference(a,b)
          changed = sum(1 for pixel in diff.getdata() if pixel != (0,0,0))
          if changed < 5000:
              raise SystemExit(f'local/sector physical delta too small: {changed}')

          sheet = Image.new('RGB',(1440,450),(38,43,42))
          sheet.paste(images['local'].resize((720,450)),(0,0))
          sheet.paste(images['sector_r1'].resize((720,450)),(720,0))
          sheet.save(root/'r1-unlabeled-local-sector.jpg',quality=95)

          qa = {
              'status': 'PASS_DETERMINISTIC_ONLY_PENDING_DIRECT_R1_REVIEW',
              'exact_head': (root/'exact-head.txt').read_text().strip(),
              'accepted_local_sha256': os.environ['ACCEPTED_LOCAL_SHA256'],
              'frames': report,
              'changed_sample_pixels': changed,
              'atlas_implemented': False,
              'direct_review_required': True,
          }
          (root/'r1-qa.json').write_text(json.dumps(qa,indent=2)+'\n')
          print('AURELIAN_WORLD_SCALE_REGIONAL_R1_DETERMINISTIC=PASS')
          PY

      - name: Upload R1 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-scale-regional-r1-${{ github.sha }}
          path: evidence/world-scale-regional-r1
          if-no-files-found: error
          retention-days: 3
