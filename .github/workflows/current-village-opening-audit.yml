name: Current Village Opening Audit

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/qa-current-village-opening.mjs
      - .github/workflows/current-village-opening-audit.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit-opening:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact audit branch
        uses: actions/checkout@v4
        with:
          ref: qa/current-village-opening-audit
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build current product
        run: npm run build

      - name: Capture current camp to shelter opening
        run: node scripts/qa-current-village-opening.mjs

      - name: Verify evidence package
        run: |
          set -euo pipefail
          test -s public/qa/current-village-opening/desktop-camp-to-shelter.webm
          test -s public/qa/current-village-opening/desktop-00-camp.png
          test -s public/qa/current-village-opening/desktop-02-shelter-settled.png
          test -s public/qa/current-village-opening/mobile-00-camp.png
          test -s public/qa/current-village-opening/mobile-01-shelter-settled.png
          test -s public/qa/current-village-opening/contact-sheet.png
          test -s public/qa/current-village-opening/manifest.json
          grep -F '"classification": "PENDING_DIRECT_VISUAL_REVIEW"' public/qa/current-village-opening/manifest.json
          grep -F '"villageV2Flag": "unset"' public/qa/current-village-opening/manifest.json
          find public/qa/current-village-opening -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > public/qa/current-village-opening/SHA256SUMS.txt
          echo CURRENT_VILLAGE_OPENING_PACKAGE_OK

      - name: Upload current Village opening evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-village-opening-${{ github.run_id }}
          path: public/qa/current-village-opening/**
          if-no-files-found: error
          retention-days: 30

      - name: Report audit run
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:322,body:`## Current Village opening audit ${context.runId}\n\n- Event SHA: \`${context.sha}\`\n- Job status: \`${{ job.status }}\`\n- Artifact: \`current-village-opening-${context.runId}\`\n- Product/runtime files unchanged. Direct visual review is required before any product sprint.\n\nNo main write, merge, deployment, payment, MAX or image generation was used.`})
