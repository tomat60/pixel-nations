name: P5 Frontier Recovery Evidence

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  p5-frontier-recovery-evidence:
    name: Generate P5 frontier recovery evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Generate P5 frontier recovery evidence
        run: npm run qa:p5-frontier-recovery

      - name: Upload P5 frontier recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: pixel-nations-p5-frontier-recovery-evidence
          path: public/qa/p5-frontier-recovery-guidance
          if-no-files-found: error
          retention-days: 7
