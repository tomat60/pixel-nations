name: Aurelian Exact GLB Product Camera Replay

on:
  pull_request:
    branches: [main]
    paths:
      - "game/scenes/calibration/aurelian_replay/**"
      - ".github/workflows/aurelian-render-replay.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GODOT_RELEASE: "4.7.1-stable"
  GODOT_BIN: "/tmp/godot/Godot_v4.7.1-stable_linux.x86_64"
  EVIDENCE_DIR: "evidence/aurelian-render-replay"
  SOURCE_RUN_ID: "31808264198"
  SOURCE_ARTIFACT_ID: "9222116061"
  SOURCE_ARTIFACT_DIGEST: "sha256:d810b371584d1da404b1c34e64270c5d38158c74a7d775560b16fa2228cb6990"
  SOURCE_GLB_SHA256: "2014fadc94cbc6a53f30c097788036775c878b6e6540d30d108ddb40c8b903e7"
  SOURCE_HEAD: "be801c6aad0ea836210ef85929d8bc95c3152525"

jobs:
  replay-product-cameras:
    name: Reveal exact pinned Aurelian product cameras
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout exact replay head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Record exact replay head
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_DIR}"
          git rev-parse HEAD | tee "${EVIDENCE_DIR}/exact-head.txt"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          fi

      - name: Verify pinned source artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}" \
            > "${EVIDENCE_DIR}/source-artifact-metadata.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['EVIDENCE_DIR'])/'source-artifact-metadata.json'
          data=json.loads(p.read_text())
          if data.get('id') != int(os.environ['SOURCE_ARTIFACT_ID']):
              raise SystemExit('source artifact id mismatch')
          if data.get('digest') != os.environ['SOURCE_ARTIFACT_DIGEST']:
              raise SystemExit(f"source artifact digest mismatch: {data.get('digest')}")
          if data.get('expired'):
              raise SystemExit('source artifact expired')
          print('AURELIAN_REPLAY_ARTIFACT_METADATA=PASS')
          PY

      - name: Download exact rejected-429 artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 9222116061
          path: /tmp/aurelian429
          github-token: ${{ github.token }}
          repository: tomat60/pixel-nations
          run-id: 31808264198

      - name: Verify and stage unchanged GLB input
        run: |
          set -euo pipefail
          GLB="$(find /tmp/aurelian429 -type f -name 'aurelian_basin_phase1_recovery.glb' -print -quit)"
          test -n "$GLB"
          ARTIFACT_ROOT="$(dirname "$GLB")"
          test -s "$GLB"
          test "$(sha256sum "$GLB" | cut -d' ' -f1)" = "${SOURCE_GLB_SHA256}"
          test "$(tr -d '\r\n' < "${ARTIFACT_ROOT}/exact-head.txt")" = "${SOURCE_HEAD}"
          mkdir -p game/calibration_input
          cp "$GLB" game/calibration_input/aurelian_basin_phase1_recovery.glb
          cp "${ARTIFACT_ROOT}/transform-manifest.json" "${EVIDENCE_DIR}/source-transform-manifest.json"
          cp "${ARTIFACT_ROOT}/runtime-manifest.json" "${EVIDENCE_DIR}/source-runtime-manifest.json"
          printf '%s\n' "${SOURCE_GLB_SHA256}" > "${EVIDENCE_DIR}/source-glb.sha256"
          echo "AURELIAN_REPLAY_SOURCE_GLB=PASS"

      - name: Install deterministic capture tooling
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            unzip xvfb ffmpeg python3-pil \
            libegl1 libgl1-mesa-dri libglx-mesa0 libx11-6 libxcursor1 \
            libxinerama1 libxi6 libxrandr2 >/dev/null
          ffmpeg -version | head -1 | tee "${EVIDENCE_DIR}/ffmpeg-version.txt"

      - name: Download pinned Godot 4.7.1
        run: |
          set -euo pipefail
          mkdir -p /tmp/godot
          curl -fsSL --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" \
            -o /tmp/godot/godot.zip
          unzip -q /tmp/godot/godot.zip -d /tmp/godot
          chmod +x "${GODOT_BIN}"
          "${GODOT_BIN}" --version | tee "${EVIDENCE_DIR}/godot-version.txt"

      - name: Import exact GLB and run foundation tests
        run: |
          set -euo pipefail
          "${GODOT_BIN}" --headless --path game --editor --quit \
            > "${EVIDENCE_DIR}/godot-import.log" 2>&1 || {
              cat "${EVIDENCE_DIR}/godot-import.log"; exit 1;
            }
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" "${EVIDENCE_DIR}/godot-import.log"; then
            cat "${EVIDENCE_DIR}/godot-import.log"
            exit 1
          fi
          "${GODOT_BIN}" --headless --path game --script res://tests/run_all.gd \
            > "${EVIDENCE_DIR}/foundation-tests.log" 2>&1
          grep -F "PIXEL_NATIONS_GODOT_TESTS: PASS" "${EVIDENCE_DIR}/foundation-tests.log"

      - name: Pin replay viewport to 1440x900
        run: |
          set -euo pipefail
          sed -i 's/window\/size\/viewport_width=1280/window\/size\/viewport_width=1440/' game/project.godot
          sed -i 's/window\/size\/viewport_height=720/window\/size\/viewport_height=900/' game/project.godot
          sed -i 's/window\/size\/window_width_override=1280/window\/size\/window_width_override=1440/' game/project.godot
          sed -i 's/window\/size\/window_height_override=720/window\/size\/window_height_override=900/' game/project.godot
          grep -F 'window/size/viewport_width=1440' game/project.godot
          grep -F 'window/size/viewport_height=900' game/project.godot

      - name: Capture truthful Village Map World Bridge stills
        run: |
          set -euo pipefail
          for preset in village map world bridge; do
            timeout 120s xvfb-run -a -s "-screen 0 1600x1000x24" env \
              LIBGL_ALWAYS_SOFTWARE=1 \
              AURELIAN_REPLAY_EVIDENCE_DIR="$PWD/${EVIDENCE_DIR}" \
              AURELIAN_REPLAY_PRESET="$preset" \
              "${GODOT_BIN}" --path game --audio-driver Dummy \
              --rendering-method gl_compatibility --resolution 1440x900 --position 0,0 \
              res://scenes/calibration/aurelian_replay/aurelian_product_camera_replay.tscn \
              > "${EVIDENCE_DIR}/${preset}.log" 2>&1
            grep -F "AURELIAN_REPLAY_STILL_PASS=${preset}" "${EVIDENCE_DIR}/${preset}.log"
            test -s "${EVIDENCE_DIR}/${preset}-1440x900.png"
            test -s "${EVIDENCE_DIR}/${preset}-sub-1440x900.png"
            if grep -E "SCRIPT ERROR|Parse Error|Failed to load|^ERROR:" "${EVIDENCE_DIR}/${preset}.log"; then
              cat "${EVIDENCE_DIR}/${preset}.log"
              exit 1
            fi
          done

      - name: Capture 18 second Village Map World replay movie
        run: |
          set -euo pipefail
          timeout 150s xvfb-run -a -s "-screen 0 1600x1000x24" env \
            LIBGL_ALWAYS_SOFTWARE=1 \
            AURELIAN_REPLAY_EVIDENCE_DIR="$PWD/${EVIDENCE_DIR}" \
            AURELIAN_REPLAY_SEQUENCE=1 \
            "${GODOT_BIN}" --path game --audio-driver Dummy \
            --rendering-method gl_compatibility --resolution 1440x900 --position 0,0 \
            --disable-vsync --fixed-fps 30 \
            --write-movie "$PWD/${EVIDENCE_DIR}/camera-switch.avi" \
            res://scenes/calibration/aurelian_replay/aurelian_product_camera_replay.tscn \
            > "${EVIDENCE_DIR}/camera-switch.log" 2>&1
          grep -F "AURELIAN_REPLAY_MOVIE_STAGE=village" "${EVIDENCE_DIR}/camera-switch.log"
          grep -F "AURELIAN_REPLAY_MOVIE_STAGE=map" "${EVIDENCE_DIR}/camera-switch.log"
          grep -F "AURELIAN_REPLAY_MOVIE_STAGE=world" "${EVIDENCE_DIR}/camera-switch.log"
          grep -F "AURELIAN_REPLAY_MOVIE_COMPLETE=540" "${EVIDENCE_DIR}/camera-switch.log"
          ffmpeg -y -loglevel error -i "${EVIDENCE_DIR}/camera-switch.avi" \
            -c:v libx264 -pix_fmt yuv420p "${EVIDENCE_DIR}/camera-switch.mp4"
          for pair in "2 movie-village" "8 movie-map" "14 movie-world"; do
            set -- $pair
            ffmpeg -y -loglevel error -ss "$1" -i "${EVIDENCE_DIR}/camera-switch.mp4" \
              -frames:v 1 "${EVIDENCE_DIR}/$2.png"
          done
          ffprobe -v error -show_entries stream=width,height,r_frame_rate,codec_name \
            -show_entries format=duration -of json "${EVIDENCE_DIR}/camera-switch.mp4" \
            > "${EVIDENCE_DIR}/video-metadata.json"

      - name: Validate exact replay evidence and provenance
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, math, os
          from pathlib import Path
          from PIL import Image, ImageStat, ImageChops

          root=Path(os.environ['EVIDENCE_DIR'])
          expected_centers={
            'village':[425.0,315.0],
            'map':[500.0,435.0],
            'world':[500.0,465.0],
            'bridge':[515.0,340.0],
          }
          expected_sizes={'village':52.0,'map':103.0,'world':132.0,'bridge':27.0}
          report={}
          thumbs={}
          for preset in ('village','map','world','bridge'):
              primary=root/f'{preset}-1440x900.png'
              raw=root/f'{preset}-sub-1440x900.png'
              for path in (primary,raw):
                  if not path.exists() or path.stat().st_size < 10000:
                      raise SystemExit(f'missing/weak replay image: {path.name}')
                  image=Image.open(path).convert('RGB')
                  if image.size != (1440,900):
                      raise SystemExit(f'wrong replay image dimensions {path.name}: {image.size}')
                  sample=image.resize((240,150))
                  variance=sum(ImageStat.Stat(sample).var)/3.0
                  colors=len(set(sample.getdata()))
                  if variance < 5.0 or colors < 50:
                      raise SystemExit(f'blank/weak replay image {path.name}: variance={variance:.3f} colors={colors}')
              pimg=Image.open(primary).convert('RGB')
              rimg=Image.open(raw).convert('RGB')
              delta=sum(ImageStat.Stat(ImageChops.difference(pimg,rimg)).mean)/3.0
              report[preset]={
                  'bytes':primary.stat().st_size,
                  'sha256':hashlib.sha256(primary.read_bytes()).hexdigest(),
                  'raw_sub_sha256':hashlib.sha256(raw.read_bytes()).hexdigest(),
                  'consumed_vs_sub_mean_delta':round(delta,4),
              }
              thumbs[preset]=pimg.resize((240,150))

              camera=json.loads((root/f'camera-{preset}.json').read_text())
              if camera['topology_center'] != expected_centers[preset]:
                  raise SystemExit(f'camera center drift {preset}: {camera}')
              if abs(float(camera['orthographic_size'])-expected_sizes[preset]) > 0.001:
                  raise SystemExit(f'camera size drift {preset}: {camera}')
              if not camera['current']:
                  raise SystemExit(f'camera not current {preset}')
              env=json.loads((root/f'environment-{preset}.json').read_text())
              if abs(float(env['tonemap_exposure'])-1.0) > 0.001:
                  raise SystemExit(f'exposure drift {preset}: {env}')
              if env['tonemap'] != 'FILMIC':
                  raise SystemExit(f'tonemap drift {preset}: {env}')

          for a,b in (('village','map'),('map','world'),('village','bridge')):
              delta=sum(ImageStat.Stat(ImageChops.difference(thumbs[a],thumbs[b])).mean)/3.0
              if delta < 0.5:
                  raise SystemExit(f'camera replay too similar {a}/{b}: {delta:.3f}')

          video=json.loads((root/'video-metadata.json').read_text())
          duration=float(video['format']['duration'])
          stream=video['streams'][0]
          if not 17.5 <= duration <= 18.5:
              raise SystemExit(f'movie duration drift: {duration}')
          if int(stream['width']) != 1440 or int(stream['height']) != 900:
              raise SystemExit(f'movie dimensions drift: {stream}')

          qa={
              'status':'VALID_FOR_DIRECT_VISUAL_REVIEW',
              'classification':'PENDING_DIRECT_VISUAL_REVIEW',
              'exact_head':(root/'exact-head.txt').read_text().strip(),
              'source_artifact_id':int(os.environ['SOURCE_ARTIFACT_ID']),
              'source_artifact_digest':os.environ['SOURCE_ARTIFACT_DIGEST'],
              'source_head':os.environ['SOURCE_HEAD'],
              'source_glb_sha256':os.environ['SOURCE_GLB_SHA256'],
              'environment_exposure':1.0,
              'stills':report,
              'movie_seconds':duration,
          }
          (root/'replay-qa.json').write_text(json.dumps(qa,indent=2)+'\n')
          print('AURELIAN_RENDER_REPLAY_EVIDENCE=VALID_FOR_DIRECT_VISUAL_REVIEW')
          PY

      - name: Write runtime provenance and evidence hashes
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['EVIDENCE_DIR'])
          data={
            'exact_head':(root/'exact-head.txt').read_text().strip() if (root/'exact-head.txt').exists() else None,
            'source_artifact_id':int(os.environ['SOURCE_ARTIFACT_ID']),
            'source_artifact_digest':os.environ['SOURCE_ARTIFACT_DIGEST'],
            'source_head':os.environ['SOURCE_HEAD'],
            'source_glb_sha256':os.environ['SOURCE_GLB_SHA256'],
            'godot_version':(root/'godot-version.txt').read_text().strip() if (root/'godot-version.txt').exists() else None,
            'renderer':'Godot Compatibility / gl_compatibility',
            'still_target':[1440,900],
            'movie_target':[1440,900,30,18],
            'tonemap_exposure':1.0,
          }
          (root/'runtime-manifest.json').write_text(json.dumps(data,indent=2)+'\n')
          PY
          find "${EVIDENCE_DIR}" -type f ! -name SHA256SUMS.txt -print0 | sort -z | \
            xargs -0 sha256sum > "${EVIDENCE_DIR}/SHA256SUMS.txt"

      - name: Upload exact-head replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurelian-render-replay-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/aurelian-render-replay/**
          if-no-files-found: error
          retention-days: 30
