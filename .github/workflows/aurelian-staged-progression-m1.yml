name: Aurelian Staged Progression M1

on:
  pull_request:
    branches: [art-target/aurelian-2d-foundation]
    paths:
      - tools/blender/aurelian_staged_progression.py
      - tools/qa/run_aurelian_staged_progression_proof.sh
      - .github/workflows/aurelian-staged-progression-m1.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  render-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Render and verify staged Aurelian progression
        run: |
          set -euo pipefail
          chmod +x tools/qa/run_aurelian_staged_progression_proof.sh
          tools/qa/run_aurelian_staged_progression_proof.sh

      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurelian-staged-progression-m1-${{ github.run_id }}
          path: evidence/aurelian-staged-progression-m1/**
          if-no-files-found: warn
          retention-days: 30

      - name: Report proof run
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 328,
              body: `## Aurelian staged progression M1 run ${context.runId}\n\n- Candidate head: \`${context.sha}\`\n- Job status: \`${{ job.status }}\`\n- Artifact: \`aurelian-staged-progression-m1-${context.runId}\`\n- Contract: desktop and portrait renders for camp, first shelter and developed settlement from the accepted #315 source chain.\n- Developed renders must preserve the accepted #315 perceptual hashes.\n- Direct visual review of all six images remains mandatory.\n\nNo gameplay integration, main write, paid tool, MAX, Fable, image generation or second asset family was used.`
            })
