name: PlayCanvas Hearthmeadow Spike

on:
  workflow_dispatch:
  push:
    branches: [spike/playcanvas-hearthmeadow-static]
    paths:
      - .github/workflows/playcanvas-hearthmeadow-spike.yml

permissions:
  contents: write

concurrency:
  group: playcanvas-hearthmeadow-spike
  cancel-in-progress: true

jobs:
  build-frame:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spike/playcanvas-hearthmeadow-static
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Resolve and curate Quaternius CC0 models
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p public/assets/hearthmeadow-quaternius/models .pn-evidence
          cat > /tmp/models.tsv <<'EOF'
          barracks	UXCOwRBSxx
          temple	v36uJiErXS
          farm	91wMLb9kKo
          house-a	RSwoYSLblu
          house-b	oJJIRwv6Bo
          houses	gEjAC1UvVU
          market	fmHUuX9AS3
          pine-trees	oYtDty0fR6
          crops	Ro6K0Yg7mx
          town-center	sPY1OPVCAX
          EOF
          python3 - <<'PY'
          import html, json, re, subprocess, hashlib, mimetypes, os, zipfile
          from pathlib import Path
          from urllib.parse import unquote

          out = Path('public/assets/hearthmeadow-quaternius/models')
          evidence = Path('.pn-evidence')
          url_rx = re.compile(r'https?://[^\s"\'<>\\]+', re.I)
          manifest=[]
          failures=[]

          for line in Path('/tmp/models.tsv').read_text().splitlines():
              name, mid = line.split('\t')
              texts=[]
              endpoints=[
                  f'https://r.jina.ai/http://poly.pizza/m/{mid}',
                  f'https://poly.pizza/m/{mid}',
                  f'https://api.poly.pizza/v1/model/{mid}',
                  f'https://api.poly.pizza/model/{mid}',
              ]
              for idx,u in enumerate(endpoints):
                  p=Path('/tmp')/f'{name}-{idx}.txt'
                  subprocess.run(['curl','-L','--silent','--show-error','--max-time','45','-A','Mozilla/5.0',u,'-o',str(p)],check=False)
                  if p.exists(): texts.append((u,p.read_text(errors='replace')))
              candidates=[]
              for source,text in texts:
                  decoded=html.unescape(text)
                  for raw in url_rx.findall(decoded):
                      url=unquote(raw).replace('\\u0026','&').replace('\\/','/').rstrip('.,);]}')
                      low=url.lower()
                      if any(x in low for x in ('.glb','.gltf','.zip')) or ('download' in low and 'poly.pizza' in low):
                          candidates.append((source,url))
                  for m in re.finditer(r'"(?:download|url|file|src)"\s*:\s*"([^"]+)"',decoded,re.I):
                      url=html.unescape(m.group(1)).replace('\\u0026','&').replace('\\/','/')
                      if url.startswith('http'): candidates.append((source,url))
              seen=set(); selected=None
              for source,url in candidates:
                  if url in seen: continue
                  seen.add(url)
                  temp=Path('/tmp')/f'{name}-{len(seen)}.bin'
                  rc=subprocess.run(['curl','-L','--fail','--silent','--show-error','--max-time','120','-A','Mozilla/5.0',url,'-o',str(temp)]).returncode
                  if rc or not temp.exists() or temp.stat().st_size < 1000: continue
                  head=temp.read_bytes()[:16]
                  ctype=subprocess.run(['file','--brief','--mime-type',str(temp)],capture_output=True,text=True).stdout.strip()
                  low=url.lower()
                  if head[:4] == b'glTF':
                      dest=out/f'{name}.glb'; dest.write_bytes(temp.read_bytes()); selected=(source,url,dest,ctype); break
                  if head[:2] == b'PK':
                      zdir=Path('/tmp')/f'{name}-zip'; zdir.mkdir(exist_ok=True)
                      try:
                          with zipfile.ZipFile(temp) as z: z.extractall(zdir)
                      except Exception: continue
                      glbs=list(zdir.rglob('*.glb'))
                      if glbs:
                          dest=out/f'{name}.glb'; dest.write_bytes(glbs[0].read_bytes()); selected=(source,url,dest,ctype); break
                  if low.split('?')[0].endswith('.gltf') or ctype in ('model/gltf+json','application/json'):
                      # External-buffer glTF is not accepted as an isolated production asset.
                      continue
              if selected:
                  source,url,dest,ctype=selected
                  manifest.append({'name':name,'model_id':mid,'creator':'Quaternius','bundle':'Ultimate Fantasy RTS','mirror':'Poly Pizza','source_page':f'https://poly.pizza/m/{mid}','download_url':url,'bytes':dest.stat().st_size,'sha256':hashlib.sha256(dest.read_bytes()).hexdigest(),'mime':ctype,'path':'/'+dest.as_posix().split('public/',1)[1]})
              else:
                  failures.append({'name':name,'model_id':mid,'candidate_count':len(seen)})

          (evidence/'asset-manifest.json').write_text(json.dumps({'license':'CC0-1.0','creator_page':'https://poly.pizza/u/Quaternius','bundle_page':'https://poly.pizza/bundle/Ultimate-Fantasy-RTS','assets':manifest,'failures':failures},indent=2)+'\n')
          Path('public/assets/hearthmeadow-quaternius/PROVENANCE.md').write_text('# Hearthmeadow asset provenance\n\n- Creator: Quaternius\n- Bundle: Ultimate Fantasy RTS\n- Creator mirror: Poly Pizza verified Quaternius profile\n- License: CC0 / Public Domain\n- Only downloaded GLB files with recorded URLs, sizes and SHA-256 are included.\n')
          if len(manifest) < 6:
              raise SystemExit(f'Only {len(manifest)} valid GLB assets resolved; need at least 6. Failures: {failures}')
          PY
          cp .pn-evidence/asset-manifest.json public/assets/hearthmeadow-quaternius/manifest.json

      - name: Install PlayCanvas dependencies
        run: npm install --save-exact playcanvas@2.21.1 @playcanvas/react@0.11.5

      - name: Generate isolated Hearthmeadow route
        shell: bash
        run: |
          mkdir -p app/lab/hearthmeadow-playcanvas
          cat > app/lab/hearthmeadow-playcanvas/page.tsx <<'EOF'
          import HearthmeadowFrame from './scene';
          export const metadata = { title: 'Hearthmeadow — PlayCanvas Spike' };
          export default function Page(){ return <main style={{margin:0,minHeight:'100svh',background:'#b8cfa5'}}><HearthmeadowFrame/></main>; }
          EOF
          cat > app/lab/hearthmeadow-playcanvas/scene.tsx <<'EOF'
          'use client';
          import {useEffect,useRef} from 'react';
          import * as pc from 'playcanvas';
          import manifest from '../../../public/assets/hearthmeadow-quaternius/manifest.json';

          type Placed={name:string,x:number,z:number,s:number,y?:number,r?:number};
          const placed:Placed[]=[
            {name:'temple',x:0,z:-5,s:1.7,r:180},{name:'town-center',x:0,z:-1.5,s:1.35,r:180},
            {name:'barracks',x:7,z:-1,s:1.4,r:-35},{name:'market',x:-4,z:0,s:1.25,r:25},
            {name:'farm',x:-7,z:4,s:1.35,r:18},{name:'house-a',x:-3,z:3,s:1.1,r:-20},
            {name:'house-b',x:3,z:3,s:1.1,r:18},{name:'houses',x:5,z:-4,s:1.05,r:-35},
            {name:'crops',x:-7,z:7,s:1.5,r:0},{name:'pine-trees',x:8,z:-7,s:1.6,r:0},
          ];
          function primitive(app:pc.Application,name:string,type:pc.PrimitiveType,pos:number[],scale:number[],color:string,rot=0){
            const e=new pc.Entity(name); e.addComponent('render',{type}); e.setPosition(pos[0],pos[1],pos[2]); e.setLocalScale(scale[0],scale[1],scale[2]); e.setEulerAngles(0,rot,0);
            const mat=new pc.StandardMaterial(); const c=new pc.Color(); c.fromString(color); mat.diffuse=c; mat.roughness=.92; mat.update(); (e.render as pc.RenderComponent).meshInstances.forEach(m=>m.material=mat); app.root.addChild(e); return e;
          }
          export default function HearthmeadowFrame(){
            const canvas=useRef<HTMLCanvasElement>(null);
            useEffect(()=>{ if(!canvas.current)return; const app=new pc.Application(canvas.current,{graphicsDeviceOptions:{antialias:true,alpha:false,powerPreference:'high-performance'}}); app.setCanvasFillMode(pc.FILLMODE_FILL_WINDOW); app.setCanvasResolution(pc.RESOLUTION_AUTO); app.scene.ambientLight=new pc.Color(.58,.61,.52); app.scene.exposure=1.15;
              const camera=new pc.Entity('camera'); camera.addComponent('camera',{clearColor:new pc.Color(.68,.79,.66),projection:pc.PROJECTION_ORTHOGRAPHIC,orthoHeight:18}); camera.setPosition(21,20,23); camera.lookAt(0,0,0); app.root.addChild(camera);
              const sun=new pc.Entity('sun'); sun.addComponent('light',{type:'directional',color:new pc.Color(1,.93,.78),intensity:1.8,castShadows:true,shadowResolution:2048}); sun.setEulerAngles(48,-35,0); app.root.addChild(sun);
              primitive(app,'ground','box',[0,-.7,0],[28,1,24],'#80985d'); primitive(app,'north-ridge','box',[0,.15,-10],[28,2.2,4],'#667c4b');
              primitive(app,'river','box',[0,-.22,7.7],[28,.22,3.0],'#397f8e'); primitive(app,'bank-a','box',[0,-.05,5.95],[28,.45,.7],'#9a8b58'); primitive(app,'bank-b','box',[0,-.05,9.45],[28,.45,.7],'#9a8b58');
              primitive(app,'road-a','box',[0,-.05,3.5],[2.1,.18,7.2],'#b7a578'); primitive(app,'bridge','box',[0,.15,7.7],[2.8,.5,3.8],'#6f5237'); primitive(app,'road-b','box',[0,-.05,11.4],[2.1,.18,4.5],'#b7a578');
              primitive(app,'field-a','box',[-8,-.03,5.0],[5,.16,4],'#b9a65d',8); primitive(app,'field-b','box',[-9,-.02,1.2],[4,.16,3],'#a6924f',-7);
              const assets=(manifest as any).assets as any[]; const byName=new Map(assets.map(a=>[a.name,a]));
              Promise.all(placed.map(async p=>{const item=byName.get(p.name); if(!item)return; const a=new pc.Asset(p.name,'container',{url:item.path}); app.assets.add(a); await new Promise<void>((res,rej)=>{a.once('load',()=>res());a.once('error',(e)=>rej(e));app.assets.load(a)}); const ent=(a.resource as pc.ContainerResource).instantiateRenderEntity(); ent.setPosition(p.x,p.y??0,p.z); ent.setLocalScale(p.s,p.s,p.s); ent.setEulerAngles(0,p.r??0,0); app.root.addChild(ent);})).catch(console.error);
              app.start(); const resize=()=>app.resizeCanvas(); addEventListener('resize',resize); return()=>{removeEventListener('resize',resize);app.destroy()}; },[]);
            return <section style={{position:'relative',height:'100svh',overflow:'hidden'}}><canvas ref={canvas} style={{width:'100%',height:'100%',display:'block'}}/><div style={{position:'absolute',left:'50%',top:18,transform:'translateX(-50%)',padding:'8px 16px',borderRadius:999,background:'rgba(38,46,31,.74)',color:'#fff4d6',font:'600 14px system-ui',letterSpacing:'.08em'}}>HEARTHMEADOW</div></section>;
          }
          EOF

      - name: Build and capture runtime evidence
        shell: bash
        run: |
          npm run build 2>&1 | tee .pn-evidence/build.log
          npm run start -- --hostname 127.0.0.1 --port 3000 > .pn-evidence/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..60}; do curl -fsS http://127.0.0.1:3000/lab/hearthmeadow-playcanvas >/dev/null && break; sleep 1; done
          node - <<'NODE'
          const { chromium }=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true}); for(const [name,w,h] of [['desktop',1440,900],['mobile',390,844]]){const p=await b.newPage({viewport:{width:w,height:h}});const errors=[];p.on('console',m=>{if(m.type()==='error')errors.push(m.text())});const t=Date.now();await p.goto('http://127.0.0.1:3000/lab/hearthmeadow-playcanvas',{waitUntil:'networkidle'});await p.waitForTimeout(8000);await p.screenshot({path:`.pn-evidence/${name}.png`,fullPage:true});require('fs').writeFileSync(`.pn-evidence/${name}.json`,JSON.stringify({load_ms:Date.now()-t,errors},null,2));await p.close()}await b.close()})().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Commit branch-only implementation
        shell: bash
        run: |
          git config user.name 'pixel-nations-steward[bot]'
          git config user.email 'pixel-nations-steward[bot]@users.noreply.github.com'
          git add package.json package-lock.json app/lab/hearthmeadow-playcanvas public/assets/hearthmeadow-quaternius .pn-evidence
          git commit -m 'Build PlayCanvas Hearthmeadow static frame' || true
          git push origin HEAD:spike/playcanvas-hearthmeadow-static

      - name: Upload screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playcanvas-hearthmeadow-frame-${{ github.run_id }}
          path: .pn-evidence/**
          if-no-files-found: warn
          retention-days: 30
