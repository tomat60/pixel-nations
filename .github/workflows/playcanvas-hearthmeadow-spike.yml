name: PlayCanvas Hearthmeadow Spike

on:
  workflow_dispatch:
  push:
    branches: [spike/playcanvas-hearthmeadow-static]
    paths: [.github/workflows/playcanvas-hearthmeadow-spike.yml]

permissions:
  contents: write

concurrency:
  group: playcanvas-hearthmeadow-spike
  cancel-in-progress: true

jobs:
  build-frame:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spike/playcanvas-hearthmeadow-static
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Resolve and curate Quaternius CC0 models
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf public/assets/hearthmeadow-quaternius .pn-evidence
          mkdir -p public/assets/hearthmeadow-quaternius/models .pn-evidence
          cat > /tmp/models.tsv <<'EOF'
          barracks	UXCOwRBSxx
          temple	v36uJiErXS
          farm	91wMLb9kKo
          house-a	RSwoYSLblu
          house-b	oJJIRwv6Bo
          houses	gEjAC1UvVU
          market	fmHUuX9AS3
          pine-trees	oYtDty0fR6
          crops	Ro6K0Yg7mx
          town-center	sPY1OPVCAX
          EOF
          python3 - <<'PY'
          import html,json,re,subprocess,hashlib,zipfile
          from pathlib import Path
          from urllib.parse import unquote
          out=Path('public/assets/hearthmeadow-quaternius/models'); evidence=Path('.pn-evidence')
          url_rx=re.compile(r'https?://[^\s"\'<>\\]+',re.I); manifest=[]; failures=[]
          for line in Path('/tmp/models.tsv').read_text().splitlines():
              name,mid=line.split('\t'); texts=[]
              for idx,u in enumerate([f'https://r.jina.ai/http://poly.pizza/m/{mid}',f'https://poly.pizza/m/{mid}',f'https://api.poly.pizza/v1/model/{mid}',f'https://api.poly.pizza/model/{mid}',f'https://poly.pizza/api/model/{mid}']):
                  p=Path('/tmp')/f'{name}-{idx}.txt'; subprocess.run(['curl','-L','--silent','--show-error','--max-time','45','-A','Mozilla/5.0',u,'-o',str(p)],check=False)
                  if p.exists(): texts.append((u,p.read_text(errors='replace')))
              candidates=[]
              for source,text in texts:
                  decoded=html.unescape(text)
                  for raw in url_rx.findall(decoded):
                      url=unquote(raw).replace('\\u0026','&').replace('\\/','/').rstrip('.,);]}')
                      low=url.lower()
                      if any(x in low for x in ('.glb','.gltf','.zip')) and 'key-image' not in low: candidates.append((source,url))
                  for m in re.finditer(r'"(?:download|url|file|src)"\s*:\s*"([^"]+)"',decoded,re.I):
                      url=html.unescape(m.group(1)).replace('\\u0026','&').replace('\\/','/')
                      if url.startswith('http') and any(x in url.lower() for x in ('.glb','.gltf','.zip')): candidates.append((source,url))
              seen=set(); selected=None
              for source,url in candidates:
                  if url in seen: continue
                  seen.add(url); temp=Path('/tmp')/f'{name}-{len(seen)}.bin'
                  rc=subprocess.run(['curl','-L','--fail','--silent','--show-error','--max-time','120','-A','Mozilla/5.0',url,'-o',str(temp)]).returncode
                  if rc or not temp.exists() or temp.stat().st_size<1000: continue
                  head=temp.read_bytes()[:16]
                  if head[:4]==b'glTF':
                      dest=out/f'{name}.glb'; dest.write_bytes(temp.read_bytes()); selected=(source,url,dest); break
                  if head[:2]==b'PK':
                      zdir=Path('/tmp')/f'{name}-zip'; zdir.mkdir(exist_ok=True)
                      try:
                          with zipfile.ZipFile(temp) as z:z.extractall(zdir)
                      except Exception: continue
                      glbs=list(zdir.rglob('*.glb'))
                      if glbs:
                          dest=out/f'{name}.glb'; dest.write_bytes(glbs[0].read_bytes()); selected=(source,url,dest); break
              if selected:
                  source,url,dest=selected
                  manifest.append({'name':name,'model_id':mid,'creator':'Quaternius','bundle':'Ultimate Fantasy RTS','mirror':'Poly Pizza','creator_page':'https://poly.pizza/u/Quaternius','source_page':f'https://poly.pizza/m/{mid}','download_url':url,'bytes':dest.stat().st_size,'sha256':hashlib.sha256(dest.read_bytes()).hexdigest(),'path':'/assets/hearthmeadow-quaternius/models/'+dest.name})
              else: failures.append({'name':name,'model_id':mid,'candidate_count':len(seen)})
          data={'license':'CC0-1.0','bundle_page':'https://poly.pizza/bundle/Ultimate-Fantasy-RTS','assets':manifest,'failures':failures}
          Path('public/assets/hearthmeadow-quaternius/manifest.json').write_text(json.dumps(data,indent=2)+'\n')
          evidence.joinpath('asset-manifest.json').write_text(json.dumps(data,indent=2)+'\n')
          Path('public/assets/hearthmeadow-quaternius/PROVENANCE.md').write_text('# Hearthmeadow asset provenance\n\n- Creator: Quaternius\n- Bundle: Ultimate Fantasy RTS\n- Mirror: Poly Pizza verified Quaternius creator profile\n- License: CC0 / Public Domain\n- Each included GLB has its source URL, byte size and SHA-256 in `manifest.json`.\n')
          if len(manifest)<8: raise SystemExit(f'Only {len(manifest)} valid GLBs; need 8. {failures}')
          PY
          sha256sum public/assets/hearthmeadow-quaternius/models/*.glb > public/assets/hearthmeadow-quaternius/SHA256SUMS.txt

      - name: Install runtime dependencies
        run: npm install --save-exact playcanvas@2.21.1 @playcanvas/react@0.11.5

      - name: Generate isolated Hearthmeadow route
        shell: bash
        run: |
          mkdir -p app/lab/hearthmeadow-playcanvas
          cat > app/lab/hearthmeadow-playcanvas/page.tsx <<'EOF'
          import HearthmeadowFrame from './scene';
          export const metadata={title:'Hearthmeadow — PlayCanvas Spike'};
          export default function Page(){return <HearthmeadowFrame/>}
          EOF
          cat > app/lab/hearthmeadow-playcanvas/scene.tsx <<'EOF'
          'use client';
          import {useEffect,useRef} from 'react';
          import * as pc from 'playcanvas';
          type AssetRow={name:string;path:string};
          type Placed={name:string;x:number;z:number;s:number;r:number};
          const placed:Placed[]=[
            {name:'temple',x:0,z:-6,s:1.65,r:180},{name:'town-center',x:0,z:-1.5,s:1.3,r:180},
            {name:'barracks',x:7.3,z:-1.3,s:1.35,r:-30},{name:'market',x:-4.5,z:.2,s:1.2,r:25},
            {name:'farm',x:-7.6,z:4.2,s:1.3,r:15},{name:'house-a',x:-3.3,z:3.2,s:1.05,r:-18},
            {name:'house-b',x:3.1,z:3.0,s:1.05,r:18},{name:'houses',x:5.2,z:-4.1,s:1.0,r:-35},
            {name:'crops',x:-8,z:7,s:1.45,r:0},{name:'pine-trees',x:9,z:-7,s:1.55,r:0},
          ];
          function makeMat(hex:string){const m=new pc.StandardMaterial();const c=new pc.Color();c.fromString(hex);m.diffuse=c;m.roughness=.9;m.update();return m}
          function box(app:pc.Application,name:string,pos:[number,number,number],scale:[number,number,number],hex:string,rot=0){const e=new pc.Entity(name);e.addComponent('render',{type:'box'});e.setPosition(...pos);e.setLocalScale(...scale);e.setEulerAngles(0,rot,0);for(const mi of e.render!.meshInstances)mi.material=makeMat(hex);app.root.addChild(e);return e}
          export default function HearthmeadowFrame(){const ref=useRef<HTMLCanvasElement>(null);useEffect(()=>{let disposed=false;let app:pc.Application|undefined;(async()=>{
            const canvas=ref.current;if(!canvas)return;app=new pc.Application(canvas,{graphicsDeviceOptions:{antialias:true,alpha:false,powerPreference:'high-performance'}});app.setCanvasFillMode(pc.FILLMODE_FILL_WINDOW);app.setCanvasResolution(pc.RESOLUTION_AUTO);app.scene.ambientLight=new pc.Color(.55,.58,.50);app.scene.exposure=1.12;
            const cam=new pc.Entity('camera');cam.addComponent('camera',{clearColor:new pc.Color(.69,.79,.70),projection:pc.PROJECTION_ORTHOGRAPHIC,orthoHeight:19,farClip:120});cam.setPosition(22,21,25);cam.lookAt(0,0,0);app.root.addChild(cam);
            const sun=new pc.Entity('sun');sun.addComponent('light',{type:'directional',color:new pc.Color(1,.94,.80),intensity:1.75,castShadows:true,shadowResolution:2048});sun.setEulerAngles(48,-35,0);app.root.addChild(sun);
            box(app,'basin',[0,-.72,0],[30,1.1,25],'#829a61');box(app,'ridge',[0,.15,-10.8],[30,2.2,4.2],'#607849');
            box(app,'river',[0,-.35,8],[30,.26,3.1],'#397f90');box(app,'bank-n',[0,-.08,6.2],[30,.5,.7],'#8d8255');box(app,'bank-s',[0,-.08,9.8],[30,.5,.7],'#8d8255');
            box(app,'road-n',[0,-.04,3.2],[2.2,.18,7.7],'#b5a274');box(app,'road-s',[0,-.04,12],[2.2,.18,5.0],'#b5a274');
            box(app,'field-a',[-8,-.03,4.7],[5.5,.15,4.2],'#b4a25b',8);box(app,'field-b',[8.5,-.03,4.8],[5,.15,3.6],'#a9934e',-7);
            for(let i=-4;i<=4;i++)box(app,'plank'+i,[i*.55,.12,8],[.46,.22,3.9],'#6b4d31');for(const x of [-2.7,2.7])for(const z of [6.3,9.7])box(app,'post',[x,.65,z],[.22,1.5,.22],'#533a25');
            const manifest=await fetch('/assets/hearthmeadow-quaternius/manifest.json').then(r=>r.json()) as {assets:AssetRow[]};const map=new Map(manifest.assets.map(a=>[a.name,a.path]));
            await Promise.all(placed.map(async p=>{const url=map.get(p.name);if(!url||!app)return;const a=new pc.Asset(p.name,'container',{url});app.assets.add(a);await new Promise<void>((res,rej)=>{a.once('load',()=>res());a.once('error',rej);app!.assets.load(a)});if(disposed||!app)return;const e=(a.resource as pc.ContainerResource).instantiateRenderEntity();e.setPosition(p.x,0,p.z);e.setEulerAngles(0,p.r,0);e.setLocalScale(p.s,p.s,p.s);app.root.addChild(e)}));
            app.start();const resize=()=>app?.resizeCanvas();addEventListener('resize',resize);resize();
          })().catch(console.error);return()=>{disposed=true;app?.destroy()}},[]);return <main style={{position:'fixed',inset:0,overflow:'hidden',background:'#a9c4ae'}}><canvas ref={ref} style={{width:'100%',height:'100%',display:'block'}}/><div style={{position:'absolute',left:'50%',bottom:'5%',transform:'translateX(-50%)',padding:'8px 16px',borderRadius:999,background:'rgba(35,43,29,.78)',border:'1px solid rgba(239,209,141,.55)',color:'#fff0c8',font:'700 12px var(--font-syne)',letterSpacing:'.12em'}}>HEARTHMEADOW</div></main>}
          EOF

      - name: Build and capture runtime evidence
        shell: bash
        run: |
          npm run build 2>&1 | tee .pn-evidence/build.log
          npx playwright install --with-deps chromium
          npm run start -- --hostname 127.0.0.1 --port 3000 > .pn-evidence/server.log 2>&1 &
          SERVER_PID=$!; trap 'kill $SERVER_PID || true' EXIT
          for i in {1..60};do curl -fsS http://127.0.0.1:3000/lab/hearthmeadow-playcanvas >/dev/null&&break;sleep 1;done
          node <<'NODE'
          const {chromium}=require('playwright'),fs=require('fs');(async()=>{const b=await chromium.launch({headless:true});for(const [n,w,h] of [['desktop',1440,900],['mobile',390,844]]){const p=await b.newPage({viewport:{width:w,height:h}}),errors=[];p.on('console',m=>{if(m.type()==='error')errors.push(m.text())});p.on('pageerror',e=>errors.push(String(e)));const t=Date.now();await p.goto('http://127.0.0.1:3000/lab/hearthmeadow-playcanvas',{waitUntil:'networkidle'});await p.waitForTimeout(6000);await p.screenshot({path:`.pn-evidence/${n}.png`,fullPage:true});fs.writeFileSync(`.pn-evidence/${n}.json`,JSON.stringify({load_ms:Date.now()-t,errors},null,2));await p.close()}await b.close()})().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Commit branch-only implementation
        shell: bash
        run: |
          git config user.name 'pixel-nations-steward[bot]'
          git config user.email 'pixel-nations-steward[bot]@users.noreply.github.com'
          git add package.json package-lock.json app/lab/hearthmeadow-playcanvas public/assets/hearthmeadow-quaternius .pn-evidence
          git commit -m 'Build PlayCanvas Hearthmeadow static frame'
          git push origin HEAD:spike/playcanvas-hearthmeadow-static

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playcanvas-hearthmeadow-static-${{ github.run_id }}
          path: .pn-evidence/**
          if-no-files-found: warn
          retention-days: 30
