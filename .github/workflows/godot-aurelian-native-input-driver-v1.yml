name: Godot Aurelian Deferred Input Ready V1

on:
  pull_request:
    branches: [main]
    paths:
      - "game/scenes/aurelian/playable_aurelian_entry_v1.gd"
      - ".github/scripts/aurelian-state-gated-native-input.sh"
      - ".github/workflows/godot-aurelian-native-input-driver-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-aurelian-deferred-input-ready-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.1"
  GODOT_RELEASE: "4.7.1-stable"
  GODOT_BIN: "/tmp/godot/Godot_v4.7.1-stable_linux.x86_64"
  EVIDENCE_DIR: "evidence/godot-aurelian-deferred-input-ready-v1"

jobs:
  prove-deferred-input-ready:
    name: Prove three clean readiness-gated native traversals
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Record exact scope
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_DIR}"
          git rev-parse HEAD | tee "${EVIDENCE_DIR}/exact-head.txt"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
            git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD" | tee "${EVIDENCE_DIR}/changed-files.txt"
            test "$(wc -l < "${EVIDENCE_DIR}/changed-files.txt")" = "3"
            grep -Fx "game/scenes/aurelian/playable_aurelian_entry_v1.gd" "${EVIDENCE_DIR}/changed-files.txt"
            grep -Fx ".github/scripts/aurelian-state-gated-native-input.sh" "${EVIDENCE_DIR}/changed-files.txt"
            grep -Fx ".github/workflows/godot-aurelian-native-input-driver-v1.yml" "${EVIDENCE_DIR}/changed-files.txt"
          fi

      - name: Install pinned Godot runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends unzip libgl1 xvfb xdotool >/dev/null
          mkdir -p /tmp/godot
          curl -fsSL --retry 4 --retry-all-errors --connect-timeout 20 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" \
            -o /tmp/godot/godot.zip
          unzip -q /tmp/godot/godot.zip -d /tmp/godot
          chmod +x "${GODOT_BIN}"
          "${GODOT_BIN}" --version | tee "${EVIDENCE_DIR}/godot-version.txt"

      - name: Import exact product head
        run: |
          set -euo pipefail
          "${GODOT_BIN}" --headless --path game --editor --quit > "${EVIDENCE_DIR}/godot-import.log" 2>&1
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Blender path is invalid" "${EVIDENCE_DIR}/godot-import.log"; then
            cat "${EVIDENCE_DIR}/godot-import.log"
            exit 1
          fi

      - name: Prove three clean normal-input traversals
        run: |
          set -euo pipefail
          export DISPLAY=:99
          Xvfb :99 -screen 0 1440x900x24 > "${EVIDENCE_DIR}/xvfb.log" 2>&1 &
          XVFB_PID=$!
          trap 'kill "$XVFB_PID" || true' EXIT
          for attempt in $(seq 1 40); do
            xdotool getdisplaygeometry >/dev/null 2>&1 && break
            sleep 0.25
          done
          xdotool getdisplaygeometry >/dev/null

          cat > "${EVIDENCE_DIR}/sequence.txt" <<'SEQUENCE'
          Return|world_trade_selected|PLAYABLE_AURELIAN_ENTRY_STATE=world_trade_selected
          Right|map_east_route_selected|PLAYABLE_AURELIAN_ENTRY_STATE=map_east_route_selected
          Return|map_east_route_claimed|PLAYABLE_AURELIAN_ENTRY_STATE=map_east_route_claimed
          Right|village_claimed|PLAYABLE_AURELIAN_ENTRY_STATE=village_claimed
          Return|village_founded|PLAYABLE_AURELIAN_ENTRY_STATE=village_founded
          Return|village_developed|PLAYABLE_AURELIAN_ENTRY_STATE=village_developed
          Left|map_east_route_claimed|PLAYABLE_AURELIAN_ENTRY_STATE=map_east_route_claimed
          Return|map_east_route_connected|PLAYABLE_AURELIAN_ENTRY_STATE=map_east_route_connected
          Right|village_developed|PLAYABLE_AURELIAN_ENTRY_STATE=village_developed
          Return|village_trade_dispatched|PLAYABLE_AURELIAN_ENTRY_STATE=village_trade_dispatched
          Left|map_east_route_in_use|PLAYABLE_AURELIAN_ENTRY_STATE=map_east_route_in_use
          Right|village_trade_dispatched|PLAYABLE_AURELIAN_ENTRY_STATE=village_trade_dispatched
          Return|village_city_chartered|PLAYABLE_AURELIAN_ENTRY_STATE=village_city_chartered
          Left|map_greenvale_city|PLAYABLE_AURELIAN_ENTRY_STATE=map_greenvale_city
          Left|world_first_city_recognized|PLAYABLE_AURELIAN_ENTRY_STATE=world_first_city_recognized
          Return|world_first_nation_founded|PLAYABLE_AURELIAN_ENTRY_STATE=world_first_nation_founded
          Down|world_first_nation_founded|AURELIAN_NATIONAL_DIRECTION_INSPECT=EXPAND
          Down|world_first_nation_founded|AURELIAN_NATIONAL_DIRECTION_INSPECT=FRONTIER
          Up|world_first_nation_founded|AURELIAN_NATIONAL_DIRECTION_INSPECT=EXPAND
          Return|world_first_nation_founded|AURELIAN_FIRST_NATIONAL_DIRECTION_COMMITMENT=EXPAND
          Right|map_aurelian_homeland|PLAYABLE_AURELIAN_ENTRY_STATE=map_aurelian_homeland
          Right|village_greenvale_capital|PLAYABLE_AURELIAN_ENTRY_STATE=village_greenvale_capital
          Return|village_national_mandate_started|PLAYABLE_AURELIAN_ENTRY_STATE=village_national_mandate_started
          Left|map_national_mandate_active|PLAYABLE_AURELIAN_ENTRY_STATE=map_national_mandate_active
          Right|village_national_mandate_started|PLAYABLE_AURELIAN_ENTRY_STATE=village_national_mandate_started
          Return|village_aurelian_imperial_capital|PLAYABLE_AURELIAN_ENTRY_STATE=village_aurelian_imperial_capital
          Left|map_aurelian_imperial_heartland|PLAYABLE_AURELIAN_ENTRY_STATE=map_aurelian_imperial_heartland
          Left|world_first_empire_proclaimed|PLAYABLE_AURELIAN_ENTRY_STATE=world_first_empire_proclaimed
          Return|world_river_surge_crisis|PLAYABLE_AURELIAN_ENTRY_STATE=world_river_surge_crisis
          Right|map_river_surge_response_loci|PLAYABLE_AURELIAN_ENTRY_STATE=map_river_surge_response_loci
          Right|village_river_surge_response_pending|PLAYABLE_AURELIAN_ENTRY_STATE=village_river_surge_response_pending
          Down|village_river_surge_response_pending|AURELIAN_IMPERIAL_CRISIS_RESPONSE_INSPECT=KEEP_EAST_BRIDGE_OPEN
          Return|village_aurelian_imperial_capital_bridge_response|PLAYABLE_AURELIAN_ENTRY_STATE=village_aurelian_imperial_capital_bridge_response
          Left|map_aurelian_imperial_heartland_bridge_response|PLAYABLE_AURELIAN_ENTRY_STATE=map_aurelian_imperial_heartland_bridge_response
          Left|world_aurelian_river_surge_bridge_response|PLAYABLE_AURELIAN_ENTRY_STATE=world_aurelian_river_surge_bridge_response
          Return|world_first_rival_countermove|PLAYABLE_AURELIAN_ENTRY_STATE=world_first_rival_countermove
          Right|map_first_rival_countermove_greenvale|PLAYABLE_AURELIAN_ENTRY_STATE=map_first_rival_countermove_greenvale
          Right|village_first_rival_response_pending|PLAYABLE_AURELIAN_ENTRY_STATE=village_first_rival_response_pending
          Down|village_first_rival_response_pending|AURELIAN_FIRST_RIVAL_RESPONSE_INSPECT=NEGOTIATE_PASSAGE
          Return|village_first_rival_response_negotiate_passage|PLAYABLE_AURELIAN_ENTRY_STATE=village_first_rival_response_negotiate_passage
          Left|map_first_rival_response_negotiate_passage|PLAYABLE_AURELIAN_ENTRY_STATE=map_first_rival_response_negotiate_passage
          Left|world_first_rival_response_negotiate_passage|PLAYABLE_AURELIAN_ENTRY_STATE=world_first_rival_response_negotiate_passage
          Return|world_first_frontier_payoff_east_bridge_revealed|PLAYABLE_AURELIAN_ENTRY_STATE=world_first_frontier_payoff_east_bridge_revealed
          Right|map_first_frontier_payoff_east_bridge_pending|PLAYABLE_AURELIAN_ENTRY_STATE=map_first_frontier_payoff_east_bridge_pending
          Right|village_first_frontier_payoff_east_bridge_pending|PLAYABLE_AURELIAN_ENTRY_STATE=village_first_frontier_payoff_east_bridge_pending
          Return|village_first_frontier_payoff_east_bridge_secured|PLAYABLE_AURELIAN_ENTRY_STATE=village_first_frontier_payoff_east_bridge_secured
          Left|map_first_frontier_payoff_east_bridge_secured|PLAYABLE_AURELIAN_ENTRY_STATE=map_first_frontier_payoff_east_bridge_secured
          Left|world_first_frontier_legacy_east_bridge_complete|PLAYABLE_AURELIAN_ENTRY_STATE=world_first_frontier_legacy_east_bridge_complete
          Return|world_first_imperial_expansion_north_ridge_direction|PLAYABLE_AURELIAN_ENTRY_STATE=world_first_imperial_expansion_north_ridge_direction
          Right|map_first_imperial_expansion_north_ridge_available|PLAYABLE_AURELIAN_ENTRY_STATE=map_first_imperial_expansion_north_ridge_available
          Return|map_first_imperial_expansion_north_ridge_inspected|PLAYABLE_AURELIAN_ENTRY_STATE=map_first_imperial_expansion_north_ridge_inspected
          Return|map_first_imperial_expansion_two_lands_claimed|PLAYABLE_AURELIAN_ENTRY_STATE=map_first_imperial_expansion_two_lands_claimed
          Right|village_first_imperial_expansion_greenvale_capital_two_lands|PLAYABLE_AURELIAN_ENTRY_STATE=village_first_imperial_expansion_greenvale_capital_two_lands
          Left|map_first_imperial_expansion_two_lands_claimed|PLAYABLE_AURELIAN_ENTRY_STATE=map_first_imperial_expansion_two_lands_claimed
          Left|world_first_imperial_expansion_two_land_footprint|PLAYABLE_AURELIAN_ENTRY_STATE=world_first_imperial_expansion_two_land_footprint
          SEQUENCE
          test "$(grep -c '^[A-Za-z]' "${EVIDENCE_DIR}/sequence.txt")" = "55"

          for run in 1 2 3; do
            RUN_DIR="${EVIDENCE_DIR}/run-${run}"
            RUN_HOME="${RUNNER_TEMP}/aurelian-deferred-ready-run-${run}"
            mkdir -p "$RUN_DIR" "$RUN_HOME"
            env -u AURELIAN_FULL_PROGRESSION -u AURELIAN_PLAYABLE_EVIDENCE_STATE -u AURELIAN_CAPTURE_PLAYABLE_ENTRY \
              HOME="$RUN_HOME" stdbuf -oL -eL "${GODOT_BIN}" --path game --audio-driver Dummy --rendering-method gl_compatibility \
              res://scenes/aurelian/playable_aurelian_entry_v1.tscn > "$RUN_DIR/runtime.log" 2>&1 &
            APP_PID=$!
            WINDOW_ID=""
            for attempt in $(seq 1 120); do
              WINDOW_ID="$(xdotool search --onlyvisible --name 'Pixel Nations' 2>/dev/null | head -n1 || true)"
              [ -n "$WINDOW_ID" ] && break
              sleep 0.25
            done
            test -n "$WINDOW_ID"
            AURELIAN_WINDOW_ID="$WINDOW_ID" AURELIAN_LOG="$RUN_DIR/runtime.log" \
              AURELIAN_APP_PID="$APP_PID" AURELIAN_SEQUENCE="${EVIDENCE_DIR}/sequence.txt" \
              AURELIAN_TRACE="$RUN_DIR/driver.log" \
              bash .github/scripts/aurelian-state-gated-native-input.sh
            grep -F "PLAYABLE_AURELIAN_ENTRY_STATE=world_first_imperial_expansion_two_land_footprint" "$RUN_DIR/runtime.log"
            grep -F "PLAYABLE_AURELIAN_INPUT_READY=world_first_imperial_expansion_two_land_footprint" "$RUN_DIR/runtime.log"
            test "$(grep -c ' status=SEND ' "$RUN_DIR/driver.log")" = "55"
            grep -F "status=PASS actions=55 final_state=world_first_imperial_expansion_two_land_footprint" "$RUN_DIR/driver.log"
            kill "$APP_PID" || true
            wait "$APP_PID" || true
          done

      - name: Validate fail-closed evidence
        run: |
          set -euo pipefail
          for run in 1 2 3; do
            grep -F "status=PASS actions=55" "${EVIDENCE_DIR}/run-${run}/driver.log"
            test "$(grep -c ' status=READY ' "${EVIDENCE_DIR}/run-${run}/driver.log")" = "55"
            if grep -F "status=FAIL" "${EVIDENCE_DIR}/run-${run}/driver.log"; then exit 1; fi
          done
          EXACT_HEAD="$(cat "${EVIDENCE_DIR}/exact-head.txt")"
          cat > "${EVIDENCE_DIR}/result-manifest.json" <<EOF
          {
            "contract": "GODOT_AURELIAN_DEFERRED_INPUT_READY_V1",
            "exact_head": "${EXACT_HEAD}",
            "input_mode": "normal_os_keyboard",
            "readiness_barrier": "deferred_then_later_process_frame",
            "clean_profile_runs": 3,
            "actions_per_run": 55,
            "final_state": "world_first_imperial_expansion_two_land_footprint",
            "claimed_lands": ["east_route", "north_ridge"],
            "product_behavior_changed": false
          }
          EOF
          sha256sum "${EVIDENCE_DIR}"/*.txt "${EVIDENCE_DIR}"/*.json "${EVIDENCE_DIR}"/run-*/*.log | tee "${EVIDENCE_DIR}/evidence-sha256sums.txt"
          echo "GODOT_AURELIAN_DEFERRED_INPUT_READY_V1=PASS"

      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-aurelian-deferred-input-ready-v1-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 7
