name: Pixel Nations playable macOS and Linux exports

on:
  push:
    branches:
      - "steward/playable-core-delivery-*"
      - main
    paths:
      - "tools/playable_core/**"
      - "game/core/**"
      - "game/integration/**"
      - ".github/workflows/godot-playable-cloud-export.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pn-playable-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playable-exports:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT_RELEASE: "4.7.1-stable"
      GODOT_VERSION: "4.7.1.stable"
      GODOT_BIN: "/tmp/pn-godot/Godot_v4.7.1-stable_linux.x86_64"
      PN_GAME: "/tmp/pn-playable-scene-sources"
    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Record exact Git source
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p dist
          git rev-parse HEAD | tee dist/commit-sha.txt
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m py_compile tools/playable_core/materialize_scene_sources.py

      - name: Install pinned Godot editor and templates
        shell: bash
        timeout-minutes: 12
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xvfb unzip libgl1 libvulkan1 mesa-vulkan-drivers libx11-6 libxcursor1 libxinerama1 libxi6 libxrandr2 > /dev/null
          mkdir -p /tmp/pn-godot
          curl -fsSL --retry 3 --connect-timeout 15 "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" -o /tmp/pn-godot/editor.zip
          curl -fsSL --retry 3 --connect-timeout 15 "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz" -o /tmp/pn-godot/templates.tpz
          unzip -q /tmp/pn-godot/editor.zip -d /tmp/pn-godot
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version | tee dist/godot-version.txt
          unzip -q /tmp/pn-godot/templates.tpz -d /tmp/pn-godot/extracted
          export_dir="$HOME/.local/share/godot/export_templates/$GODOT_VERSION"
          mkdir -p "$export_dir"
          cp -a /tmp/pn-godot/extracted/templates/. "$export_dir/"
          test -s "$export_dir/macos.zip"
          test -s "$export_dir/linux_release.x86_64"

      - name: Reconstruct pinned scene and verify redistribution notices
        shell: bash
        timeout-minutes: 10
        run: |
          set -Eeuo pipefail
          python3 tools/playable_core/materialize_scene_sources.py --output "$PN_GAME" > dist/source.log
          grep -F "PN_PLAYABLE_SOURCE_BRIDGE=PASS" dist/source.log
          test -s "$PN_GAME/pixel_nations/playable_core_runtime.gd"
          test -s "$PN_GAME/third_party/the-free-game/LICENSE"
          test -s "$PN_GAME/third_party/the-free-game/licenses/CC-BY-4.0.txt"
          test -s "$PN_GAME/THIRD_PARTY_CHANGES.md"
          cp -a "$PN_GAME/third_party" dist/third_party
          cp "$PN_GAME/THIRD_PARTY_CHANGES.md" dist/THIRD_PARTY_CHANGES.md
          cp "$PN_GAME/LICENSE" dist/OpenGS_LICENSE.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("/tmp/pn-playable-scene-sources")
          manifest = json.loads((p / ".pn-source-manifest.json").read_text())
          assert manifest["missing_pixel_nations_transform"] is False
          assert manifest["unresolved_release_assets"] == []
          assert manifest["playable_scene"] == "res://pixel_nations/playable_core.tscn"
          assert 'config/name="Pixel Nations"' in (p / "project.godot").read_text()
          assert 'config/name="Open Grand Strategy"' not in (p / "project.godot").read_text()
          assert 'renderer/rendering_method="gl_compatibility"' in (p / "project.godot").read_text()
          PY

      - name: Add minimal export presets to transformed project
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "$PN_GAME/export_presets.cfg" <<'CFG'
          [preset.0]

          name="Playable Linux"
          platform="Linux"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter="*.txt,*.json,*.csv,*.tsv,*.dat"
          exclude_filter=""
          export_path="build/Pixel-Nations-Linux.x86_64"
          patches=PackedStringArray()
          encryption_include_filters=""
          encryption_exclude_filters=""
          seed=0
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          debug/export_console_wrapper=1
          binary_format/embed_pck=false
          binary_format/architecture="x86_64"
          texture_format/s3tc_bptc=true
          texture_format/etc2_astc=false

          [preset.1]

          name="Playable macOS"
          platform="macOS"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter="*.txt,*.json,*.csv,*.tsv,*.dat"
          exclude_filter=""
          export_path="build/Pixel-Nations-macOS.zip"
          patches=PackedStringArray()
          encryption_include_filters=""
          encryption_exclude_filters=""
          seed=0
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.1.options]

          binary_format/architecture="universal"
          custom_template/debug=""
          custom_template/release=""
          application/bundle_identifier="games.pixelnations.playable"
          application/short_version="0.1.0"
          application/version="0.1.0"
          application/copyright="Pixel Nations — third party notices are included"
          # Godot built-in ad-hoc signature: no Apple certificate, no notarization.
          codesign/codesign=1
          CFG
          # Universal macOS exports require ARM texture compression support.
          # Enable it before importing donor assets (not merely in preset metadata).
          cat >> "$PN_GAME/project.godot" <<'CFG'
          
          [rendering]
          
          # Prefer wide-compatibility OpenGL on Intel Macs that crash at window startup.
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          renderer/rendering_method.web="gl_compatibility"
          textures/vram_compression/import_etc2_astc=true
          CFG
          mkdir -p "$PN_GAME/build"

      - name: Import exact transformed project and export runnable binaries
        shell: bash
        timeout-minutes: 8
        run: |
          set -Eeuo pipefail
          "$GODOT_BIN" --headless --path "$PN_GAME" --editor --quit > dist/import.log 2>&1 || { cat dist/import.log; exit 1; }
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' dist/import.log; then exit 1; fi
          "$GODOT_BIN" --headless --path "$PN_GAME" --export-release "Playable Linux" "$PN_GAME/build/Pixel-Nations-Linux.x86_64" > dist/linux-export.log 2>&1 || { cat dist/linux-export.log; exit 1; }
          "$GODOT_BIN" --headless --path "$PN_GAME" --export-release "Playable macOS" "$PN_GAME/build/Pixel-Nations-macOS.zip" > dist/macos-export.log 2>&1 || { cat dist/macos-export.log; exit 1; }
          test -s "$PN_GAME/build/Pixel-Nations-Linux.x86_64"
          test -s "$PN_GAME/build/Pixel-Nations-Linux.pck"
          test -s "$PN_GAME/build/Pixel-Nations-macOS.zip"
          unzip -l "$PN_GAME/build/Pixel-Nations-macOS.zip" | tee dist/macos-contents.txt
          grep -F "Pixel Nations.app/Contents/MacOS/Pixel Nations" dist/macos-contents.txt
          if grep -F "Open Grand Strategy" dist/macos-contents.txt; then exit 1; fi
          cp "$PN_GAME/build/Pixel-Nations-Linux.x86_64" dist/
          cp "$PN_GAME/build/Pixel-Nations-Linux.pck" dist/
          cp "$PN_GAME/build/Pixel-Nations-macOS.zip" dist/
          cat > dist/macOS-FIRST-RUN.txt <<'TXT'
          Pixel Nations - development preview (macOS)
          This macOS Universal application is ad-hoc signed, NOT Apple-notarized.
          macOS may require Finder > Control-click > Open or System Settings > Privacy & Security > Open Anyway.
          Verify the source before overriding a macOS security warning.
          Godot export minimum: Intel macOS 11.0 / Apple Silicon macOS 13.0.
          Mac CI verifies the signed app and binary startup; owner's own hardware test remains necessary.
          Never disable Gatekeeper globally.
          TXT
          chmod +x dist/Pixel-Nations-Linux.x86_64
          file dist/Pixel-Nations-Linux.x86_64
          sha256sum dist/Pixel-Nations-* > dist/SHA256SUMS
          echo "PN_PLAYABLE_DESKTOP_EXPORTS=PASS"

      - name: Smoke packaged game headlessly, then with compatibility renderer
        shell: bash
        timeout-minutes: 4
        run: |
          set -Eeuo pipefail
          cd "$PN_GAME/build"
          # Real exported ELF+PCK, not the Godot editor or transformed source.
          timeout -s TERM 55s "./Pixel-Nations-Linux.x86_64" \
            --headless --audio-driver Dummy --quit-after 10 \
            > "$GITHUB_WORKSPACE/dist/linux-headless-smoke.log" 2>&1 || {
              cat "$GITHUB_WORKSPACE/dist/linux-headless-smoke.log"
              echo "PN_PACKED_HEADLESS_SMOKE=FAIL"
              exit 1
            }
          cat "$GITHUB_WORKSPACE/dist/linux-headless-smoke.log"
          # Short --quit-after can emit Godot's engine teardown-only ResourceDB warning.
          # Keep the full log; reject all other engine and GDScript runtime errors.
          if grep -vE '^ERROR: [0-9]+ resources still in use at exit' "$GITHUB_WORKSPACE/dist/linux-headless-smoke.log" | grep -E 'SCRIPT ERROR|ERROR:|Parse Error'; then exit 1; fi
          grep -F "PN_PLAYABLE_RUNTIME_READY=PASS" "$GITHUB_WORKSPACE/dist/linux-headless-smoke.log"
          echo "PN_PACKED_HEADLESS_SMOKE=PASS"
          # Software OpenGL fallback on GitHub's GPU-less Linux runner.
          timeout -s TERM 115s xvfb-run -a -s "-screen 0 1600x1000x24" env LIBGL_ALWAYS_SOFTWARE=1 \
            "./Pixel-Nations-Linux.x86_64" --audio-driver Dummy \
            --rendering-method gl_compatibility --resolution 1280x720 --quit-after 10 \
            > "$GITHUB_WORKSPACE/dist/linux-launch-smoke.log" 2>&1 || {
              cat "$GITHUB_WORKSPACE/dist/linux-launch-smoke.log"
              echo "PN_PACKED_WINDOW_SMOKE=FAIL"
              exit 1
            }
          cat "$GITHUB_WORKSPACE/dist/linux-launch-smoke.log"
          if grep -vE '^ERROR: [0-9]+ resources still in use at exit' "$GITHUB_WORKSPACE/dist/linux-launch-smoke.log" | grep -E 'SCRIPT ERROR|ERROR:|Parse Error'; then exit 1; fi
          grep -F "PN_PLAYABLE_RUNTIME_READY=PASS" "$GITHUB_WORKSPACE/dist/linux-launch-smoke.log"
          echo "PN_PACKED_WINDOW_SMOKE=PASS"

      - name: Always attach build proof and runnable distribution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pn-playable-desktop-${{ github.sha }}-${{ github.run_id }}
          path: dist/**
          if-no-files-found: warn
          retention-days: 7

  macos-signed-app-smoke:
    name: Verify signed macOS bundle and start actual app
    needs: playable-exports
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Download exact-run Godot distribution
        uses: actions/download-artifact@v4
        with:
          name: pn-playable-desktop-${{ github.sha }}-${{ github.run_id }}
          path: dist

      - name: Verify signature and Universal architectures
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p macos-qa
          unzip -q dist/Pixel-Nations-macOS.zip -d macos-qa
          test -s "macos-qa/Pixel Nations.app/Contents/MacOS/Pixel Nations"
          test -s "macos-qa/Pixel Nations.app/Contents/Resources/Pixel Nations.pck"
          plutil -lint "macos-qa/Pixel Nations.app/Contents/Info.plist" | tee dist/macos-plist-verify.log
          file "macos-qa/Pixel Nations.app/Contents/MacOS/Pixel Nations" | tee dist/macos-arch-verify.log
          lipo -archs "macos-qa/Pixel Nations.app/Contents/MacOS/Pixel Nations" | tee -a dist/macos-arch-verify.log
          grep -q arm64 dist/macos-arch-verify.log
          grep -q x86_64 dist/macos-arch-verify.log
          codesign --verify --deep --strict --verbose=2 "macos-qa/Pixel Nations.app" 2>&1 | tee dist/macos-codesign-verify.log
          codesign -dv --verbose=4 "macos-qa/Pixel Nations.app" 2>&1 | tee -a dist/macos-codesign-verify.log
          grep -qi 'Signature=adhoc' dist/macos-codesign-verify.log
          echo "PN_MACOS_BUNDLE_SIGNATURE=PASS" | tee dist/macos-signature-status.txt

      - name: Boot packaged game on macOS runner
        shell: bash
        run: |
          set -Eeuo pipefail
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          exe = Path("macos-qa/Pixel Nations.app/Contents/MacOS/Pixel Nations")
          args = [str(exe.resolve()), "--headless", "--audio-driver", "Dummy", "--quit-after", "15"]
          try:
              run = subprocess.run(args, capture_output=True, text=True, timeout=75)
          except subprocess.TimeoutExpired as exc:
              Path("dist/macos-launch-smoke.log").write_text(str(exc))
              raise SystemExit("PN_MACOS_APP_START=TIMEOUT")
          log = (run.stdout or "") + "\n" + (run.stderr or "")
          Path("dist/macos-launch-smoke.log").write_text(log)
          print(log[:9000])
          # Short forced quit may emit the engine's known resource cleanup warning.
          fatal = [
              line for line in log.splitlines()
              if ("SCRIPT ERROR" in line or "Parse Error" in line
                  or ("ERROR:" in line and "resources still in use at exit" not in line))
          ]
          if run.returncode != 0 or fatal or "PN_PLAYABLE_RUNTIME_READY=PASS" not in log:
              print(f"exit={run.returncode}; errors={fatal[:6]}", file=sys.stderr)
              raise SystemExit("PN_MACOS_APP_START=FAIL")
          print("PN_MACOS_APP_START=PASS")
          PY

      - name: Preserve macOS proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pn-macos-runtime-qa-${{ github.sha }}-${{ github.run_id }}
          path: dist/macos-*
          if-no-files-found: warn
          retention-days: 7

  macos-intel-26-gui-start:
    name: Intel macOS 26 GUI start (never headless)
    needs: playable-exports
    runs-on: macos-26-intel
    timeout-minutes: 9
    steps:
      - name: Fetch exact build output
        uses: actions/download-artifact@v4
        with:
          name: pn-playable-desktop-${{ github.sha }}-${{ github.run_id }}
          path: dist

      - name: Start actual windowed Intel app under macOS 26
        shell: bash
        run: |
          set -Eeuo pipefail
          uname -m | tee dist/intel-macos26-platform.txt
          sw_vers | tee -a dist/intel-macos26-platform.txt
          test "$(uname -m)" = "x86_64"
          mkdir -p mac-intel-app
          unzip -q dist/Pixel-Nations-macOS.zip -d mac-intel-app
          APP="mac-intel-app/Pixel Nations.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import time

          exe = Path("mac-intel-app/Pixel Nations.app/Contents/MacOS/Pixel Nations")
          cmd = [str(exe.resolve()), "--rendering-method", "gl_compatibility",
                 "--rendering-driver", "opengl3", "--audio-driver", "Dummy",
                 "--resolution", "1280x720", "--quit-after", "90"]
          t0 = time.monotonic()
          try:
              proc = subprocess.run(cmd, capture_output=True, text=True, timeout=85)
          except subprocess.TimeoutExpired as e:
              Path("dist/intel-macos26-gui.log").write_text("TIMEOUT\n" + str(e))
              raise SystemExit("PN_INTEL_MACOS26_GUI=TIMEOUT")
          duration = time.monotonic() - t0
          log = "ARGS=" + repr(cmd[1:]) + "\nDURATION=%.2f\n" % duration + \
                (proc.stdout or "") + "\n" + (proc.stderr or "")
          Path("dist/intel-macos26-gui.log").write_text(log)
          print(log[-12000:])
          assert proc.returncode == 0, "Windowed app crashed, exit=%s" % proc.returncode
          assert "PN_PLAYABLE_RUNTIME_READY=PASS" in log, "Runtime did not start"
          assert not any(x in log for x in ("SCRIPT ERROR", "Parse Error", "SIGFPE", "Floating point exception")), "Runtime error"
          assert duration > 0.15, "App exited too quickly for windowed initialization"
          print("PN_INTEL_MACOS26_GUI=PASS")
          PY

      - name: Preserve Intel GUI diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pn-intel-macos26-gui-${{ github.sha }}-${{ github.run_id }}
          path: dist/intel-macos26-*
          retention-days: 7
          if-no-files-found: warn
