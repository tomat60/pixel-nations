name: P7 Post-Imperial Continuity Audit

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  p7-post-imperial-continuity-audit:
    name: Audit post-imperial action discoverability
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Audit P7 post-imperial continuity
        run: node scripts/qa-p7-post-imperial-continuity-audit.mjs

      - name: Upload P7 audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixel-nations-p7-post-imperial-continuity-audit
          path: public/qa/p7-post-imperial-continuity-audit
          if-no-files-found: error
          retention-days: 7
