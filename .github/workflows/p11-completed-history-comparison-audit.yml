name: P11 Completed History Comparison Audit

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  p11-completed-history-comparison-audit:
    name: Audit completed-history comparison access
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Audit completed-history comparison access
        run: node scripts/qa-p11-completed-history-comparison-audit.mjs

      - name: Upload P11 completed-history comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixel-nations-p11-completed-history-comparison-audit
          path: public/qa/p11-completed-history-comparison-audit
          if-no-files-found: error
          retention-days: 7
