name: Pixel Nations Deterministic Patch Runner

on:
  issues:
    types:
      - opened
      - edited

permissions:
  contents: write
  issues: write
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  apply-owner-patch:
    if: >-
      github.event.issue.user.login == 'tomat60' &&
      startsWith(github.event.issue.title, 'TERMINAL PATCH:')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Parse and validate directive
        id: directive
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          echo "parse directive" > /tmp/pixel-nations-stage
          exec > >(tee /tmp/pixel-nations-parse.log) 2>&1
          node <<'NODE'
          const fs = require('node:fs');
          const body = process.env.ISSUE_BODY ?? '';

          function field(name) {
            const match = body.match(new RegExp(`^${name}:\\s*(.+)$`, 'mi'));
            if (!match) throw new Error(`Missing ${name}: field.`);
            return match[1].trim();
          }

          function optionalField(name) {
            return body.match(new RegExp(`^${name}:\\s*(.+)$`, 'mi'))?.[1]?.trim() ?? '';
          }

          function safePath(value, label) {
            if (!/^[A-Za-z0-9._/-]+$/.test(value) || value.startsWith('/') || value.includes('..') || value.includes('//')) {
              throw new Error(`${label} contains an unsafe path.`);
            }
          }

          const base = field('Base');
          const branch = field('Branch');
          const patchSha = field('Patch SHA256').toLowerCase();
          const allowed = field('Allowed files').split(',').map((value) => value.trim()).filter(Boolean);
          const sourceRef = optionalField('Patch source ref');
          const sourcePath = optionalField('Patch source path');
          const patchMatch = body.match(/BEGIN_PATCH_GZIP_BASE64\s*([A-Za-z0-9+/=\r\n]+?)\s*END_PATCH_GZIP_BASE64/i);

          if (!/^[0-9a-f]{40}$/.test(base)) throw new Error('Base must be a full 40-character commit SHA.');
          if (!/^gpt56\/[a-z0-9._/-]+$/.test(branch)) throw new Error('Branch must use the gpt56/ namespace and safe characters.');
          if (!/^[0-9a-f]{64}$/.test(patchSha)) throw new Error('Patch SHA256 must be 64 lowercase hexadecimal characters.');
          if (!allowed.length || allowed.length > 12) throw new Error('Allowed files must contain between 1 and 12 paths.');
          for (const path of allowed) safePath(path, 'Allowed files');

          const usesRepositorySource = Boolean(sourceRef || sourcePath);
          if (usesRepositorySource && !(sourceRef && sourcePath)) {
            throw new Error('Patch source ref and Patch source path must be supplied together.');
          }
          if (usesRepositorySource) {
            if (!/^[A-Za-z0-9._/-]+$/.test(sourceRef) || sourceRef.startsWith('/') || sourceRef.includes('..') || sourceRef.includes('//') || sourceRef.includes('@{')) {
              throw new Error('Patch source ref is unsafe.');
            }
            safePath(sourcePath, 'Patch source path');
          } else {
            if (!patchMatch) throw new Error('Missing repository patch source or inline patch payload markers.');
            const encoded = patchMatch[1].replace(/\s+/g, '');
            if (!encoded || !/^[A-Za-z0-9+/=]+$/.test(encoded)) throw new Error('Patch payload is not valid base64 text.');
            fs.writeFileSync('/tmp/pixel-nations-patch.b64', encoded);
          }

          fs.writeFileSync('/tmp/pixel-nations-allowed-files.txt', `${allowed.join('\n')}\n`);
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `base=${base}\nbranch=${branch}\npatch_sha=${patchSha}\nsource_ref=${sourceRef}\nsource_path=${sourcePath}\n`,
          );
          NODE

      - name: Verify immutable base
        env:
          BASE_SHA: ${{ steps.directive.outputs.base }}
          BRANCH_NAME: ${{ steps.directive.outputs.branch }}
        run: |
          echo "verify immutable base" > /tmp/pixel-nations-stage
          exec > >(tee /tmp/pixel-nations-base.log) 2>&1
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          if git ls-remote --exit-code --heads origin "$BRANCH_NAME" >/dev/null 2>&1; then
            echo "Target branch already exists: $BRANCH_NAME" >&2
            exit 1
          fi
          git checkout --detach "$BASE_SHA"

      - name: Load repository patch source
        if: ${{ steps.directive.outputs.source_ref != '' }}
        env:
          SOURCE_REF: ${{ steps.directive.outputs.source_ref }}
          SOURCE_PATH: ${{ steps.directive.outputs.source_path }}
        run: |
          echo "load repository patch source" > /tmp/pixel-nations-stage
          exec > >(tee /tmp/pixel-nations-source.log) 2>&1
          git fetch origin "$SOURCE_REF" --no-tags
          git show "FETCH_HEAD:$SOURCE_PATH" > /tmp/pixel-nations-patch.b64
          test -s /tmp/pixel-nations-patch.b64

      - name: Decode, authenticate and allowlist patch
        env:
          EXPECTED_PATCH_SHA: ${{ steps.directive.outputs.patch_sha }}
        run: |
          echo "decode, authenticate and allowlist patch" > /tmp/pixel-nations-stage
          exec > >(tee /tmp/pixel-nations-validation.log) 2>&1
          tr -d '[:space:]' < /tmp/pixel-nations-patch.b64 | base64 --decode | gzip --decompress --stdout > /tmp/pixel-nations.patch
          ACTUAL_PATCH_SHA="$(sha256sum /tmp/pixel-nations.patch | cut -d' ' -f1)"
          echo "Expected patch SHA: $EXPECTED_PATCH_SHA"
          echo "Actual patch SHA:   $ACTUAL_PATCH_SHA"
          test "$ACTUAL_PATCH_SHA" = "$EXPECTED_PATCH_SHA"

          git apply --numstat /tmp/pixel-nations.patch | cut -f3- > /tmp/pixel-nations-changed-files.txt
          test -s /tmp/pixel-nations-changed-files.txt
          echo "Changed files:"
          cat /tmp/pixel-nations-changed-files.txt
          while IFS= read -r path; do
            grep -Fxq "$path" /tmp/pixel-nations-allowed-files.txt || {
              echo "Patch touches forbidden path: $path" >&2
              exit 1
            }
          done < /tmp/pixel-nations-changed-files.txt

          git apply --check /tmp/pixel-nations.patch
          git apply /tmp/pixel-nations.patch
          git diff --check

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: |
          echo "install dependencies" > /tmp/pixel-nations-stage
          npm ci 2>&1 | tee /tmp/pixel-nations-install.log

      - name: Build patched product
        run: |
          echo "build patched product" > /tmp/pixel-nations-stage
          npm run build 2>&1 | tee /tmp/pixel-nations-build.log

      - name: Commit bounded branch
        env:
          BRANCH_NAME: ${{ steps.directive.outputs.branch }}
        run: |
          echo "commit bounded branch" > /tmp/pixel-nations-stage
          exec > >(tee /tmp/pixel-nations-commit.log) 2>&1
          git switch -c "$BRANCH_NAME"
          git config user.name "pixel-nations-patch-runner[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: apply bounded deterministic product patch"
          git push --set-upstream origin "$BRANCH_NAME"

      - name: Open draft pull request
        id: pull_request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ steps.directive.outputs.branch }}
          BASE_SHA: ${{ steps.directive.outputs.base }}
          PATCH_SHA: ${{ steps.directive.outputs.patch_sha }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          echo "open draft pull request" > /tmp/pixel-nations-stage
          exec > >(tee /tmp/pixel-nations-pr.log) 2>&1
          PR_URL="$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$BRANCH_NAME" \
            --draft \
            --title "Build P2 settlement stewardship loop" \
            --body "Deterministic owner-authorized patch from issue #${ISSUE_NUMBER}.\n\nBase: \`${BASE_SHA}\`\nPatch SHA-256: \`${PATCH_SHA}\`\n\nThe Patch Runner validated the immutable base, exact payload digest, changed-file allowlist, git applicability, whitespace and production build before creating this draft. Merge remains blocked for Product Lead review and complete gameplay QA.")"
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Report success
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_URL: ${{ steps.pull_request.outputs.url }}
          BRANCH_NAME: ${{ steps.directive.outputs.branch }}
        run: |
          HEAD_SHA="$(git rev-parse HEAD)"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "DETERMINISTIC_PATCH_APPLIED\n\n- Draft PR: ${PR_URL}\n- Branch: \`${BRANCH_NAME}\`\n- Head: \`${HEAD_SHA}\`\n- Build: passed\n\nMerge remains blocked pending full CI, complete Play Visual QA and direct evidence review."

      - name: Report exact failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          STAGE="$(cat /tmp/pixel-nations-stage 2>/dev/null || echo 'checkout or unknown')"
          LOG_FILE=""
          case "$STAGE" in
            "parse directive") LOG_FILE=/tmp/pixel-nations-parse.log ;;
            "verify immutable base") LOG_FILE=/tmp/pixel-nations-base.log ;;
            "load repository patch source") LOG_FILE=/tmp/pixel-nations-source.log ;;
            "decode, authenticate and allowlist patch") LOG_FILE=/tmp/pixel-nations-validation.log ;;
            "install dependencies") LOG_FILE=/tmp/pixel-nations-install.log ;;
            "build patched product") LOG_FILE=/tmp/pixel-nations-build.log ;;
            "commit bounded branch") LOG_FILE=/tmp/pixel-nations-commit.log ;;
            "open draft pull request") LOG_FILE=/tmp/pixel-nations-pr.log ;;
          esac
          if [ -n "$LOG_FILE" ] && [ -f "$LOG_FILE" ]; then
            tail -n 80 "$LOG_FILE" | sed -E 's/\x1B\[[0-9;]*[A-Za-z]//g' > /tmp/pixel-nations-failure-tail.log
          else
            echo "No step log was captured." > /tmp/pixel-nations-failure-tail.log
          fi
          {
            echo "DETERMINISTIC_PATCH_REJECTED"
            echo
            echo "Failed stage: \`$STAGE\`"
            echo
            echo '```text'
            cat /tmp/pixel-nations-failure-tail.log
            echo '```'
            echo
            echo "No accepted product branch or draft PR was created by this run. Correct only the reported failure before retrying."
          } > /tmp/pixel-nations-failure-comment.md
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/pixel-nations-failure-comment.md
