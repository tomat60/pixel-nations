name: Godot Aurelian World Scale Reveal W1

on:
  push:
    branches:
      - agent/world-scale-reveal-v1
    paths:
      - "game/scenes/aurelian/world_scale_reveal_v1.gd"
      - "game/scenes/aurelian/world_scale_reveal_v1.tscn"
      - "game/tests/aurelian_world_scale_reveal_v1_test.gd"
      - ".github/workflows/godot-aurelian-world-scale-reveal-w1.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_RELEASE: "4.7.1-stable"
  GODOT_BIN: "/tmp/godot/Godot_v4.7.1-stable_linux.x86_64"
  EVIDENCE_DIR: "evidence/world-scale-reveal-w1"
  ACCEPTED_LOCAL_SHA256: "ed31f7ca430e759494c42ade2d57ad40de4d0334772e7f34d8726a4529bf44cc"

jobs:
  world-scale-w1:
    name: Render local sector atlas scale proof
    runs-on: ubuntu-latest
    timeout-minutes: 16

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record exact head
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_DIR}"
          git rev-parse HEAD | tee "${EVIDENCE_DIR}/exact-head.txt"
          test -s game/assets/aurelian-basin/export/aurelian_authored_terrain_v1.glb

      - name: Download pinned Godot
        timeout-minutes: 5
        run: |
          set -euo pipefail
          rm -rf /tmp/godot
          mkdir -p /tmp/godot
          curl -fsSL --retry 4 --retry-all-errors --connect-timeout 20 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" \
            -o /tmp/godot/godot.zip
          unzip -q /tmp/godot/godot.zip -d /tmp/godot
          chmod +x "${GODOT_BIN}"
          "${GODOT_BIN}" --version | tee "${EVIDENCE_DIR}/godot-version.txt"
          python3 -m pip install --disable-pip-version-check --quiet --user pillow

      - name: Import and run focused contracts
        timeout-minutes: 4
        run: |
          set -euo pipefail
          "${GODOT_BIN}" --headless --path game --editor --quit > "${EVIDENCE_DIR}/godot-import.log" 2>&1 || {
            cat "${EVIDENCE_DIR}/godot-import.log"; exit 1;
          }
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Blender path is invalid" "${EVIDENCE_DIR}/godot-import.log"; then
            cat "${EVIDENCE_DIR}/godot-import.log"
            exit 1
          fi
          "${GODOT_BIN}" --headless --path game --script res://tests/aurelian_full_progression_clarity_composition_v1_test.gd \
            > "${EVIDENCE_DIR}/clarity-regression.log" 2>&1
          grep -F "AURELIAN_FULL_PROGRESSION_CLARITY_COMPOSITION_V1_TEST: PASS" "${EVIDENCE_DIR}/clarity-regression.log"
          "${GODOT_BIN}" --headless --path game --script res://tests/aurelian_world_scale_reveal_v1_test.gd \
            > "${EVIDENCE_DIR}/world-scale-contract.log" 2>&1
          grep -F "AURELIAN_WORLD_SCALE_REVEAL_V1_TEST: PASS" "${EVIDENCE_DIR}/world-scale-contract.log"

      - name: Capture three physical scale frames
        timeout-minutes: 6
        run: |
          set -euo pipefail
          for level in local sector atlas; do
            capture_dir="${EVIDENCE_DIR}/tmp-${level}"
            mkdir -p "$capture_dir"
            timeout 80s xvfb-run -a -s "-screen 0 1600x1000x24" env \
              AURELIAN_EVIDENCE_DIR="$PWD/$capture_dir" \
              AURELIAN_CAPTURE_PRESET=world \
              AURELIAN_PROGRESSION_STAGE=empire \
              AURELIAN_WORLD_SCALE_LEVEL="$level" \
              "${GODOT_BIN}" --path game --audio-driver Dummy --rendering-method gl_compatibility \
              res://scenes/aurelian/world_scale_reveal_v1.tscn \
              > "${EVIDENCE_DIR}/${level}.log" 2>&1
            grep -F "WORLD_SCALE_REVEAL_V1_READY=${level}" "${EVIDENCE_DIR}/${level}.log"
            test -s "$capture_dir/world-1440x900.png"
            cp "$capture_dir/world-1440x900.png" "${EVIDENCE_DIR}/${level}-1440x900.png"
            rm -rf "$capture_dir"
          done
          test "$(find "${EVIDENCE_DIR}" -maxdepth 1 -name '*-1440x900.png' | wc -l)" -eq 3

      - name: Prove local continuity and build review sheet
        timeout-minutes: 2
        run: |
          set -euo pipefail
          local_sha="$(sha256sum "${EVIDENCE_DIR}/local-1440x900.png" | awk '{print $1}')"
          test "$local_sha" = "${ACCEPTED_LOCAL_SHA256}"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from PIL import Image, ImageChops, ImageStat

          root = Path(os.environ['EVIDENCE_DIR'])
          levels = ['local','sector','atlas']
          images = {}
          report = {}
          for level in levels:
              path = root / f'{level}-1440x900.png'
              image = Image.open(path).convert('RGB')
              if image.size != (1440,900):
                  raise SystemExit(f'{level}: wrong size {image.size}')
              variance = sum(ImageStat.Stat(image).var) / 3.0
              if path.stat().st_size < 65000 or variance < 35.0:
                  raise SystemExit(f'{level}: weak frame bytes={path.stat().st_size} variance={variance:.2f}')
              images[level] = image
              report[level] = {
                  'bytes': path.stat().st_size,
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                  'variance': round(variance, 3),
              }

          def changed(a,b):
              aa = a.resize((240,150)); bb = b.resize((240,150))
              diff = ImageChops.difference(aa,bb)
              return sum(1 for pixel in diff.getdata() if pixel != (0,0,0))

          local_sector = changed(images['local'], images['sector'])
          sector_atlas = changed(images['sector'], images['atlas'])
          if local_sector < 3500 or sector_atlas < 3500:
              raise SystemExit(f'scale deltas too small: local-sector={local_sector}, sector-atlas={sector_atlas}')

          cell_w, cell_h = 480,300
          sheet = Image.new('RGB',(cell_w*3,cell_h),(38,43,42))
          for index,level in enumerate(levels):
              sheet.paste(images[level].resize((cell_w,cell_h)),(index*cell_w,0))
          sheet.save(root/'w1-unlabeled-local-sector-atlas.jpg',quality=95)

          qa = {
              'status': 'PASS_DETERMINISTIC_ONLY_PENDING_DIRECT_W1_REVIEW',
              'exact_head': (root/'exact-head.txt').read_text().strip(),
              'accepted_local_sha256': os.environ['ACCEPTED_LOCAL_SHA256'],
              'frames': report,
              'changed_sample_pixels': {
                  'local_to_sector': local_sector,
                  'sector_to_atlas': sector_atlas,
              },
              'direct_review_required': True,
          }
          (root/'w1-qa.json').write_text(json.dumps(qa,indent=2)+'\n')
          print('AURELIAN_WORLD_SCALE_REVEAL_W1_DETERMINISTIC=PASS')
          PY

      - name: Upload W1 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-scale-reveal-w1-${{ github.sha }}
          path: evidence/world-scale-reveal-w1
          if-no-files-found: error
          retention-days: 3
