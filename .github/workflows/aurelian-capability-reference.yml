name: Aurelian Capability-First Reference

on:
  pull_request:
    branches: [main]
    paths:
      - "game/scenes/aurelian/reference_v1/**"
      - "game/tests/aurelian_reference_v1_test.gd"
      - ".github/workflows/aurelian-capability-reference.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.1"
  GODOT_RELEASE: "4.7.1-stable"
  GODOT_BIN: "/tmp/godot/Godot_v4.7.1-stable_linux.x86_64"
  EVIDENCE: "evidence/aurelian-capability-reference-v1"

jobs:
  reference:
    name: Build and capture capability-first Aurelian reference
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install render dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends unzip xvfb ffmpeg python3-pil libegl1 libgl1-mesa-dri libglx-mesa0 libx11-6 libxcursor1 libxinerama1 libxi6 libxrandr2 >/dev/null

      - name: Download pinned Godot
        run: |
          set -euo pipefail
          mkdir -p /tmp/godot "${EVIDENCE}"
          curl -fsSL --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" -o /tmp/godot/godot.zip
          unzip -q /tmp/godot/godot.zip -d /tmp/godot
          chmod +x "${GODOT_BIN}"
          echo "GODOT_VERSION=$(${GODOT_BIN} --version)"

      - name: Import Godot and run deterministic tests
        run: |
          set -euo pipefail
          "${GODOT_BIN}" --headless --path game --editor --quit > "${EVIDENCE}/godot-import.log" 2>&1 || { cat "${EVIDENCE}/godot-import.log"; exit 1; }
          ! grep -E "SCRIPT ERROR|Parse Error|Failed to load script" "${EVIDENCE}/godot-import.log"
          "${GODOT_BIN}" --headless --path game --script res://tests/run_all.gd > "${EVIDENCE}/godot-tests.log" 2>&1
          grep -F "PIXEL_NATIONS_GODOT_TESTS: PASS" "${EVIDENCE}/godot-tests.log"
          "${GODOT_BIN}" --headless --path game --script res://tests/aurelian_reference_v1_test.gd > "${EVIDENCE}/reference-test.log" 2>&1
          grep -F "AURELIAN_REFERENCE_V1_TEST: PASS" "${EVIDENCE}/reference-test.log"

      - name: Capture Village Map and World stills
        run: |
          set -euo pipefail
          for preset in village map world; do
            timeout 70s xvfb-run -a -s "-screen 0 1440x810x24" env \
              LIBGL_ALWAYS_SOFTWARE=1 \
              AURELIAN_EVIDENCE_DIR="$PWD/${EVIDENCE}" \
              AURELIAN_CAPTURE_PRESET="$preset" \
              AURELIAN_SETTLEMENT_STAGE=2 \
              "${GODOT_BIN}" --path game --audio-driver Dummy --rendering-method gl_compatibility \
              --resolution 1440x810 --position 0,0 --disable-vsync \
              res://scenes/aurelian/reference_v1/aurelian_reference_v1.tscn \
              > "${EVIDENCE}/${preset}.log" 2>&1
            grep -F "AURELIAN_REFERENCE_STILL=${preset}:" "${EVIDENCE}/${preset}.log"
            test -s "${EVIDENCE}/${preset}-1440x900.png"
            mv "${EVIDENCE}/${preset}-1440x900.png" "${EVIDENCE}/${preset}-1440x810.png"
          done

      - name: Capture three settlement visual states
        run: |
          set -euo pipefail
          for stage in 0 1 2; do
            timeout 70s xvfb-run -a -s "-screen 0 1440x810x24" env \
              LIBGL_ALWAYS_SOFTWARE=1 \
              AURELIAN_EVIDENCE_DIR="$PWD/${EVIDENCE}" \
              AURELIAN_CAPTURE_PRESET=village \
              AURELIAN_CAPTURE_SUFFIX="stage${stage}" \
              AURELIAN_SETTLEMENT_STAGE="$stage" \
              "${GODOT_BIN}" --path game --audio-driver Dummy --rendering-method gl_compatibility \
              --resolution 1440x810 --position 0,0 --disable-vsync \
              res://scenes/aurelian/reference_v1/aurelian_reference_v1.tscn \
              > "${EVIDENCE}/village-stage${stage}.log" 2>&1
            test -s "${EVIDENCE}/village-stage${stage}-1440x900.png"
            mv "${EVIDENCE}/village-stage${stage}-1440x900.png" "${EVIDENCE}/village-stage${stage}-1440x810.png"
          done

      - name: Capture raw Village Map World camera sequence
        run: |
          set -euo pipefail
          timeout 100s xvfb-run -a -s "-screen 0 1280x720x24" env \
            LIBGL_ALWAYS_SOFTWARE=1 \
            AURELIAN_EVIDENCE_DIR="$PWD/${EVIDENCE}" \
            AURELIAN_CAPTURE_SEQUENCE=1 \
            AURELIAN_SETTLEMENT_STAGE=2 \
            "${GODOT_BIN}" --path game --audio-driver Dummy --rendering-method gl_compatibility \
            --resolution 1280x720 --position 0,0 --disable-vsync --fixed-fps 30 \
            --write-movie "$PWD/${EVIDENCE}/camera-switch.avi" \
            res://scenes/aurelian/reference_v1/aurelian_reference_v1.tscn \
            > "${EVIDENCE}/camera-switch.log" 2>&1
          grep -F "AURELIAN_REFERENCE_SEQUENCE_COMPLETE=540" "${EVIDENCE}/camera-switch.log"
          test -s "${EVIDENCE}/camera-switch.avi"
          ffmpeg -y -loglevel error -i "${EVIDENCE}/camera-switch.avi" -c:v libx264 -pix_fmt yuv420p "${EVIDENCE}/camera-switch.mp4"

      - name: Validate exact-head visual evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from PIL import Image, ImageChops, ImageStat

          root = Path(os.environ['EVIDENCE'])
          report = {}

          def inspect(path):
              image = Image.open(path).convert('RGB')
              if image.size != (1440, 810):
                  raise SystemExit(f'{path.name}: wrong size {image.size}')
              stat = ImageStat.Stat(image)
              variance = sum(stat.var) / 3
              colors = len(set(image.resize((240, 135)).getdata()))
              if path.stat().st_size < 50000 or variance < 70 or colors < 220:
                  raise SystemExit(f'{path.name}: weak/blank evidence bytes={path.stat().st_size} variance={variance:.2f} colors={colors}')
              return image, {'bytes': path.stat().st_size, 'variance': round(variance, 3), 'sample_colors': colors}

          primary = {}
          for preset in ('village', 'map', 'world'):
              image, metrics = inspect(root / f'{preset}-1440x810.png')
              primary[preset] = image
              report[preset] = metrics

          stages = {}
          for stage in (0, 1, 2):
              image, metrics = inspect(root / f'village-stage{stage}-1440x810.png')
              stages[stage] = image
              report[f'stage{stage}'] = metrics

          def mean_delta(a, b):
              diff = ImageChops.difference(a, b)
              stat = ImageStat.Stat(diff)
              return sum(stat.mean) / 3

          view_deltas = {
              'village_map': mean_delta(primary['village'], primary['map']),
              'map_world': mean_delta(primary['map'], primary['world']),
          }
          stage_deltas = {
              'stage0_stage1': mean_delta(stages[0], stages[1]),
              'stage1_stage2': mean_delta(stages[1], stages[2]),
              'stage0_stage2': mean_delta(stages[0], stages[2]),
          }
          if min(view_deltas.values()) < 3.0:
              raise SystemExit(f'camera views insufficiently distinct: {view_deltas}')
          if stage_deltas['stage0_stage2'] < 0.25:
              raise SystemExit(f'settlement progression insufficiently visible: {stage_deltas}')

          manifest = json.loads((root / 'transform-manifest.json').read_text())
          provenance = json.loads((root / 'provenance-manifest.json').read_text())
          if manifest['contract'] != 'AURELIAN_CAPABILITY_REFERENCE_V1':
              raise SystemExit('wrong transform contract')
          if manifest['bridge']['endpoints'] != [[455, 340], [575, 340]]:
              raise SystemExit('bridge contract drift')
          if len(manifest['river_centerline']) != 9:
              raise SystemExit('river contract drift')
          if set(manifest['cameras']) != {'village', 'map', 'world'}:
              raise SystemExit('camera contract drift')
          samples = manifest['terrain_samples']
          if not samples['NorthRidge'] > samples['FieldsPlains']:
              raise SystemExit('terrain hierarchy drift: ridge')
          if not samples['SouthMarsh'] < samples['GreenvaleOrigin']:
              raise SystemExit('terrain hierarchy drift: marsh')
          if provenance['asset_cost_usd'] != 0 or provenance['external_visual_assets'] != []:
              raise SystemExit('unexpected asset/cost drift')

          qa = {
              'status': 'PASS',
              'stills': report,
              'view_mean_deltas': {k: round(v, 3) for k, v in view_deltas.items()},
              'settlement_mean_deltas': {k: round(v, 3) for k, v in stage_deltas.items()},
              'topology_manifest': 'PASS',
              'provenance_manifest': 'PASS',
          }
          (root / 'evidence-qa.json').write_text(json.dumps(qa, indent=2) + '\n')
          print('AURELIAN_CAPABILITY_REFERENCE_QA=PASS')
          PY
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "${EVIDENCE}/camera-switch.mp4" | tee "${EVIDENCE}/video-duration.txt"
          python3 - <<'PY'
          import os
          from pathlib import Path
          duration = float(Path(os.environ['EVIDENCE'], 'video-duration.txt').read_text().strip())
          if not 17.5 <= duration <= 18.5:
              raise SystemExit(f'wrong video duration: {duration}')
          print('AURELIAN_CAPABILITY_REFERENCE_VIDEO=PASS')
          PY

      - name: Upload exact-head Aurelian reference evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurelian-capability-reference-${{ github.sha }}
          path: evidence/aurelian-capability-reference-v1/**
          if-no-files-found: error
          retention-days: 30
