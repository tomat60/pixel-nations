name: Aurelian Map Integration QA

on:
  pull_request:
    branches: [main]
    paths:
      - app/play/components/MapStage.tsx
      - public/art/aurelian-basin-map-desktop.png
      - public/art/aurelian-basin-map-portrait.png
      - scripts/qa-aurelian-map-integration.mjs
      - .github/workflows/aurelian-map-integration-qa.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify-map-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Capture desktop and mobile map flow
        run: node scripts/qa-aurelian-map-integration.mjs

      - name: Upload map integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurelian-map-integration-${{ github.run_id }}
          path: public/qa/aurelian-map-integration/**
          if-no-files-found: error
          retention-days: 14

      - name: Report scoped QA
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:316,body:`## Scoped Aurelian map QA ${context.runId}\n\n- Event SHA: \`${context.sha}\`\n- Job status: \`${{ job.status }}\`\n- Artifact: \`aurelian-map-integration-${context.runId}\`\n- Covers desktop/mobile first run, land selection, claim access and Village transition.\n\nNo merge, deployment, payment or MAX was used.`})
