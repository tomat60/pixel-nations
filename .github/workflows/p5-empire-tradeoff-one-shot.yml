name: P5 Empire Tradeoff One Shot

on:
  push:
    branches:
      - gpt56/p5-empire-founding-tradeoff
    paths:
      - .github/workflows/p5-empire-tradeoff-one-shot.yml

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  apply-p5:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: gpt56/p5-empire-founding-tradeoff
          fetch-depth: 0

      - name: Apply exact P5 replacements
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'app/play/lib/play-state.ts';
          let source = fs.readFileSync(path, 'utf8');
          const replacements = [
            [
              '{ id: "aurelian-compact", label: "Aurelian Compact", title: "The Aurelian Compact", short: "Bind city, frontier and nation into one imperial charter.", effect: "Empire seed formed through civic legitimacy." }',
              '{ id: "aurelian-compact", label: "Aurelian Compact", title: "The Aurelian Compact", short: "Bind city, frontier and nation into one imperial charter.", effect: "+1 Stability; civic consolidation strengthens the imperial charter." }',
            ],
            [
              '{ id: "frontier-crown", label: "Frontier Crown", title: "The Frontier Crown", short: "Crown the secured pass as the first imperial mandate.", effect: "Empire seed formed through expansion legitimacy." }',
              '{ id: "frontier-crown", label: "Frontier Crown", title: "The Frontier Crown", short: "Crown the secured pass as the first imperial mandate.", effect: "+2 Influence, -1 Stability; outward mobilization trades cohesion for reach." }',
            ],
            [
              '{ id: "basin-hegemony", label: "Basin Hegemony", title: "The Basin Hegemony", short: "Declare the basin a protected imperial sphere.", effect: "Empire seed formed through territorial legitimacy." }',
              '{ id: "basin-hegemony", label: "Basin Hegemony", title: "The Basin Hegemony", short: "Declare the basin a protected imperial sphere.", effect: "+1 Prosperity, -1 Influence; organized prosperity spends political capital." }',
            ],
            [
              '      return { ...resetEmpireCrisis(state), empireDeclarationId: declaration.id, courtCaseDecisionId: null, rivalResponseDecisionId: null, conflictEscalationDecisionId: null, standoffDecisionId: null, imperialTurnActionIds: [], view: "council", chronicle: pushChronicle(state, "Empire declared", `${declaration.title}: ${declaration.effect}`), lastEvent: `Empire declared: ${declaration.title}.` };',
              '      const stabilityDelta = declaration.id === "aurelian-compact" ? 1 : declaration.id === "frontier-crown" ? -1 : 0;\n      const prosperityDelta = declaration.id === "basin-hegemony" ? 1 : 0;\n      const influenceDelta = declaration.id === "frontier-crown" ? 2 : declaration.id === "basin-hegemony" ? -1 : 0;\n      return { ...resetEmpireCrisis(state), empireDeclarationId: declaration.id, courtCaseDecisionId: null, rivalResponseDecisionId: null, conflictEscalationDecisionId: null, standoffDecisionId: null, imperialTurnActionIds: [], resources: { ...state.resources, influence: Math.max(0, state.resources.influence + influenceDelta) }, settlementStability: clampSettlementStability(state.settlementStability + stabilityDelta), settlementProsperity: clampSettlementProsperity(state.settlementProsperity + prosperityDelta), view: "council", chronicle: pushChronicle(state, "Empire declared", `${declaration.title}: ${declaration.effect}`), lastEvent: `Empire declared: ${declaration.title}. ${declaration.effect}` };',
            ],
          ];
          for (const [before, after] of replacements) {
            const first = source.indexOf(before);
            if (first === -1 || source.indexOf(before, first + 1) !== -1) throw new Error(`Expected exactly one source match: ${before.slice(0, 80)}`);
            source = source.replace(before, after);
          }
          fs.writeFileSync(path, source);
          NODE
          rm .github/workflows/p5-empire-tradeoff-one-shot.yml
          git diff --check
          git diff -- app/play/lib/play-state.ts

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build product
        run: npm run build

      - name: Commit product-only P5 result
        run: |
          test ! -f .github/workflows/p5-empire-tradeoff-one-shot.yml
          git diff --name-only > /tmp/changed.txt
          printf '%s\n' 'app/play/lib/play-state.ts' > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          git config user.name "pixel-nations-steward"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: make empire declaration inherit national tradeoff"
          git push origin HEAD:gpt56/p5-empire-founding-tradeoff
