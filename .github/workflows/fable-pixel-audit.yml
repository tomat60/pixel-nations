name: Fable Pixel Audit

on:
  workflow_dispatch:
    inputs:
      task_type:
        description: "Fable test to run"
        required: true
        default: "repo_audit"
        type: choice
        options:
          - weak_prompt
          - repo_audit
          - cursor_prompts
          - full_play_redesign
      anthropic_model:
        description: "Anthropic model ID"
        required: true
        default: "claude-fable-5"
        type: string
      max_input_tokens:
        description: "Abort if estimated input tokens exceed this cap"
        required: true
        default: "25000"
        type: string
      max_output_tokens:
        description: "Max tokens returned by model"
        required: true
        default: "5000"
        type: string
      max_estimated_cost_usd:
        description: "Abort before API call if estimated max cost exceeds this"
        required: true
        default: "0.75"
        type: string
      temperature:
        description: "Deprecated for Fable; kept only for UI compatibility and ignored by script"
        required: true
        default: "0.2"
        type: string
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

defaults:
  run:
    shell: bash

jobs:
  fable-pixel-audit:
    name: Fable Pixel Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      github.event_name != 'issues' ||
      (
        github.event.issue.user.login == 'tomat60' &&
        startsWith(github.event.issue.title, 'FABLE RUN:') &&
        (
          contains(github.event.issue.title, 'repo_audit') ||
          contains(github.event.issue.title, 'cursor_prompts') ||
          contains(github.event.issue.title, 'weak_prompt') ||
          contains(github.event.issue.title, 'full_play')
        )
      )

    steps:
      - name: Comment Fable run started
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: `Fable run started.\n\nRun: ${runUrl}`,
            });

      - name: Checkout repository read-only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run cost-capped Fable audit
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FABLE_TASK_TYPE: ${{ github.event_name == 'issues' && (contains(github.event.issue.title, 'full_play') && 'full_play_redesign' || contains(github.event.issue.title, 'cursor_prompts') && 'cursor_prompts' || contains(github.event.issue.title, 'weak_prompt') && 'weak_prompt' || 'repo_audit') || inputs.task_type }}
          ANTHROPIC_MODEL: ${{ inputs.anthropic_model || 'claude-fable-5' }}
          MAX_INPUT_TOKENS: ${{ github.event_name == 'issues' && contains(github.event.issue.title, 'full_play') && '110000' || inputs.max_input_tokens || '25000' }}
          MAX_OUTPUT_TOKENS: ${{ github.event_name == 'issues' && contains(github.event.issue.title, 'full_play') && '12000' || inputs.max_output_tokens || '5000' }}
          MAX_ESTIMATED_COST_USD: ${{ github.event_name == 'issues' && contains(github.event.issue.title, 'full_play') && '2.25' || inputs.max_estimated_cost_usd || '0.75' }}
          TEMPERATURE: ${{ inputs.temperature || '0.2' }}
          INPUT_PRICE_PER_MILLION_USD: "10"
          OUTPUT_PRICE_PER_MILLION_USD: "50"
        run: node scripts/fable-pixel-audit.mjs

      - name: Upload Fable artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fable-pixel-audit-${{ github.event_name == 'issues' && (contains(github.event.issue.title, 'full_play') && 'full_play_redesign' || contains(github.event.issue.title, 'cursor_prompts') && 'cursor_prompts' || contains(github.event.issue.title, 'weak_prompt') && 'weak_prompt' || 'repo_audit') || inputs.task_type || 'repo_audit' }}
          path: |
            fable-output/fable-pixel-audit.md
            fable-output/fable-pixel-audit-meta.json
          if-no-files-found: warn
          retention-days: 14

      - name: Comment Fable run finished
        if: always() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const status = `${{ job.status }}`;
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: `Fable run finished with status: ${status}.\n\nRun and artifacts: ${runUrl}`,
            });
