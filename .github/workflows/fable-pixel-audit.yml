name: Fable Pixel Audit

on:
  workflow_dispatch:
    inputs:
      task_type:
        description: "Fable test to run"
        required: true
        default: "repo_audit"
        type: choice
        options:
          - weak_prompt
          - repo_audit
          - cursor_prompts
      anthropic_model:
        description: "Anthropic model ID"
        required: true
        default: "claude-fable-5"
        type: string
      max_input_tokens:
        description: "Abort if estimated input tokens exceed this cap"
        required: true
        default: "25000"
        type: string
      max_output_tokens:
        description: "Max tokens returned by model"
        required: true
        default: "5000"
        type: string
      max_estimated_cost_usd:
        description: "Abort before API call if estimated max cost exceeds this"
        required: true
        default: "0.75"
        type: string
      temperature:
        description: "Deprecated for Fable; kept only for UI compatibility and ignored by script"
        required: true
        default: "0.2"
        type: string
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: read

concurrency:
  group: fable-pixel-audit-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  fable-pixel-audit:
    name: Fable Pixel Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      github.event_name != 'issues' ||
      (
        github.event.issue.user.login == 'tomat60' &&
        (
          github.event.issue.title == 'FABLE RUN: repo_audit' ||
          github.event.issue.title == 'FABLE RUN: cursor_prompts' ||
          github.event.issue.title == 'FABLE RUN: weak_prompt'
        )
      )

    steps:
      - name: Checkout repository read-only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run cost-capped Fable audit
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FABLE_TASK_TYPE: ${{ github.event_name == 'issues' && (github.event.issue.title == 'FABLE RUN: cursor_prompts' && 'cursor_prompts' || github.event.issue.title == 'FABLE RUN: weak_prompt' && 'weak_prompt' || 'repo_audit') || inputs.task_type }}
          ANTHROPIC_MODEL: ${{ inputs.anthropic_model || 'claude-fable-5' }}
          MAX_INPUT_TOKENS: ${{ inputs.max_input_tokens || '25000' }}
          MAX_OUTPUT_TOKENS: ${{ inputs.max_output_tokens || '5000' }}
          MAX_ESTIMATED_COST_USD: ${{ inputs.max_estimated_cost_usd || '0.75' }}
          TEMPERATURE: ${{ inputs.temperature || '0.2' }}
          INPUT_PRICE_PER_MILLION_USD: "10"
          OUTPUT_PRICE_PER_MILLION_USD: "50"
        run: node scripts/fable-pixel-audit.mjs

      - name: Upload Fable artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fable-pixel-audit-${{ github.event_name == 'issues' && (github.event.issue.title == 'FABLE RUN: cursor_prompts' && 'cursor_prompts' || github.event.issue.title == 'FABLE RUN: weak_prompt' && 'weak_prompt' || 'repo_audit') || inputs.task_type || 'repo_audit' }}
          path: |
            fable-output/fable-pixel-audit.md
            fable-output/fable-pixel-audit-meta.json
          if-no-files-found: warn
          retention-days: 14
