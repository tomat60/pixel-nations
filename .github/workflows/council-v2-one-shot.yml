name: Council V2 One Shot

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'visual/council-v2-governance'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual/council-v2-governance
          fetch-depth: 0

      - name: Apply exact Council V2 composition
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('app/play/components/CouncilPanel.tsx')
          text = path.read_text()
          replacements = [
            ('className="absolute bottom-[4.7rem] right-3 z-20 max-h-[calc(100%-10rem)] w-[min(560px,calc(100%-1.5rem))] overflow-auto rounded-3xl border border-amber-100/20 bg-black/66 p-3 shadow-2xl backdrop-blur-md md:bottom-[5.7rem] md:right-5 md:p-4"', 'className="absolute bottom-[4.7rem] right-3 z-20 max-h-[calc(100%-10rem)] w-[min(520px,calc(100%-1.5rem))] overflow-auto rounded-[1.75rem] border border-amber-100/22 bg-black/76 p-3 shadow-2xl backdrop-blur-xl md:bottom-[5.7rem] md:right-5 md:p-4"'),
            ('      <p className="text-[9px] font-black uppercase tracking-[0.24em] text-amber-200/65">Council chamber</p>\n      <div className="mt-1 flex items-start justify-between gap-3"><div><h2 className="text-2xl font-black text-amber-50 md:text-4xl">From land to empire</h2><p className="mt-1 text-xs leading-relaxed text-amber-50/65 md:text-sm">The demo now pushes conflict into the first visible standoff outcome.</p></div><span className="rounded-full border border-amber-200/25 bg-amber-200/10 px-3 py-1 text-[10px] font-black uppercase tracking-[0.16em] text-amber-100">{completed}/13</span></div>\n      <div className="mt-4 grid grid-cols-4 gap-2 text-center"><Metric label="Phase" value={phase} /><Metric label="People" value={population} /><Metric label="Sectors" value={`${ownedSectors.length}/${nationSectorThreshold}`} /><Metric label="Rivals" value={`${pressure}%`} /></div>', '      <p className="text-[9px] font-black uppercase tracking-[0.24em] text-amber-200/60">Seat of government</p>\n      <div className="mt-1"><h2 className="text-xl font-black text-amber-50 md:text-2xl">Aurelian Council</h2><p className="mt-1 text-xs leading-relaxed text-amber-50/58">{capital} · {phase} · the current decision comes first.</p></div>\n      <div data-qa="national-health-strip" className="mt-3 grid grid-cols-3 gap-2 text-center"><Metric label="Influence" value={state.resources.influence} /><Metric label="Stability" value={state.settlementStability} /><Metric label="Prosperity" value={state.settlementProsperity} /></div>\n      <p className="mt-2 text-[10px] font-bold uppercase tracking-[0.12em] text-amber-100/42">{population} people · {ownedSectors.length}/{nationSectorThreshold} sectors · rival pressure {pressure}%</p>'),
            ('className="mt-4 rounded-2xl border border-cyan-200/25 bg-cyan-300/10 p-3"><div className="flex items-center justify-between gap-3"><div><p className="text-[9px] font-black uppercase tracking-[0.2em] text-cyan-100/65">National health</p><p className="mt-1 text-sm font-black text-amber-50">{nationFrontierReadiness.ready ? "Frontier ready" : "Recovery required before frontier"}</p></div><span className={`text-[10px] font-black uppercase tracking-[0.16em] ${nationFrontierReadiness.ready ? "text-emerald-100" : "text-amber-100"}`}>{nationFrontierReadiness.ready ? "ready" : "blocked"}</span></div><div className="mt-3 grid grid-cols-2 gap-2 text-center"><Metric label="Stability" value={`${state.settlementStability}/2`} /><Metric label="Prosperity" value={`${state.settlementProsperity}/2`} /></div>{!nationFrontierReadiness.ready ? <p className="mt-2 text-xs leading-relaxed text-amber-50/62">', 'className="mt-3 rounded-2xl border border-cyan-200/18 bg-cyan-300/7 p-3"><div className="flex items-center justify-between gap-3"><div><p className="text-[9px] font-black uppercase tracking-[0.2em] text-cyan-100/55">Frontier readiness</p><p className="mt-1 text-sm font-black text-amber-50">{nationFrontierReadiness.ready ? "National health can support expansion" : "Recovery required before frontier"}</p></div><span className={`text-[10px] font-black uppercase tracking-[0.16em] ${nationFrontierReadiness.ready ? "text-emerald-100" : "text-amber-100"}`}>{nationFrontierReadiness.ready ? "ready" : "blocked"}</span></div>{!nationFrontierReadiness.ready ? <p className="mt-2 text-xs leading-relaxed text-amber-50/62">'),
            ('      <div className="mt-4 space-y-2">{roadmap.map((item) => { const done = item.done(state); return <div key={item.label} data-qa={`roadmap-${item.label.toLowerCase()}`} className={`rounded-2xl border p-3 ${done ? "border-emerald-200/30 bg-emerald-300/10" : "border-amber-100/12 bg-white/5"}`}><div className="flex items-center justify-between gap-3"><p className="text-sm font-black text-amber-50">{item.label}</p><p className={`text-[10px] font-black uppercase tracking-[0.16em] ${done ? "text-emerald-100" : "text-amber-100/45"}`}>{done ? "done" : "next"}</p></div><p className="mt-1 text-xs leading-relaxed text-amber-50/62">{item.detail}</p></div>; })}</div>', '      <details className="mt-4 rounded-2xl border border-amber-100/10 bg-black/18 p-3"><summary className="cursor-pointer text-[10px] font-black uppercase tracking-[0.16em] text-amber-100/48">Progress record · {completed}/13</summary><div className="mt-3 space-y-2">{roadmap.map((item) => { const done = item.done(state); return <div key={item.label} data-qa={`roadmap-${item.label.toLowerCase()}`} className={`rounded-xl border px-3 py-2 ${done ? "border-emerald-200/18 bg-emerald-300/6" : "border-amber-100/8 bg-white/[0.03]"}`}><div className="flex items-center justify-between gap-3"><p className="text-xs font-black text-amber-50/82">{item.label}</p><p className={`text-[9px] font-black uppercase tracking-[0.14em] ${done ? "text-emerald-100/65" : "text-amber-100/35"}`}>{done ? "done" : "next"}</p></div><p className="mt-1 text-[11px] leading-relaxed text-amber-50/45">{item.detail}</p></div>; })}</div></details>'),
            ('return <div data-qa={qa} {...extra} className={`mt-4 rounded-3xl border p-3 ${border}`}><p className="text-[9px] font-black uppercase tracking-[0.2em] text-amber-100/70">{eyebrow}</p><p className="mt-1 text-lg font-black text-amber-50">{title}</p>{body ? <p className="mt-1 text-xs leading-relaxed text-amber-50/62">{body}</p> : null}<div className="mt-3 grid gap-2">{items.map((item) => <button key={item.id} type="button" data-qa={itemQa} {...{ [idAttr]: item.id }} onClick={() => onPick(item.id)} className="rounded-2xl border border-amber-100/20 bg-black/24 p-3 text-left transition hover:border-amber-100/50 hover:bg-amber-200/10"><span className="block text-sm font-black text-amber-50">{item.label}</span><span className="mt-1 block text-xs leading-relaxed text-amber-50/58">{item.short}</span>{item.effect ? <span className="mt-1 block text-[11px] font-bold text-amber-100/70">{item.effect}</span> : null}</button>)}</div></div>;', 'return <div data-qa={qa} {...extra} className={`mt-3 rounded-[1.6rem] border p-4 shadow-xl shadow-black/20 ${border}`}><p className="text-[9px] font-black uppercase tracking-[0.2em] text-amber-100/62">{eyebrow}</p><p className="mt-1 text-xl font-black leading-tight text-amber-50 md:text-2xl">{title}</p>{body ? <p className="mt-2 text-xs leading-relaxed text-amber-50/58">{body}</p> : null}<div className="mt-4 grid gap-2.5">{items.map((item) => <button key={item.id} type="button" data-qa={itemQa} {...{ [idAttr]: item.id }} onClick={() => onPick(item.id)} className="rounded-2xl border border-amber-100/22 bg-black/32 p-4 text-left transition hover:border-amber-100/55 hover:bg-amber-200/12"><span className="block text-base font-black text-amber-50">{item.label}</span><span className="mt-1 block text-xs leading-relaxed text-amber-50/54">{item.short}</span>{item.effect ? <span className="mt-2 block text-[11px] font-black leading-relaxed text-cyan-100/72">{item.effect}</span> : null}</button>)}</div></div>;'),
          ]
          for old, new in replacements:
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'Expected exactly one Council replacement target, got {count}: {old[:120]}')
            text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Verify bounded visual diff
        run: |
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "app/play/components/CouncilPanel.tsx"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Remove transport and commit visual candidate
        run: |
          rm .github/workflows/council-v2-one-shot.yml
          git config user.name "pixel-nations-steward"
          git config user.email "actions@users.noreply.github.com"
          git add app/play/components/CouncilPanel.tsx .github/workflows/council-v2-one-shot.yml
          git diff --cached --check
          git commit -m "feat: focus Council V2 on governance decisions"
          git push origin HEAD:visual/council-v2-governance
