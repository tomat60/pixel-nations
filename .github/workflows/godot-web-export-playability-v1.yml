          grep -F "AURELIAN_NORTH_RIDGE_SPECIALIZATION_PAYOFF=RIDGE_LOGISTICS_LINE_OPEN" "${EVIDENCE_DIR}/browser-console.log"
          test "$(grep -Fc "AURELIAN_NORTH_RIDGE_SPECIALIZATION_PAYOFF=" "${EVIDENCE_DIR}/browser-console.log")" = "1"
          grep -F "PLAYABLE_AURELIAN_ENTRY_STATE=world_first_inter_land_coordination_revealed" "${EVIDENCE_DIR}/browser-console.log"
          grep -F "PLAYABLE_AURELIAN_ENTRY_STATE=map_greenvale_north_ridge_link_inspection" "${EVIDENCE_DIR}/browser-console.log"
          grep -F "PLAYABLE_AURELIAN_ENTRY_STATE=village_first_inter_land_coordination_action" "${EVIDENCE_DIR}/browser-console.log"
          grep -F "AURELIAN_FIRST_INTER_LAND_COORDINATION=RIDGE_CONVOY_DISPATCHED" "${EVIDENCE_DIR}/browser-console.log"
          test "$(grep -Fc "AURELIAN_FIRST_INTER_LAND_COORDINATION=" "${EVIDENCE_DIR}/browser-console.log")" = "1"
          grep -F "PLAYABLE_AURELIAN_ENTRY_STATE=map_ridge_convoy_dispatched" "${EVIDENCE_DIR}/browser-console.log"
          grep -F "PLAYABLE_AURELIAN_ENTRY_STATE=village_ridge_convoy_greenvale_acknowledges" "${EVIDENCE_DIR}/browser-console.log"
          grep -F "PLAYABLE_AURELIAN_ENTRY_STATE=world_coordinated_logistics_network" "${EVIDENCE_DIR}/browser-console.log"
          test "$(grep -Fc "AURELIAN_FIRST_NATIONAL_MANDATE=" "${EVIDENCE_DIR}/browser-console.log")" = "1"
          grep -F "PLAYABLE_AURELIAN_ENTRY_STATE=village_national_mandate_started" "${EVIDENCE_DIR}/browser-console.log"
          grep -F "PLAYABLE_AURELIAN_ENTRY_STATE=map_national_mandate_active" "${EVIDENCE_DIR}/browser-console.log"
          grep -F "PLAYABLE_AURELIAN_ENTRY_STATE=world_national_mandate_underway" "${EVIDENCE_DIR}/browser-console.log"
          sha256sum "${EVIDENCE_DIR}"/stills/*.png "${EVIDENCE_DIR}/godot-web-input-sequence.webm" | tee "${EVIDENCE_DIR}/evidence-sha256sums.txt"
          echo "GODOT_WEB_EXPORT_PLAYABILITY_DETERMINISTIC_QA=PASS"

      - name: Stop local server
        if: always()
        run: |
          if [ -n "${WEB_SERVER_PID:-}" ]; then
            kill "${WEB_SERVER_PID}" || true
          fi

      - name: Upload exact-head browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-web-export-playability-v1-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/godot-web-export-playability-v1
          if-no-files-found: error
          retention-days: 7
