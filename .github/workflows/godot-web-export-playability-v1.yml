      - name: Validate exact browser evidence
        run: |
          set -euo pipefail
          test "$(find "${EVIDENCE_DIR}/stills" -name '*.png' | wc -l)" = "78"
          for image in "${EVIDENCE_DIR}"/stills/*.png; do
            test "$(identify -format '%wx%h' "$image")" = "1440x900"
            bytes="$(stat -c %s "$image")"
            echo "$(basename "$image") $bytes"
            test "$bytes" -gt 60000
          done
          test -s "${EVIDENCE_DIR}/godot-web-input-sequence.webm"
          test "$(stat -c %s "${EVIDENCE_DIR}/godot-web-input-sequence.webm")" -gt 100000
          video_duration="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "${EVIDENCE_DIR}/godot-web-input-sequence.webm")"
