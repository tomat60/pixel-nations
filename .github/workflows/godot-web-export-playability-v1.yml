name: Godot Web Export Playability V1

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/godot-web-export-playability-v1.yml"
      - "game/project.godot"
      - "game/export_presets.cfg"
      - "game/scenes/aurelian/**"
      - "game/tests/**"
      - "game/assets/aurelian-basin/export/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-web-export-playability-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.1"
  GODOT_RELEASE: "4.7.1-stable"
  GODOT_BIN: "/tmp/godot/Godot_v4.7.1-stable_linux.x86_64"
  EVIDENCE_DIR: "evidence/godot-web-export-playability-v1"
  GLB_SHA256: "04116e3d662d461f0d29ca797444193b0873f5aba6012790af7d366c63e01048"

jobs:
  prove-web-playability:
    name: Prove Godot Web export playability
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Record exact head
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_DIR}/stills"
          cp game/scenes/aurelian/aurelian_living_capital_vertical_slice_v1_manifest.json "${EVIDENCE_DIR}/living-capital-manifest.json"
          cp game/scenes/aurelian/first_national_mandate_v1_manifest.json "${EVIDENCE_DIR}/national-mandate-manifest.json"
          cp game/scenes/aurelian/first_empire_proclamation_v1_manifest.json "${EVIDENCE_DIR}/empire-proclamation-manifest.json"
          cp game/scenes/aurelian/directional_empire_identity_v1_manifest.json "${EVIDENCE_DIR}/directional-empire-identity-manifest.json"
          cp game/scenes/aurelian/river_surge_crisis_v1_manifest.json "${EVIDENCE_DIR}/river-surge-crisis-manifest.json"
          cp game/scenes/aurelian/first_rival_countermove_v1_manifest.json "${EVIDENCE_DIR}/first-rival-countermove-manifest.json"
          cp game/scenes/aurelian/first_frontier_payoff_v1_manifest.json "${EVIDENCE_DIR}/first-frontier-payoff-manifest.json"
          cp game/scenes/aurelian/first_imperial_expansion_v1_manifest.json "${EVIDENCE_DIR}/first-imperial-expansion-manifest.json"
          cp game/scenes/aurelian/first_inter_land_coordination_v1_manifest.json "${EVIDENCE_DIR}/first-inter-land-coordination-manifest.json"
          git rev-parse HEAD | tee "${EVIDENCE_DIR}/exact-head.txt"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          fi

      - name: Install existing browser and runtime tools
        timeout-minutes: 8
        run: |
          set -euo pipefail
          npm ci
          npx playwright install chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends unzip libgl1 imagemagick ffmpeg >/dev/null

      - name: Download pinned Godot and export templates
        timeout-minutes: 7
        run: |
          set -euo pipefail
          mkdir -p /tmp/godot /tmp/godot-templates
          curl -fsSL --retry 4 --retry-all-errors --connect-timeout 20 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" \
            -o /tmp/godot/godot.zip
          curl -fsSL --retry 4 --retry-all-errors --connect-timeout 20 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz" \
            -o /tmp/godot/templates.tpz
          unzip -q /tmp/godot/godot.zip -d /tmp/godot
          chmod +x "${GODOT_BIN}"
          unzip -q /tmp/godot/templates.tpz -d /tmp/godot-templates
          mkdir -p "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cp -R /tmp/godot-templates/templates/. "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          "${GODOT_BIN}" --version | tee "${EVIDENCE_DIR}/godot-version.txt"

      - name: Prove packaged identity and native contracts
        timeout-minutes: 7
        run: |
          set -euo pipefail
          test "$(sha256sum game/assets/aurelian-basin/export/aurelian_authored_terrain_v1.glb | cut -d' ' -f1)" = "${GLB_SHA256}"
          "${GODOT_BIN}" --headless --path game --editor --quit > "${EVIDENCE_DIR}/godot-import.log" 2>&1
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Blender path is invalid" "${EVIDENCE_DIR}/godot-import.log"; then
            cat "${EVIDENCE_DIR}/godot-import.log"
            exit 1
          fi
          for test in aurelian_authored_terrain_v1_test production_village_v1_test production_map_v1_test production_world_v1_test aurelian_decision_loop_v1_test playable_aurelian_entry_v1_test aurelian_session_persistence_v2_test aurelian_first_land_claim_v1_test aurelian_first_settlement_development_v1_test aurelian_first_trade_route_connection_v1_test aurelian_first_trade_caravan_dispatch_v1_test aurelian_first_city_charter_v1_test aurelian_first_nation_founding_v1_test aurelian_living_capital_vertical_slice_v1_test aurelian_first_national_direction_commitment_v1_test aurelian_first_national_mandate_v1_test aurelian_first_empire_proclamation_v1_test aurelian_directional_empire_identity_v1_test aurelian_river_surge_crisis_v1_test aurelian_first_rival_countermove_v1_test aurelian_first_frontier_payoff_v1_test aurelian_first_imperial_expansion_v1_test aurelian_first_inter_land_coordination_v1_test; do
            "${GODOT_BIN}" --headless --path game --script "res://tests/${test}.gd" > "${EVIDENCE_DIR}/${test}.log" 2>&1 || { cat "${EVIDENCE_DIR}/${test}.log"; exit 1; }
          done
          grep -F "GODOT_PLAYABLE_AURELIAN_ENTRY_V1_TEST: PASS" "${EVIDENCE_DIR}/playable_aurelian_entry_v1_test.log"
          grep -F "GODOT_AURELIAN_FIRST_LAND_CLAIM_V1_TEST: PASS" "${EVIDENCE_DIR}/aurelian_first_land_claim_v1_test.log"
          grep -F "GODOT_AURELIAN_FIRST_SETTLEMENT_DEVELOPMENT_V1_TEST: PASS" "${EVIDENCE_DIR}/aurelian_first_settlement_development_v1_test.log"
          grep -F "GODOT_AURELIAN_FIRST_TRADE_ROUTE_CONNECTION_V1_TEST: PASS" "${EVIDENCE_DIR}/aurelian_first_trade_route_connection_v1_test.log"
          grep -F "GODOT_AURELIAN_FIRST_TRADE_CARAVAN_DISPATCH_V1_TEST: PASS" "${EVIDENCE_DIR}/aurelian_first_trade_caravan_dispatch_v1_test.log"
          grep -F "GODOT_AURELIAN_FIRST_CITY_CHARTER_V1_TEST: PASS" "${EVIDENCE_DIR}/aurelian_first_city_charter_v1_test.log"
          grep -F "GODOT_AURELIAN_FIRST_NATION_FOUNDING_V1_TEST: PASS" "${EVIDENCE_DIR}/aurelian_first_nation_founding_v1_test.log"
          grep -F "AURELIAN_LIVING_CAPITAL_VERTICAL_SLICE_V1_TEST: PASS" "${EVIDENCE_DIR}/aurelian_living_capital_vertical_slice_v1_test.log"
          grep -F "GODOT_AURELIAN_FIRST_NATIONAL_DIRECTION_COMMITMENT_V1_TEST: PASS" "${EVIDENCE_DIR}/aurelian_first_national_direction_commitment_v1_test.log"
          grep -F "GODOT_AURELIAN_FIRST_NATIONAL_MANDATE_V1_TEST: PASS" "${EVIDENCE_DIR}/aurelian_first_national_mandate_v1_test.log"
          grep -F "GODOT_AURELIAN_FIRST_EMPIRE_PROCLAMATION_V1_TEST: PASS" "${EVIDENCE_DIR}/aurelian_first_empire_proclamation_v1_test.log"
          grep -F "GODOT_AURELIAN_DIRECTIONAL_EMPIRE_IDENTITY_V1_TEST: PASS" "${EVIDENCE_DIR}/aurelian_directional_empire_identity_v1_test.log"
          grep -F "GODOT_AURELIAN_RIVER_SURGE_CRISIS_V1_TEST: PASS" "${EVIDENCE_DIR}/aurelian_river_surge_crisis_v1_test.log"
          grep -F "GODOT_AURELIAN_FIRST_RIVAL_COUNTERMOVE_V1_TEST: PASS" "${EVIDENCE_DIR}/aurelian_first_rival_countermove_v1_test.log"
          grep -F "GODOT_AURELIAN_FIRST_FRONTIER_PAYOFF_V1_TEST: PASS" "${EVIDENCE_DIR}/aurelian_first_frontier_payoff_v1_test.log"
          grep -F "GODOT_AURELIAN_FIRST_IMPERIAL_EXPANSION_V1_TEST: PASS" "${EVIDENCE_DIR}/aurelian_first_imperial_expansion_v1_test.log"
          grep -F "GODOT_AURELIAN_FIRST_INTER_LAND_COORDINATION_V1_TEST: PASS" "${EVIDENCE_DIR}/aurelian_first_inter_land_coordination_v1_test.log"

      - name: Export canonical Linux and Web builds
        timeout-minutes: 8
        run: |
          set -euo pipefail
          mkdir -p game/build/linux game/build/web
          "${GODOT_BIN}" --headless --path game --export-release "Linux/X11" build/linux/pixel-nations-foundation.x86_64 > "${EVIDENCE_DIR}/godot-export-linux.log" 2>&1
          "${GODOT_BIN}" --headless --path game --export-release "Web" build/web/index.html > "${EVIDENCE_DIR}/godot-export-web.log" 2>&1
          test -x game/build/linux/pixel-nations-foundation.x86_64
          test -s game/build/linux/pixel-nations-foundation.pck
          test -s game/build/web/index.html
          test -s game/build/web/index.pck
          test -s game/build/web/index.wasm
          grep -aF "aurelian_authored_terrain_v1.glb" game/build/linux/pixel-nations-foundation.pck
          grep -aF "aurelian_authored_terrain_v1.glb" game/build/web/index.pck
          (
            cd game/build/linux
            timeout 30s env -u AURELIAN_EVIDENCE_DIR -u AURELIAN_PLAYABLE_EVIDENCE_STATE \
              -u AURELIAN_CAPTURE_PLAYABLE_ENTRY GODOT_SILENCE_ROOT_WARNING=1 \
              ./pixel-nations-foundation.x86_64 --headless
          ) > "${EVIDENCE_DIR}/native-headless.log" 2>&1
          grep -F "PLAYABLE_AURELIAN_HEADLESS_SMOKE=PASS" "${EVIDENCE_DIR}/native-headless.log"
          sha256sum game/build/web/* | tee "${EVIDENCE_DIR}/web-export-sha256sums.txt"

      - name: Serve fresh Web export
        run: |
          set -euo pipefail
          python3 -m http.server 8060 --bind 127.0.0.1 --directory game/build/web > "${EVIDENCE_DIR}/http-server.log" 2>&1 &
          echo "WEB_SERVER_PID=$!" >> "$GITHUB_ENV"
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8060/index.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Drive normal browser input and capture evidence
        timeout-minutes: 7
        run: |
          set -euo pipefail
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');

          const root = path.resolve(process.env.EVIDENCE_DIR);
          const stills = path.join(root, 'stills');
          fs.mkdirSync(stills, { recursive: true });
          const consoleLines = [];
          const requestFailures = [];
          const responseFailures = [];
          const observedStates = [];

          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          async function waitForCount(value, count, timeout = 30000) {
            const started = Date.now();
            while (Date.now() - started < timeout) {
              if (observedStates.filter(state => state === value).length >= count) return;
              await sleep(100);
            }
            throw new Error(`Timed out waiting for ${value} count ${count}; observed=${observedStates.join(',')}`);
          }

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: ['--use-gl=swiftshader', '--enable-webgl', '--ignore-gpu-blocklist']
            });
            const context = await browser.newContext({
              viewport: { width: 1440, height: 900 },
              recordVideo: { dir: path.join(root, 'video-tmp'), size: { width: 1440, height: 900 } }
            });
            const page = await context.newPage();
            page.on('console', msg => {
              const line = `[${msg.type()}] ${msg.text()}`;
              consoleLines.push(line);
              const match = msg.text().match(/PLAYABLE_AURELIAN_ENTRY_STATE=([a-z_]+)/);
              if (match) observedStates.push(match[1]);
            });
            page.on('pageerror', error => consoleLines.push(`[pageerror] ${error.stack || error.message}`));
            page.on('requestfailed', request => requestFailures.push({
              url: request.url(),
              error: request.failure()?.errorText || 'unknown'
            }));
            page.on('response', response => {
              if (response.status() >= 400) responseFailures.push({ url: response.url(), status: response.status() });
            });

            await page.goto('http://127.0.0.1:8060/index.html', { waitUntil: 'domcontentloaded', timeout: 90000 });
            await page.locator('canvas').waitFor({ state: 'visible', timeout: 90000 });
            const readyStarted = Date.now();
            while (!consoleLines.some(line => line.includes('PLAYABLE_AURELIAN_ENTRY_READY=world_neutral'))) {
              if (Date.now() - readyStarted > 90000) throw new Error('Timed out waiting for normal Web entry readiness');
              await sleep(100);
            }
            await page.locator('canvas').click();
            await sleep(1000);
            await page.screenshot({ path: path.join(stills, '01-world-neutral-1440x900.png') });

            await page.keyboard.press('Enter');
            await waitForCount('world_trade_selected', 1);
            await sleep(1000);
            await page.screenshot({ path: path.join(stills, '02-world-trade-selected-1440x900.png') });

            await page.keyboard.press('ArrowRight');
            await waitForCount('map_east_route_selected', 1);
            await sleep(1000);
            await page.screenshot({ path: path.join(stills, '03-map-east-route-selected-1440x900.png') });

            await page.keyboard.press('Enter');
            await waitForCount('map_east_route_claimed', 1);
            await sleep(1000);
            await page.screenshot({ path: path.join(stills, '04-map-east-route-claimed-1440x900.png') });

            await page.keyboard.press('ArrowRight');
            await waitForCount('village_claimed', 1);
            await sleep(1000);
            await page.screenshot({ path: path.join(stills, '05-village-claimed-1440x900.png') });

            await page.keyboard.press('Enter');
            await waitForCount('village_founded', 1);
            await sleep(1000);
            await page.screenshot({ path: path.join(stills, '06-village-founded-action-1440x900.png') });

            await page.keyboard.press('Enter');
            await waitForCount('village_developed', 1);
            await sleep(1000);
            await page.screenshot({ path: path.join(stills, '07-village-developed-1440x900.png') });

            await page.keyboard.press('ArrowLeft');
            await waitForCount('map_east_route_claimed', 2);
            await sleep(1000);
            await page.screenshot({ path: path.join(stills, '08-returned-claimed-map-1440x900.png') });

            await page.keyboard.press('Enter');
            await waitForCount('map_east_route_connected', 1);
            await sleep(1000);
            await page.screenshot({ path: path.join(stills, '09-map-east-route-connected-1440x900.png') });

            await page.keyboard.press('ArrowLeft');
            await waitForCount('world_trade_route_active', 1);
            await sleep(1000);
            await page.screenshot({ path: path.join(stills, '10-world-trade-route-active-1440x900.png') });

            await page.keyboard.press('ArrowRight');
            await waitForCount('map_east_route_connected', 2);
            await sleep(1000);
            await page.screenshot({ path: path.join(stills, '11-reopened-connected-map-1440x900.png') });

            await page.keyboard.press('ArrowRight');
            await waitForCount('village_developed', 2);
            await sleep(1000);
            await page.screenshot({ path: path.join(stills, '12-reopened-village-developed-1440x900.png') });

            await page.keyboard.press('Enter');
            await waitForCount('village_trade_dispatched', 1);
            await sleep(1000);
            await page.screenshot({ path: path.join(stills, '13-village-first-caravan-dispatched-1440x900.png') });

            await page.keyboard.press('ArrowLeft');
            await waitForCount('map_east_route_in_use', 1);
            await sleep(1000);
            await page.screenshot({ path: path.join(stills, '14-map-east-route-in-use-1440x900.png') });

            await page.keyboard.press('ArrowLeft');
            await waitForCount('world_first_trade_underway', 1);
            await sleep(1000);
            await page.screenshot({ path: path.join(stills, '15-world-first-trade-underway-1440x900.png') });

            await page.keyboard.press('ArrowRight');
            await waitForCount('map_east_route_in_use', 2);
            await page.keyboard.press('ArrowRight');
            await waitForCount('village_trade_dispatched', 2);
            await sleep(1000);
            await page.screenshot({ path: path.join(stills, '16-village-before-city-charter-1440x900.png') });

            await page.keyboard.press('Enter');
            await waitForCount('village_city_chartered', 1);
            await sleep(1000);
            await page.screenshot({ path: path.join(stills, '17-village-first-city-chartered-1440x900.png') });

            await page.keyboard.press('ArrowLeft');
            await waitForCount('map_greenvale_city', 1);
            await sleep(1000);
            await page.screenshot({ path: path.join(stills, '18-map-greenvale-city-1440x900.png') });

            await page.keyboard.press('ArrowLeft');
            await waitForCount('world_first_city_recognized', 1);
            await sleep(1000);
            await page.screenshot({ path: path.join(stills, '19-world-first-city-recognized-1440x900.png') });

            await page.keyboard.press('Enter');
            await waitForCount('world_first_nation_founded', 1);
            await sleep(1000);
            await page.screenshot({ path: path.join(stills, '20-world-direction-trade-inspected-1440x900.png') });
            await page.keyboard.press('ArrowDown');
            await sleep(700);
            await page.screenshot({ path: path.join(stills, '21-world-direction-expand-inspected-1440x900.png') });
            await page.keyboard.press('ArrowDown');
            await sleep(700);
            await page.screenshot({ path: path.join(stills, '22-world-direction-frontier-inspected-1440x900.png') });
            await page.keyboard.press('ArrowUp');
            await page.keyboard.press('Enter');
            await waitForCount('world_first_nation_founded', 2);
            await sleep(1000);
            await page.screenshot({ path: path.join(stills, '23-world-direction-expand-committed-1440x900.png') });

            await page.keyboard.press('ArrowRight');
            await waitForCount('map_aurelian_homeland', 1);
            await sleep(1000);
            await page.screenshot({ path: path.join(stills, '24-map-aurelian-homeland-expand-1440x900.png') });

            await page.keyboard.press('ArrowRight');
            await waitForCount('village_greenvale_capital', 1);
            await sleep(1000);
            await page.screenshot({ path: path.join(stills, '25-village-greenvale-capital-expand-1440x900.png') });

            await page.keyboard.press('Enter');
            await waitForCount('village_national_mandate_started', 1);
            await sleep(1000);
            await page.screenshot({ path: path.join(stills, '26-village-national-mandate-started-expand-1440x900.png') });

            await page.keyboard.press('ArrowLeft');
            await waitForCount('map_national_mandate_active', 1);
            await sleep(1000);
            await page.screenshot({ path: path.join(stills, '27-map-national-mandate-active-expand-1440x900.png') });

            await page.keyboard.press('ArrowLeft');
            await waitForCount('world_national_mandate_underway', 1);
            await sleep(1000);
            await page.screenshot({ path: path.join(stills, '28-world-national-mandate-underway-expand-1440x900.png') });

            await page.keyboard.press('ArrowRight');
            await waitForCount('map_national_mandate_active', 2);
            await page.keyboard.press('ArrowRight');
            await waitForCount('village_national_mandate_started', 2);
            await sleep(1000);
            await page.screenshot({ path: path.join(stills, '29-village-before-empire-proclamation-expand-1440x900.png') });

            await page.keyboard.press('Enter');
            await waitForCount('village_aurelian_imperial_capital', 1);
            await sleep(1000);
            await page.screenshot({ path: path.join(stills, '30-village-aurelian-imperial-capital-expand-1440x900.png') });

            await page.keyboard.press('ArrowLeft');
            await waitForCount('map_aurelian_imperial_heartland', 1);
            await sleep(1000);
            await page.screenshot({ path: path.join(stills, '31-map-aurelian-imperial-heartland-expand-1440x900.png') });

            await page.keyboard.press('ArrowLeft');
            await waitForCount('world_first_empire_proclaimed', 1);
            await sleep(1000);
            await page.screenshot({ path: path.join(stills, '32-world-first-empire-proclaimed-expand-1440x900.png') });

            await page.keyboard.press('Enter');
            await waitForCount('world_river_surge_crisis', 1);
            await sleep(1000);
            await page.screenshot({ path: path.join(stills, '33-world-river-surge-crisis-expand-1440x900.png') });

            await page.keyboard.press('ArrowRight');
            await waitForCount('map_river_surge_response_loci', 1);
            await sleep(1000);
            await page.screenshot({ path: path.join(stills, '34-map-river-surge-response-loci-expand-1440x900.png') });

            await page.keyboard.press('ArrowRight');
            await waitForCount('village_river_surge_response_pending', 1);
            await sleep(1000);
            await page.screenshot({ path: path.join(stills, '35-village-river-surge-response-pending-expand-1440x900.png') });

            await page.keyboard.press('Enter');
            await waitForCount('village_aurelian_imperial_capital_greenvale_shielded', 1);
            await sleep(1000);
            await page.screenshot({ path: path.join(stills, '36-village-greenvale-shielded-expand-1440x900.png') });

            await page.keyboard.press('ArrowLeft');
            await waitForCount('map_aurelian_imperial_heartland_greenvale_response', 1);
            await sleep(1000);
            await page.screenshot({ path: path.join(stills, '37-map-greenvale-response-expand-1440x900.png') });

            await page.keyboard.press('ArrowLeft');
            await waitForCount('world_aurelian_river_surge_greenvale_response', 1);
            await sleep(1000);
            await page.screenshot({ path: path.join(stills, '38-world-greenvale-response-expand-1440x900.png') });

            await page.keyboard.press('Enter');
            await waitForCount('world_first_rival_countermove', 1);
            await sleep(1000);
            await page.screenshot({ path: path.join(stills, '39-world-first-rival-countermove-expand-1440x900.png') });

            await page.keyboard.press('ArrowRight');
            await waitForCount('map_first_rival_countermove_east_bridge', 1);
            await sleep(1000);
            await page.screenshot({ path: path.join(stills, '40-map-first-rival-east-bridge-pressure-expand-1440x900.png') });

            await page.keyboard.press('ArrowRight');
            await waitForCount('village_first_rival_response_pending', 1);
            await sleep(1000);
