name: Pixel Nations Ops Report

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  ops-report:
    name: Generate ops report
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PN_OPS_REPORT_DIR: ${{ github.workspace }}/ops-artifacts
      PN_OPS_WORKSPACE: ${{ github.workspace }}/ops-workspace

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Generate ops report
        run: npm run pn:ops-report

      - name: Upload ops report artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixel-nations-ops-report
          path: ops-artifacts/
          if-no-files-found: error
          retention-days: 14

