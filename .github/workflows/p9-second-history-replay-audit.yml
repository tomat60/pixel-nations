name: P9 Second-History Replay Audit

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  p9-second-history-replay-audit:
    name: Verify second-history replay continuity
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Verify second-history replay continuity
        run: node scripts/qa-p9-second-history-replay-audit.mjs

      - name: Upload P9 replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixel-nations-p9-second-history-replay-audit
          path: public/qa/p9-second-history-replay-audit
          if-no-files-found: error
          retention-days: 7
