name: P10 Previous Founder Record Evidence

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  p10-current-decision-visibility:
    name: Verify previous Founder Record retention
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Build
        run: npm run build

      - name: Verify previous Founder Record retention
        run: node scripts/qa-p10-previous-founder-record.mjs

      - name: Upload P10 previous-Founder-Record evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixel-nations-p10-previous-founder-record-evidence
          path: public/qa/p10-previous-founder-record
          if-no-files-found: error
          retention-days: 7
