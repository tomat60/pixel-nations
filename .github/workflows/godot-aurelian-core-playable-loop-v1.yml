name: Godot Aurelian Core Playable Loop V1

on:
  pull_request:
    branches: [main]
    paths:
      - "game/scenes/aurelian/playable_aurelian_first_session_v1.gd"
      - "game/scenes/aurelian/playable_aurelian_entry_v1.gd"
      - "game/scenes/aurelian/playable_aurelian_entry_v1.tscn"
      - "game/scenes/aurelian/playable_aurelian_entry_v1_manifest.json"
      - "game/tests/aurelian_core_playable_loop_v1_test.gd"
      - ".github/workflows/godot-aurelian-core-playable-loop-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_RELEASE: "4.7.1-stable"
  GODOT_BIN: "/tmp/godot/Godot_v4.7.1-stable_linux.x86_64"

jobs:
  core-loop-contract:
    name: Parse and test bounded first session
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Record exact head
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee exact-head.txt
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          fi

      - name: Download pinned Godot
        run: |
          set -euo pipefail
          mkdir -p /tmp/godot
          curl -fsSL --retry 4 --retry-all-errors --connect-timeout 20 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" \
            -o /tmp/godot/godot.zip
          unzip -q /tmp/godot/godot.zip -d /tmp/godot
          chmod +x "${GODOT_BIN}"
          "${GODOT_BIN}" --version

      - name: Run core playable loop contract
        run: |
          set -euo pipefail
          "${GODOT_BIN}" --headless --path game --script res://tests/aurelian_core_playable_loop_v1_test.gd \
            2>&1 | tee core-playable-loop.log
          grep -F "AURELIAN_CORE_PLAYABLE_LOOP_V1_TEST: PASS" core-playable-loop.log
