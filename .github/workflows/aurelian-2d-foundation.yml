name: Aurelian 2D Foundation Proof

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/aurelian-2d-foundation.yml
      - tools/qa/run_aurelian_2d_foundation_proof.sh
      - game/scenes/art_target/aurelian_2d_capture.gd
      - game/scenes/art_target/aurelian_2d_capture.tscn
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  prove-2d-map:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact 2D foundation branch
        uses: actions/checkout@v4
        with:
          ref: art-target/aurelian-2d-foundation
          fetch-depth: 0

      - name: Run deterministic Aurelian 2D foundation proof
        run: |
          set -euo pipefail
          chmod +x tools/qa/run_aurelian_2d_foundation_proof.sh
          tools/qa/run_aurelian_2d_foundation_proof.sh

      - name: Upload Aurelian 2D foundation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurelian-2d-foundation-${{ github.run_id }}
          path: evidence/aurelian-2d-foundation/**
          if-no-files-found: warn
          retention-days: 30

      - name: Report 2D foundation proof run
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:314,body:`## Aurelian 2D foundation proof run ${context.runId}\n\n- Event SHA: \`${context.sha}\`\n- Job status: \`${{ job.status }}\`\n- Artifact: \`aurelian-2d-foundation-${context.runId}\`\n- The accepted Blender desktop and portrait renders are reproduced, imported as native Godot 2D textures, captured at exact dimensions and compared perceptually/pixelwise.\n- Direct visual review remains mandatory before classification.\n\nNo 3D renderer retry, user operation, payment, MAX, public-main write, merge or deployment was used.`})
