name: Godot Aurelian Full Progression Visual Grammar v2 Gate A

on:
  pull_request:
    branches: [main]
    paths:
      - "game/scenes/aurelian/full_progression_visual_grammar_v2.gd"
      - "game/scenes/aurelian/full_progression_visual_grammar_v2.tscn"
      - "game/scenes/aurelian/full_progression_visual_grammar_v2_manifest.json"
      - "game/tests/aurelian_full_progression_visual_grammar_v2_test.gd"
      - ".github/workflows/godot-aurelian-full-progression-visual-grammar-v2-gate-a.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-progression-v2-gate-a-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GODOT_RELEASE: "4.7.1-stable"
  GODOT_BIN: "/tmp/godot/Godot_v4.7.1-stable_linux.x86_64"
  EVIDENCE_DIR: "evidence/full-progression-visual-grammar-v2-gate-a"

jobs:
  gate-a-village-recognition:
    name: Render fixed-camera five-stage Village strip
    runs-on: ubuntu-latest
    timeout-minutes: 16

    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Record exact head
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_DIR}"
          git rev-parse HEAD | tee "${EVIDENCE_DIR}/exact-head.txt"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          fi
          test -s game/assets/aurelian-basin/export/aurelian_authored_terrain_v1.glb

      - name: Download pinned Godot 4.7.1
        timeout-minutes: 5
        run: |
          set -euo pipefail
          rm -rf /tmp/godot
          mkdir -p /tmp/godot
          curl -fsSL --retry 4 --retry-all-errors --connect-timeout 20 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" \
            -o /tmp/godot/godot.zip
          unzip -q /tmp/godot/godot.zip -d /tmp/godot
          chmod +x "${GODOT_BIN}"
          "${GODOT_BIN}" --version | tee "${EVIDENCE_DIR}/godot-version.txt"
          python3 -m pip install --disable-pip-version-check --quiet --user pillow

      - name: Import and run focused contracts
        timeout-minutes: 4
        run: |
          set -euo pipefail
          "${GODOT_BIN}" --headless --path game --editor --quit > "${EVIDENCE_DIR}/godot-import.log" 2>&1 || {
            cat "${EVIDENCE_DIR}/godot-import.log"; exit 1;
          }
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Blender path is invalid" "${EVIDENCE_DIR}/godot-import.log"; then
            cat "${EVIDENCE_DIR}/godot-import.log"
            exit 1
          fi
          "${GODOT_BIN}" --headless --path game --script res://tests/aurelian_authored_terrain_v1_test.gd \
            > "${EVIDENCE_DIR}/foundation.log" 2>&1
          grep -F "AURELIAN_AUTHORED_TERRAIN_V1_TEST: PASS" "${EVIDENCE_DIR}/foundation.log"
          "${GODOT_BIN}" --headless --path game --script res://tests/production_village_v1_test.gd \
            > "${EVIDENCE_DIR}/production-village.log" 2>&1
          grep -F "PRODUCTION_VILLAGE_V1_TEST: PASS" "${EVIDENCE_DIR}/production-village.log"
          "${GODOT_BIN}" --headless --path game --script res://tests/aurelian_full_progression_visual_grammar_v2_test.gd \
            > "${EVIDENCE_DIR}/visual-grammar-v2.log" 2>&1
          grep -F "AURELIAN_FULL_PROGRESSION_VISUAL_GRAMMAR_V2_TEST: PASS" "${EVIDENCE_DIR}/visual-grammar-v2.log"

      - name: Capture five fixed-camera Village stages
        timeout-minutes: 6
        run: |
          set -euo pipefail
          for stage in land settlement city nation empire; do
            case "$stage" in
              land) base="claimed" ;;
              settlement) base="founded" ;;
              *) base="city_chartered" ;;
            esac
            stage_dir="${EVIDENCE_DIR}/tmp-${stage}"
            mkdir -p "$stage_dir"
            timeout 75s xvfb-run -a -s "-screen 0 1600x1000x24" env \
              AURELIAN_EVIDENCE_DIR="$PWD/$stage_dir" \
              AURELIAN_CAPTURE_PRESET=village \
              AURELIAN_PROGRESSION_STAGE="$stage" \
              "${GODOT_BIN}" --path game --audio-driver Dummy --rendering-method gl_compatibility \
              res://scenes/aurelian/full_progression_visual_grammar_v2.tscn \
              > "${EVIDENCE_DIR}/${stage}.log" 2>&1
            grep -F "FULL_PROGRESSION_VISUAL_GRAMMAR_V2_READY=${stage}" "${EVIDENCE_DIR}/${stage}.log"
            grep -F "PRODUCTION_VILLAGE_STILL=village:${base}:" "${EVIDENCE_DIR}/${stage}.log"
            test -s "$stage_dir/village-${base}-1440x900.png"
            cp "$stage_dir/village-${base}-1440x900.png" "${EVIDENCE_DIR}/${stage}-village-1440x900.png"
          done

      - name: Build unlabeled recognition strip and deterministic QA
        timeout-minutes: 2
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from PIL import Image, ImageChops, ImageStat

          root = Path(os.environ['EVIDENCE_DIR'])
          stages = ['land','settlement','city','nation','empire']
          samples = {}
          report = {}
          for stage in stages:
              path = root / f'{stage}-village-1440x900.png'
              image = Image.open(path).convert('RGB')
              if image.size != (1440,900):
                  raise SystemExit(f'{stage}: wrong size {image.size}')
              variance = sum(ImageStat.Stat(image).var) / 3.0
              if path.stat().st_size < 70000 or variance < 45.0:
                  raise SystemExit(f'{stage}: weak evidence bytes={path.stat().st_size} variance={variance:.2f}')
              samples[stage] = image.resize((240,150))
              report[stage] = {
                  'bytes': path.stat().st_size,
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                  'variance': round(variance,3),
              }

          adjacent = []
          for a,b in zip(stages, stages[1:]):
              diff = ImageChops.difference(samples[a], samples[b])
              changed = sum(1 for pixel in diff.getdata() if pixel != (0,0,0))
              if changed < 350:
                  raise SystemExit(f'physical stage delta too small: {a}/{b} changed={changed}')
              adjacent.append({'from':a,'to':b,'changed_sample_pixels':changed})

          canvas = Image.new('RGB',(360*5,225),(150,155,148))
          for i,stage in enumerate(stages):
              thumb = Image.open(root/f'{stage}-village-1440x900.png').convert('RGB').resize((360,225))
              canvas.paste(thumb,(i*360,0))
          canvas.save(root/'gate-a-unlabeled-village-strip.jpg',quality=94)

          qa = {
              'status':'PASS_DETERMINISTIC_ONLY_PENDING_DIRECT_VISUAL_RECOGNITION',
              'exact_head':(root/'exact-head.txt').read_text().strip(),
              'fixed_camera_view':'village',
              'stages':report,
              'adjacent_deltas':adjacent,
          }
          (root/'gate-a-qa.json').write_text(json.dumps(qa,indent=2)+'\n')
          print('AURELIAN_FULL_PROGRESSION_VISUAL_GRAMMAR_V2_GATE_A_DETERMINISTIC=PASS')
          PY

      - name: Upload Gate A artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-progression-visual-grammar-v2-gate-a-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/full-progression-visual-grammar-v2-gate-a
          if-no-files-found: error
          retention-days: 7
